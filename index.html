<!DOCTYPE html>
<!--
  Bookmark Vault 2.0 — single-file HTML bookmark start page.
  Open by double-clicking in any modern browser. No build step, no npm, no server.

  What's new vs 1.0 (bolder redesign):
    • Light / dark / auto themes, custom accent color, comfortable/compact density.
    • Serif-display + system-sans pairing (no network fonts).
    • Smart search: engine switcher + DuckDuckGo "!bang" passthrough.
    • Command palette (Ctrl/Cmd+K): fuzzy search bookmarks AND actions.
    • Drag-and-drop bookmarks (reorder + move between collections) and collections.
    • Quick-add: paste a URL, auto-title + live favicon preview, duplicate detection.
    • Per-collection view modes; per-bookmark custom icon/emoji, note, and tags.
    • Widgets: calendar (week numbers, holidays, multi-month), quick-notes / todo panel.
    • Netscape-HTML bookmark import (folders -> collections) + versioned JSON import/export.
    • Undo on delete, keyboard quick-launch (1-9), full a11y (focus trap, inert, ARIA).

  External resources (network is optional; the app is fully usable offline):
    • DuckDuckGo favicon API (icons.duckduckgo.com/ip3/<domain>.ico) — per-bookmark, on
      demand; 404 on miss so the <img> onerror fires and we draw a colored-letter avatar.
    • The search bar posts to the chosen engine only when you submit a query.
  Everything else (CSS, JS, icons, state) is inlined. Fonts fall back to system faces.

  Persisted state (localStorage):
    bookmarkvault:v2   — the whole store (collections, bookmarks, notes, settings, view)
  Legacy 1.0 keys (startpage:groups / :bookmarks / :settings / :view) are read once and
  migrated into bookmarkvault:v2; they are left untouched so 1.0 still opens if reused.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookmark Vault</title>
  <meta name="theme-color" content="#0c0d10" />
  <meta name="application-name" content="Bookmark Vault" />
  <meta name="apple-mobile-web-app-title" content="Bookmark Vault" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/svg+xml" href="BVicon.svg" />
  <!-- Set theme + accent before first paint to avoid a flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('bookmarkvault:v2');
        var s = raw ? (JSON.parse(raw).settings || {}) : {};
        // Fall back to legacy 1.0 accent if present and v2 not written yet.
        if (!raw) {
          var legacy = localStorage.getItem('startpage:settings');
          if (legacy) { try { s.accentColor = (JSON.parse(legacy) || {}).accentColor || s.accentColor; } catch (e) {} }
        }
        var theme = s.theme || 'auto';
        if (theme === 'auto') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-density', s.density || 'comfortable');
        root.setAttribute('data-bg', s.background || 'aurora');
        if (s.accentColor) root.style.setProperty('--accent', s.accentColor);
      } catch (e) {}
    })();
  </script>
  <style>
    /* ─────────────────────────────────────────────────────────────────────
       Reset
       ───────────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }
    :where(button, input, textarea, select) { font: inherit; color: inherit; }
    button { background: none; border: none; cursor: pointer; }
    a { color: inherit; }
    img { max-width: 100%; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* ─────────────────────────────────────────────────────────────────────
       Design tokens
       ───────────────────────────────────────────────────────────────────── */
    :root {
      --font-display: 'Cormorant Garamond', Cormorant, 'Hoefler Text', Didot, 'Bodoni 72',
                      'Big Caslon', Garamond, 'EB Garamond', 'Palatino Linotype', Palatino,
                      Baskerville, Georgia, serif;
      --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
                 'Noto Sans', sans-serif;
      --font-num: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo,
                  Consolas, monospace;

      --accent: #c9a227;
      --danger: #d6605a;
      --success: #6fae74;

      /* radius / spacing scale */
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-xl: 22px;
      --r-pill: 999px;
      --gap: 0.75rem;
      --pad-card: 1rem;
      --tile-h: 46px;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.18);
      --shadow-2: 0 10px 30px rgba(0,0,0,0.28);
      --shadow-pop: 0 24px 60px rgba(0,0,0,0.45);
      --ring: color-mix(in srgb, var(--accent) 45%, transparent);
      --focus: color-mix(in srgb, var(--accent) 70%, white);
      --on-accent: #14120a; /* recomputed in JS from accent luminance */
    }

    /* Dark theme (default "Vault") */
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0c0d10;
      --bg-deep: #08090b;
      --surface: #14161c;
      --surface-2: #191c24;
      --surface-3: #21252f;
      --surface-hover: #1e222b;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.16);
      --text: #ecEAe3;
      --text-muted: #9b978e;
      --text-dim: #6a665e;
      --overlay: rgba(6,7,9,0.66);
      --tint: color-mix(in srgb, var(--accent) 14%, transparent);
      --tint-2: color-mix(in srgb, var(--accent) 8%, transparent);
      --accent-text: color-mix(in srgb, var(--accent) 88%, white);
      --glow: color-mix(in srgb, var(--accent) 26%, transparent);
      --scrim: rgba(0,0,0,0.5);
    }

    /* Light theme (warm paper) */
    [data-theme="light"] {
      color-scheme: light;
      --bg: #f3efe6;
      --bg-deep: #eae5d9;
      --surface: #fffdf8;
      --surface-2: #faf7f0;
      --surface-3: #f1ece0;
      --surface-hover: #f6f2e9;
      --border: rgba(30,24,12,0.12);
      --border-strong: rgba(30,24,12,0.22);
      --text: #241f16;
      --text-muted: #6b6456;
      --text-dim: #9a9282;
      --overlay: rgba(40,34,22,0.34);
      --tint: color-mix(in srgb, var(--accent) 16%, transparent);
      --tint-2: color-mix(in srgb, var(--accent) 9%, transparent);
      --accent-text: color-mix(in srgb, var(--accent) 72%, black);
      --glow: color-mix(in srgb, var(--accent) 22%, transparent);
      --scrim: rgba(40,34,22,0.28);
    }

    [data-density="compact"] {
      --gap: 0.5rem;
      --pad-card: 0.8rem;
      --tile-h: 40px;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ─────────────────────────────────────────────────────────────────────
       Ambient background
       ───────────────────────────────────────────────────────────────────── */
    /* Aurora rendered with radial-gradients (no filter:blur) — GPU-cheap and
       fast to rasterize, so it also stays smooth on low-end devices. */
    .bg-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .orb { display: none; }
    [data-bg="aurora"] .bg-layer {
      background:
        radial-gradient(58vw 58vw at 84% -14%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 62%),
        radial-gradient(46vw 46vw at -12% 110%, color-mix(in srgb, #4a6670 24%, transparent), transparent 60%),
        radial-gradient(34vw 34vw at 52% 44%, color-mix(in srgb, #6c5170 18%, transparent), transparent 60%);
    }
    [data-theme="light"][data-bg="aurora"] .bg-layer { opacity: 0.72; }
    [data-bg="minimal"] .bg-layer { background:
        radial-gradient(1100px 560px at 82% -10%, var(--tint-2), transparent 60%); }
    .grain {
      position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    [data-theme="light"] .grain { opacity: 0.02; }

    /* ─────────────────────────────────────────────────────────────────────
       Layout shell
       ───────────────────────────────────────────────────────────────────── */
    .wrap { max-width: 1500px; margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2.25rem); }
    .app { min-height: 100vh; display: flex; flex-direction: column; }

    /* Top bar */
    .topbar {
      position: sticky; top: 0; z-index: 60;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(16px) saturate(1.1);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
      min-height: 3.5rem;
      padding: 0.5rem 0;
    }
    .brand { display: inline-flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }
    .brand-emblem { width: 44px; height: 44px; display: block; flex-shrink: 0;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,0.45));
      transition: transform 0.3s ease, filter 0.3s ease; }
    .brand:hover .brand-emblem { transform: scale(1.06) rotate(-2deg);
      filter: brightness(1.1) drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
    .brand-name {
      font-family: var(--font-display); font-weight: 700; font-size: 1.32rem;
      letter-spacing: 0.06em; line-height: 1;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 62%, var(--text)));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    /* Search */
    .search { position: relative; display: flex; align-items: center; width: 100%;
      max-width: 34rem; margin: 0 auto; }
    .search-engine {
      display: inline-flex; align-items: center; gap: 0.3rem;
      height: 2.5rem; padding: 0 0.6rem 0 0.75rem;
      border: 1px solid var(--border); border-right: none;
      border-radius: var(--r-pill) 0 0 var(--r-pill);
      background: var(--surface-2); color: var(--text-muted);
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .search-engine:hover { background: var(--surface-3); color: var(--text); }
    .search-engine svg { width: 13px; height: 13px; opacity: 0.7; }
    .search-input {
      flex: 1; min-width: 0; height: 2.5rem;
      padding: 0 2.6rem 0 0.9rem;
      border: 1px solid var(--border);
      border-radius: 0 var(--r-pill) var(--r-pill) 0;
      background: var(--surface);
      color: var(--text); font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search:focus-within .search-input,
    .search:focus-within .search-engine {
      border-color: color-mix(in srgb, var(--accent) 34%, var(--border));
    }
    .search:focus-within .search-input {
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
      background: var(--surface-2);
    }
    .search-clear {
      position: absolute; right: 0.45rem; top: 50%; transform: translateY(-50%);
      width: 1.7rem; height: 1.7rem; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-muted); background: var(--surface-3);
      transition: background 0.2s, color 0.2s;
    }
    .search-clear:hover { background: color-mix(in srgb, var(--danger) 22%, var(--surface-3)); color: var(--text); }
    .search-bang {
      position: absolute; left: 0; top: calc(100% + 0.4rem); z-index: 5;
      font-size: 0.72rem; color: var(--text-dim);
    }

    .top-actions { display: inline-flex; align-items: center; gap: 0.3rem; flex-shrink: 0; }

    /* Icon buttons */
    .iconbtn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      height: 2.4rem; min-width: 2.4rem; padding: 0 0.6rem;
      border-radius: var(--r-pill); border: 1px solid transparent;
      color: var(--text-muted); background: transparent;
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
      transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.18s;
    }
    .iconbtn svg { width: 17px; height: 17px; display: block; }
    .iconbtn:hover { color: var(--text); background: var(--surface-2); }
    .iconbtn:active { transform: translateY(1px); }
    .iconbtn.on { color: var(--accent-text); background: var(--tint);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .iconbtn .lbl { display: inline; }
    .iconbtn--primary { color: var(--on-accent); background: var(--accent); }
    .iconbtn--primary:hover { color: var(--on-accent); filter: brightness(1.08); }

    .sep { width: 1px; height: 1.4rem; background: var(--border); margin: 0 0.2rem; flex-shrink: 0; }

    /* ─────────────────────────────────────────────────────────────────────
       Main content
       ───────────────────────────────────────────────────────────────────── */
    main { flex: 1; padding: 1rem 0 4rem; }
    .fade-in { animation: fadeUp 0.45s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

    /* Section heads */
    .section { margin-bottom: 2rem; }
    /* Favorites: tighter above and below */
    .section--favs { margin-bottom: 1.2rem; }
    .section--favs .section-head { margin-bottom: 0.4rem; }
    .section--favs .rail { padding-top: 0.1rem; padding-bottom: 0.3rem; }
    .section-head { display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; margin-bottom: 0.85rem; }
    .section-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--text-dim); display: inline-flex; align-items: center; gap: 0.5rem; }
    .section-title .count { color: var(--text-dim); font-weight: 600; }

    /* Favorites rail */
    .rail { display: flex; gap: var(--gap); overflow-x: auto; overflow-y: hidden;
      padding: 0.15rem 0.15rem 0.6rem; scroll-snap-type: x proximity;
      scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 50%, transparent) transparent; }
    .rail::-webkit-scrollbar { height: 8px; }
    .rail::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 99px; }
    .fav {
      position: relative; display: flex; align-items: center; gap: 0.55rem;
      flex: 0 0 auto; width: 190px; height: var(--tile-h); padding: 0 0.7rem;
      border: 1px solid var(--border); border-radius: var(--r-md);
      background: var(--surface); text-decoration: none; color: var(--text);
      scroll-snap-align: start; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .fav:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      box-shadow: var(--shadow-2); background: var(--surface-2); }
    .fav-key { position: absolute; top: -7px; left: -7px; width: 18px; height: 18px;
      border-radius: 5px; background: var(--accent); color: var(--on-accent);
      font: 700 0.62rem/18px var(--font-num); text-align: center; box-shadow: var(--shadow-1); }
    .fav-ico { width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0; object-fit: cover; }
    .fav-name { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Collections grid */
    .collections { display: grid; gap: var(--gap);
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-items: start; }
    .collections[data-cols="wide"] { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
    .col-card {
      position: relative; display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
      overflow: hidden; transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
    }
    .col-card:hover { border-color: color-mix(in srgb, var(--col-accent) 55%, var(--border));
      box-shadow: 0 14px 44px rgba(0,0,0,0.24); transform: translateY(-2px); }
    .col-head { display: flex; align-items: center; gap: 0.7rem; padding: var(--pad-card) var(--pad-card) 0.7rem; }
    .col-badge { flex-shrink: 0; width: 40px; height: 40px;
      display: grid; place-items: center; font-size: 1.5rem; color: var(--col-accent); }
    .col-open { flex: 1; min-width: 0; text-align: left; border-radius: var(--r-sm);
      display: flex; align-items: center; gap: 0.7rem; padding: 0.15rem; margin: -0.15rem;
      transition: background 0.18s; }
    .col-open:hover:not(:disabled) { background: var(--surface-2); }
    .col-open:disabled { cursor: default; }
    .col-meta { min-width: 0; }
    .col-name { font-family: var(--font-display); font-weight: 600; font-size: 1.12rem;
      line-height: 1.2; color: var(--text); }
    .col-desc { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.1rem;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .col-count { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.15rem; }
    .col-tools { display: inline-flex; gap: 0.15rem; flex-shrink: 0; }
    .col-body { padding: 0 var(--pad-card) var(--pad-card); }

    /* Preview modes */
    .preview { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .preview.v-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.12rem 0.5rem; }
    .preview.v-grid { gap: 0.4rem; }
    .preview.v-large { gap: 0.5rem; }
    .p-item { position: relative; display: flex; align-items: center; text-decoration: none;
      color: var(--text); transition: background 0.15s, transform 0.15s, border-color 0.15s; }
    .p-item .p-ico { flex-shrink: 0; border-radius: 4px; object-fit: cover; }
    .p-emoji { display: grid; place-items: center; flex-shrink: 0; }

    .preview.v-grid .p-item { width: 40px; height: 40px; justify-content: center;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); }
    .preview.v-grid .p-ico, .preview.v-grid .p-emoji { width: 22px; height: 22px; font-size: 18px; }
    .preview.v-grid .p-item:hover { transform: scale(1.08); border-color: var(--col-accent); z-index: 1; }

    .preview.v-large .p-item { width: 58px; height: 58px; justify-content: center;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); }
    .preview.v-large .p-ico, .preview.v-large .p-emoji { width: 32px; height: 32px; font-size: 26px; }
    .preview.v-large.named .p-item { width: 76px; height: auto; min-height: 82px; flex-direction: column;
      gap: 0.35rem; padding: 0.5rem 0.3rem; }
    .preview.v-large.named .p-name { max-width: 100%; text-align: center; }
    .preview.v-large .p-item:hover { transform: scale(1.06); border-color: var(--col-accent); z-index: 1; }

    .preview.v-list .p-item { width: 100%; height: 30px; gap: 0.5rem; padding: 0 0.4rem;
      border-radius: var(--r-sm); }
    .preview.v-list .p-ico, .preview.v-list .p-emoji { width: 18px; height: 18px; font-size: 15px; }
    .preview.v-list .p-item:hover { background: var(--surface-2); }
    .preview.v-list .p-name { flex: 1; min-width: 0; }

    .preview.v-chip .p-item { height: 28px; gap: 0.4rem; padding: 0 0.6rem 0 0.4rem;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-pill); }
    .preview.v-chip .p-ico, .preview.v-chip .p-emoji { width: 16px; height: 16px; font-size: 13px; }
    .preview.v-chip .p-item:hover { border-color: var(--col-accent); }

    .p-name { font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-star { position: absolute; top: -5px; right: -5px; width: 15px; height: 15px; border-radius: 50%;
      background: var(--bg); color: var(--accent); font-size: 0.62rem; display: grid; place-items: center; z-index: 2; }
    .preview.v-list .p-star, .preview.v-chip .p-star { position: static; background: none; width: auto; height: auto; }
    .p-empty { font-size: 0.78rem; color: var(--text-dim); font-style: italic; padding: 0.2rem 0; }

    /* Edit-mode collection card */
    .col-card.editing { cursor: grab; border-style: dashed;
      border-color: color-mix(in srgb, var(--col-accent) 60%, var(--border)); }
    .col-card.editing:active { cursor: grabbing; }
    .col-card.editing * { pointer-events: none; }
    .col-card.editing .col-tools, .col-card.editing .col-tools * { pointer-events: auto; }
    .col-card.drag-ghost { opacity: 0.4; }
    .col-card.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--ring) inset; }

    /* ─────────────────────────────────────────────────────────────────────
       Collection detail
       ───────────────────────────────────────────────────────────────────── */
    .backlink { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text-muted);
      font-size: 0.85rem; margin-bottom: 1rem; border-radius: var(--r-pill); padding: 0.3rem 0.6rem 0.3rem 0.4rem;
      transition: color 0.18s, background 0.18s; }
    .backlink:hover { color: var(--text); background: var(--surface-2); }
    .detail-head { display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.25rem;
      background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--col-accent);
      border-radius: var(--r-lg); margin-bottom: 1.25rem; flex-wrap: wrap; }

  // ── US holidays (computed offline; fixed-date + nth-weekday rules) ──────
  function nthWeekday(year, month, weekday, n) { // month 0-11, weekday 0-6, n>=1

    const day = 1 + ((weekday - first + 7) % 7) + (n - 1) * 7;
    return new Date(year, month, day);

  }

      d(new Date(year, 1, 14), "Valentine's Day"),

  // ══════════════════════════════════════════════════════════════════════
  // Utilities
  // ══════════════════════════════════════════════════════════════════════
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function uid() {
    return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2, 11);
  }
  function isHttp(url) { try { return /^https?:$/i.test(new URL(url).protocol); } catch { return false; } }
  function href(url) { return isHttp(url) ? url : '#'; }
  function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } }
  function faviconUrl(url) { const h = hostOf(url) ? new URL(url).hostname : ''; return h ? `https://icons.duckduckgo.com/ip3/${h}.ico` : ''; }

  // Normalize for duplicate detection: host w/o www + path w/o trailing slash, ignore hash.
  function normUrl(url) {
    try {
      const u = new URL(url);
      const host = u.hostname.replace(/^www\./, '').toLowerCase();
      let path = u.pathname.replace(/\/+$/, '');
      return host + path + (u.search || '');
    } catch { return String(url || '').trim().toLowerCase(); }
  }
  function deriveTitle(url) {
    const h = hostOf(url);
    if (!h) return '';
    const core = h.split('.').slice(0, -1).join('.') || h;
    return core.split('.').pop().replace(/[-_]/g, ' ').replace(/\b\w/g, m => m.toUpperCase());
  }

  function hashInt(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) { h = ((h << 5) + h) + str.charCodeAt(i); h |= 0; }
    return Math.abs(h);
  }
  function avatarColor(url) { const h = hostOf(url) || String(url || ''); return AVATAR_PALETTE[hashInt(h) % AVATAR_PALETTE.length]; }
  function avatarLetter(title) { return (String(title || '').trim().charAt(0) || '?').toUpperCase(); }
  function avatarDataUrl(title, url) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="${avatarColor(url)}"/><text x="16" y="22" font-family="Georgia, serif" font-size="18" font-weight="600" text-anchor="middle" fill="#f4ede0">${esc(avatarLetter(title))}</text></svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }
  // <img> that falls back to the letter avatar on network/DNS failure.
  function iconImg(cls, title, url) {
    return `<img src="${esc(faviconUrl(url))}" alt="" class="${cls}" loading="lazy" data-avatar="${esc(avatarDataUrl(title, url))}" onerror="this.onerror=null;this.src=this.dataset.avatar;">`;
  }
  // A bookmark's icon: custom emoji override, else favicon-with-fallback.
  function markIcon(bm, imgCls, emojiCls) {
    if (bm.customIcon) return `<span class="${emojiCls}" aria-hidden="true">${esc(bm.customIcon)}</span>`;
    return iconImg(imgCls, bm.title, bm.url);
  }

  // Fuzzy subsequence scorer for the command palette (higher = better, -1 = no match).
  function fuzzy(query, text) {
    if (!query) return 0;
    const q = query.toLowerCase(), t = String(text || '').toLowerCase();
    let qi = 0, score = 0, run = 0, ti = 0;
    for (; ti < t.length && qi < q.length; ti++) {
      if (t[ti] === q[qi]) {
        run++; score += 1 + run + (ti === 0 || /[\s\-_/.]/.test(t[ti - 1]) ? 3 : 0);
        qi++;
      } else run = 0;
    }
    return qi === q.length ? score : -1;
  }

  // Relative luminance → readable text color for accent surfaces.
  function luminance(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    if (!m) return 0.5;
    const f = i => { const v = parseInt(m[i], 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(1) + 0.7152 * f(2) + 0.0722 * f(3);
  }
  function onAccent(hex) { return luminance(hex) > 0.55 ? '#1a160c' : '#fbf7ea'; }

  // ── Dates ───────────────────────────────────────────────────────────────
  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(dt) { return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate()); }
  function isoWeek(dt) {
    const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
    const day = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - day);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }

  const STORE_KEY = 'bookmarkvault:v2';
  const LEGACY = { groups: 'startpage:groups', bookmarks: 'startpage:bookmarks', settings: 'startpage:settings', view: 'startpage:view' };
  const LEGACY_VIEW = { 'compact-icon': 'grid', 'large-icon': 'large', 'icon-name': 'list', 'icon-abbrev': 'chip' };

  function readLS(key) { try { const r = localStorage.getItem(key); return r == null ? null : JSON.parse(r); } catch { return null; } }

  let quotaWarned = false;
  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        version: 2, collections: state.collections, bookmarks: state.bookmarks,
        notes: state.notes, settings: state.settings,
      }));
    } catch {
      if (!quotaWarned) { quotaWarned = true; setTimeout(() => toast('Could not save — browser storage is full or disabled', 'err'), 0); }
    }
  }

  function seedCollections() {
    return SEED_COLLECTIONS.map(c => ({ id: uid(), name: c.name, description: c.description, icon: c.icon, accentColor: c.accentColor, createdAt: Date.now() }));
  }

  // Convert 1.x data (groups + groupId-based bookmarks + legacy settings/view)
  // into the 2.0 shape. Shared by localStorage migration AND JSON import, so a
  // 1.x "Settings → Export" file (which uses `groups`, not `collections`)
  // imports cleanly. Returns null if the source isn't 1.x-shaped.
  function transformV1(src) {
    src = src || {};
    const g = src.groups;
    if (!Array.isArray(g)) return null;
    const collections = g.filter(x => x && x.id && x.name).map(x => ({
      id: String(x.id), name: String(x.name), description: String(x.description || ''),
      icon: String(x.icon || '◆'), accentColor: /^#[0-9a-f]{3,8}$/i.test(x.accentColor) ? x.accentColor : '#c9a227',
      createdAt: Date.now(),
    }));
    const ids = new Set(collections.map(c => c.id));
    const lb = src.bookmarks;
    const bookmarks = (Array.isArray(lb) ? lb : []).filter(b => b && b.id && b.title && b.url && ids.has(b.groupId)).map(b => ({
      id: String(b.id), title: String(b.title), url: String(b.url), isFavorite: !!b.isFavorite,
      collectionId: String(b.groupId), note: '', tags: [], customIcon: '', createdAt: Date.now(),
    }));
    const ls = src.settings || {};
    const settings = Object.assign({}, DEFAULT_SETTINGS, ls);
    if (typeof ls.showNamesUnderLargeIcons === 'boolean') settings.largeIconNames = ls.showNamesUnderLargeIcons;
    if (typeof src.view === 'string') settings.defaultView = LEGACY_VIEW[src.view] || 'chip';
    return { collections, bookmarks, notes: [], settings };
  }

  function migrateLegacy() {
    return transformV1({
      groups: readLS(LEGACY.groups), bookmarks: readLS(LEGACY.bookmarks),
      settings: readLS(LEGACY.settings), view: readLS(LEGACY.view),
    });
  }

  function normalize(data) {
    const s = Object.assign({}, DEFAULT_SETTINGS, data.settings || {});
    const collections = (Array.isArray(data.collections) ? data.collections : []).map(c => ({
      id: String(c.id || uid()), name: String(c.name || 'Untitled'), description: String(c.description || ''),
      icon: c.icon || '◆', accentColor: /^#[0-9a-f]{3,8}$/i.test(c.accentColor) ? c.accentColor : '#c9a227',
      view: VIEW_MODES.some(v => v.id === c.view) ? c.view : undefined, createdAt: c.createdAt || Date.now(),
    }));
    const ids = new Set(collections.map(c => c.id));
    const bookmarks = (Array.isArray(data.bookmarks) ? data.bookmarks : []).filter(b => b && b.collectionId && ids.has(String(b.collectionId))).map(b => ({
      id: String(b.id || uid()), title: String(b.title || ''), url: String(b.url || ''), isFavorite: !!b.isFavorite,
      collectionId: String(b.collectionId), note: String(b.note || ''), tags: Array.isArray(b.tags) ? b.tags.map(String) : [],
      customIcon: String(b.customIcon || ''), createdAt: b.createdAt || Date.now(),
    }));
    const notes = (Array.isArray(data.notes) ? data.notes : []).map(n => ({
      id: String(n.id || uid()), text: String(n.text || ''), done: !!n.done, createdAt: n.createdAt || Date.now(),
    }));
    return { collections, bookmarks, notes, settings: s };
  }

  function loadStore() {
    const existing = readLS(STORE_KEY);
    if (existing && typeof existing === 'object') return normalize(existing);
    const migrated = migrateLegacy();
    if (migrated) return normalize(migrated);
    return { collections: seedCollections(), bookmarks: [], notes: [], settings: Object.assign({}, DEFAULT_SETTINGS) };
  }

  // ══════════════════════════════════════════════════════════════════════
  // State
  // ══════════════════════════════════════════════════════════════════════
  const persisted = loadStore();
  const state = {
    collections: persisted.collections,
    bookmarks: persisted.bookmarks,
    notes: persisted.notes,
    settings: persisted.settings,
    // ephemeral UI state (never persisted)
    route: 'home',            // 'home' | 'collection' | 'settings'
    selectedId: null,
    editingCollections: false,
    mounted: false,
    overlay: null,            // { type, ... }
    drawer: null,             // 'notes'
    palette: { open: false, query: '', index: 0 },
    calendar: { year: 0, month: 0, months: 1 },
    forms: {},                // transient modal form buffers
    dragKind: null,           // 'collection' | 'bookmark'
    dragId: null,
    toasts: [],
    pendingUndo: null,        // { label, restore }
  };

  // Convenience selectors
  const collectionById = (id) => state.collections.find(c => c.id === id);
  const bookmarkById = (id) => state.bookmarks.find(b => b.id === id);
  const marksIn = (colId) => state.bookmarks.filter(b => b.collectionId === colId);
  const favorites = () => state.bookmarks.filter(b => b.isFavorite);
  const collectionView = (col) => col.view || state.settings.defaultView;

  // ══════════════════════════════════════════════════════════════════════
  // Theme / chrome application
  // ══════════════════════════════════════════════════════════════════════
  let _mqlLight = null;
  function resolvedTheme() {
    if (state.settings.theme === 'auto') {
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    return state.settings.theme;
  }
  function applyChrome() {
    const root = document.documentElement;
    const theme = resolvedTheme();
    root.setAttribute('data-theme', theme);
    root.setAttribute('data-density', state.settings.density);
    root.setAttribute('data-bg', state.settings.background);
    root.style.setProperty('--accent', state.settings.accentColor);
    root.style.setProperty('--on-accent', onAccent(state.settings.accentColor));
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#f3efe6' : '#0c0d10');
    // Keep 'auto' live with the OS.
    if (!_mqlLight && window.matchMedia) {
      _mqlLight = window.matchMedia('(prefers-color-scheme: light)');
      _mqlLight.addEventListener?.('change', () => { if (state.settings.theme === 'auto') { applyChrome(); render(); } });
    }
  }

  // ══════════════════════════════════════════════════════════════════════
  // Render pipeline
  // ══════════════════════════════════════════════════════════════════════
  const $app = document.getElementById('app');
  const $overlay = document.getElementById('overlay-root');
  const $drawer = document.getElementById('drawer-root');
  const $toasts = document.getElementById('toast-root');

  function render() {
    applyChrome();
    $app.innerHTML = topbarHTML() + `<main><div class="wrap"><div id="view" class="${state.mounted ? '' : 'fade-in'}">${viewHTML()}</div></div></main>`;
    afterRender();
  }
  function renderMain() {
    const v = document.getElementById('view');
    if (v) v.innerHTML = viewHTML(); else render();
    afterRender();
  }
  function commit() { persist(); render(); }

  function afterRender() {
    syncSearchClear();
    requestAnimationFrame(manageFocus);
  }

  function viewHTML() {
    if (state.route === 'collection') return collectionDetailHTML();
    if (state.route === 'settings') return settingsHTML();
    return homeHTML();
  }

  // ── Top bar ─────────────────────────────────────────────────────────────
  function topbarHTML() {
    const eng = engineById(state.settings.searchEngine);
    return `
    <header class="topbar">
      <div class="wrap topbar-inner">
        <button class="brand" data-act="home" aria-label="Bookmark Vault — home">
          <span class="brand-emblem">${I.bvicon}</span>
          <span class="brand-name">Bookmark Vault</span>
        </button>

        <form class="search" role="search" data-act="websearch">
          <button type="button" class="search-engine" data-act="cycle-engine" aria-label="Search engine: ${esc(eng.label)}. Click to change." title="Click to change search engine">
            ${I.globe}<span class="eng-label">${esc(eng.short)}</span>
          </button>
          <input type="search" name="q" class="search-input" data-search
                 placeholder="Search ${esc(eng.label)}${eng.bangs ? '  —  try !w, !g, !yt' : ''}…"
                 aria-label="Search the web" autocomplete="off" spellcheck="false" enterkeyhint="search">
          <button type="button" class="search-clear" data-act="clear-search" aria-label="Clear search" hidden>${I.x}</button>
        </form>

        <nav class="top-actions" aria-label="Actions">
          <button class="iconbtn iconbtn--primary" data-act="add-bookmark" aria-label="Add bookmark">${I.plus}<span class="lbl">Add</span></button>
          <span class="sep"></span>
          <button class="iconbtn" data-act="open-palette" aria-label="Command palette (Ctrl or Cmd + K)" title="Search bookmarks & commands  (⌘K)">${I.command}</button>
          <button class="iconbtn" data-act="open-calendar" aria-label="Calendar" title="Calendar">${I.calendar}</button>
          <button class="iconbtn" data-act="cycle-theme" aria-label="Theme: ${esc(state.settings.theme)}" title="Theme: ${esc(state.settings.theme)}">${themeIcon()}</button>
          <button class="iconbtn ${state.editingCollections ? 'on' : ''}" data-act="toggle-edit" aria-pressed="${state.editingCollections}" aria-label="Edit collections" title="Rearrange & edit collections">${I.pencil}<span class="lbl">Edit</span></button>
          <button class="iconbtn ${state.route === 'settings' ? 'on' : ''}" data-act="open-settings" aria-label="Settings" title="Settings">${I.settings}</button>
        </nav>
      </div>
    </header>`;
  }
  function themeIcon() { return state.settings.theme === 'light' ? I.sun : state.settings.theme === 'dark' ? I.moon : I.monitor; }

  // ── Home ────────────────────────────────────────────────────────────────
  function homeHTML() {
    const favs = favorites();
    const favSection = favs.length === 0 ? '' : `
      <section class="section section--favs">
        <div class="section-head"><span class="section-title">${I.starFill}</span></div>
        <div class="rail">
          ${favs.map((b, i) => `
            <a class="fav" href="${esc(href(b.url))}" ${linkAttrs()} title="${esc(b.title)}" data-fav="${i}">
              ${markIcon(b, 'fav-ico', 'fav-ico')}
              <span class="fav-name">${esc(b.title)}</span>
            </a>`).join('')}
        </div>
      </section>`;

    const vm = viewMode(state.settings.defaultView);
    const viewSeg = `
      <div class="segmented" role="group" aria-label="Default preview">
        ${VIEW_MODES.map(m => `<button data-act="set-default-view" data-view="${m.id}" class="${m.id === state.settings.defaultView ? 'on' : ''}" aria-pressed="${m.id === state.settings.defaultView}" title="${esc(m.label)} view" aria-label="${esc(m.label)} view">${I[m.icon]}</button>`).join('')}
      </div>`;

    const grid = state.collections.length === 0
      ? `<div class="empty"><span class="empty-glyph">◇</span><p>No collections yet.</p><button class="btn btn-accent" data-act="new-collection">${I.plus} New collection</button></div>`
      : `<div class="collections">${state.collections.map((c, i) => collectionCardHTML(c, i)).join('')}</div>`;

    return favSection + `
      <section class="section">
        <div class="section-head">
          <span class="section-title"></span>
          <div style="display:inline-flex;gap:.5rem;align-items:center;flex-wrap:wrap;">
            ${viewSeg}
            <button class="btn btn-ghost btn-sm" data-act="new-collection">${I.plus} New</button>
          </div>
        </div>
        ${grid}
      </section>`;
  }

  function linkAttrs() { return state.settings.openInNewTabs ? 'target="_blank" rel="noopener"' : 'target="_self"'; }

  // ── Collection card ─────────────────────────────────────────────────────
  function previewHTML(col) {
    const view = collectionView(col);
    const vm = viewMode(view);
    const named = view === 'large' && state.settings.largeIconNames;
    const bms = marksIn(col.id);
    if (bms.length === 0) return `<div class="preview ${vm.cls}"><span class="p-empty">No bookmarks yet</span></div>`;
    const items = bms.map(bm => {
      const showName = view === 'list' || view === 'chip' || named;
      return `<a class="p-item" href="${esc(href(bm.url))}" ${linkAttrs()} title="${esc(bm.title)}" data-stop>
        ${markIcon(bm, 'p-ico', 'p-emoji')}
        ${showName ? `<span class="p-name">${esc(bm.title)}</span>` : ''}
        ${bm.isFavorite ? `<span class="p-star" aria-hidden="true">★</span>` : ''}
      </a>`;
    }).join('');
    return `<div class="preview ${vm.cls}${named ? ' named' : ''}">${items}</div>`;
  }

  function collectionCardHTML(col, i) {
    const editing = state.editingCollections;
    const count = marksIn(col.id).length;
    const tools = editing ? `
      <div class="col-tools">
        <button class="act" data-act="move-collection" data-id="${esc(col.id)}" data-dir="-1" aria-label="Move ${esc(col.name)} earlier" ${i === 0 ? 'disabled' : ''}>${I.left}</button>
        <button class="act" data-act="move-collection" data-id="${esc(col.id)}" data-dir="1" aria-label="Move ${esc(col.name)} later" ${i === state.collections.length - 1 ? 'disabled' : ''}>${I.right}</button>
      </div>`
      : `<div class="col-tools">
          <button class="act" data-act="open-all" data-id="${esc(col.id)}" ${count === 0 ? 'disabled' : ''} aria-label="Open all ${count} in ${esc(col.name)}" title="Open all (${count})">${I.ext}</button>
        </div>`;

    const header = editing
      ? `<div class="col-open" style="cursor:inherit">
           <span class="col-badge">${esc(col.icon)}</span>
           <span class="col-meta"><span class="col-name">${esc(col.name)}</span></span>
         </div>`
      : `<button class="col-open" data-act="open-collection" data-id="${esc(col.id)}" aria-label="Open ${esc(col.name)}">
           <span class="col-badge">${esc(col.icon)}</span>
           <span class="col-meta"><span class="col-name">${esc(col.name)}</span></span>
         </button>`;

    return `
    <article class="col-card${editing ? ' editing' : ''}" style="--col-accent:${esc(col.accentColor)}"
      ${editing ? `role="button" tabindex="0" draggable="true" data-act="edit-collection" data-id="${esc(col.id)}" data-drag="collection" aria-label="Edit ${esc(col.name)}"` : ''}>
      <div class="col-head">${header}${tools}</div>
      <div class="col-body">${previewHTML(col)}</div>
    </article>`;
  }

  // ── Collection detail ───────────────────────────────────────────────────
  function collectionDetailHTML() {
    const col = collectionById(state.selectedId);
    if (!col) { state.route = 'home'; return homeHTML(); }
    const bms = marksIn(col.id);
    const list = bms.length === 0
      ? `<div class="empty"><span class="empty-glyph">◇</span><p>No bookmarks in this collection yet.</p><button class="btn btn-accent" data-act="add-bookmark" data-id="${esc(col.id)}">${I.plus} Add your first bookmark</button></div>`
      : `<ul class="marks">${bms.map(b => markRowHTML(b)).join('')}</ul>`;

    return `
    <button class="backlink" data-act="home">${I.arrowLeft} Collections</button>
    <div class="detail-head" style="--col-accent:${esc(col.accentColor)}">
      <span class="detail-badge">${esc(col.icon)}</span>
      <div class="grow">
        <div class="detail-title">${esc(col.name)}</div>
        ${col.description ? `<div class="detail-desc">${esc(col.description)}</div>` : ''}
      </div>
      <div class="detail-actions">
        <button class="btn btn-ghost btn-sm" data-act="edit-collection" data-id="${esc(col.id)}">${I.pencil} Edit</button>
        <button class="btn btn-ghost btn-sm" data-act="open-all" data-id="${esc(col.id)}" ${bms.length === 0 ? 'disabled' : ''}>${I.ext} Open all (${bms.length})</button>
        <button class="btn btn-accent btn-sm" data-act="add-bookmark" data-id="${esc(col.id)}">${I.plus} Add</button>
      </div>
    </div>
    <div class="marks-head"><span class="section-title">${bms.length} bookmark${bms.length !== 1 ? 's' : ''}</span></div>
    ${list}`;
  }

  function markRowHTML(b) {
    const tags = (b.tags && b.tags.length) ? `<span class="mark-tags">${b.tags.slice(0, 4).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</span>` : '';
    return `
    <li class="mark" data-drag="bookmark" data-id="${esc(b.id)}">
      <span class="mark-handle" draggable="true" data-drag-handle aria-hidden="true" title="Drag to reorder">${I.grip}</span>
      ${markIcon(b, 'mark-ico', 'mark-emoji')}
      <a class="mark-link" href="${esc(href(b.url))}" ${linkAttrs()} title="${esc(b.title)}">
        <span class="mark-title">${esc(b.title)}</span>
        <span class="mark-url">${esc(hostOf(b.url) || b.url)}</span>
      </a>
      ${tags}
      <div class="mark-actions">
        <button class="act ${b.isFavorite ? 'on' : ''}" data-act="toggle-fav" data-id="${esc(b.id)}" aria-pressed="${b.isFavorite}" aria-label="${b.isFavorite ? 'Unfavorite' : 'Favorite'} ${esc(b.title)}" title="${b.isFavorite ? 'Unfavorite' : 'Favorite'}">${b.isFavorite ? I.starFill : I.star}</button>
        <button class="act" data-act="edit-bookmark" data-id="${esc(b.id)}" aria-label="Edit ${esc(b.title)}" title="Edit">${I.pencil}</button>
        <button class="act danger" data-act="delete-bookmark" data-id="${esc(b.id)}" aria-label="Delete ${esc(b.title)}" title="Delete">${I.trash}</button>
      </div>
    </li>`;
  }

  // ── Settings ────────────────────────────────────────────────────────────
  function segBtns(act, key, current, opts) {
    return `<div class="segmented" role="group">${opts.map(o =>
      `<button data-act="${act}"${key ? ` data-key="${key}"` : ''} data-val="${o.val}" class="${String(o.val) === String(current) ? 'on' : ''}" aria-pressed="${String(o.val) === String(current)}">${o.icon ? I[o.icon] : ''}${o.label ? `<span>${esc(o.label)}</span>` : ''}</button>`).join('')}</div>`;
  }
  function sw(key) { return `<input type="checkbox" class="switch" data-act="set-setting" data-key="${key}" ${state.settings[key] ? 'checked' : ''}>`; }
  function row(label, hint, control) {
    return `<div class="set-row"><div class="set-info"><div class="set-label">${label}</div>${hint ? `<div class="set-hint">${hint}</div>` : ''}</div><div class="set-control">${control}</div></div>`;
  }

  function settingsHTML() {
    const s = state.settings;
    const accent = `
      <div class="picker" style="align-items:center;justify-content:flex-end">
        ${COLORS.map(c => `<button class="swatch ${s.accentColor.toLowerCase() === c.hex.toLowerCase() ? 'on' : ''}" style="background:${c.hex}" data-act="set-accent" data-color="${c.hex}" aria-label="${c.name}" title="${c.name}"></button>`).join('')}
        <input type="color" class="color-input" value="${esc(s.accentColor)}" data-act="set-accent-input" aria-label="Custom accent color" title="Custom color">
      </div>`;
    return `
      <h1 class="page-title">Settings</h1>

      <div class="settings-card">
        <h2>Appearance</h2>
        ${row('Theme', 'Match your system or lock it in', segBtns('set-opt', 'theme', s.theme, [
          { val: 'light', icon: 'sun', label: 'Light' }, { val: 'dark', icon: 'moon', label: 'Dark' }, { val: 'auto', icon: 'monitor', label: 'Auto' }]))}
        ${row('Accent color', 'Used for highlights, buttons, and the brand', accent)}
        ${row('Density', 'Spacing of cards and tiles', segBtns('set-opt', 'density', s.density, [
          { val: 'comfortable', label: 'Comfortable' }, { val: 'compact', label: 'Compact' }]))}
        ${row('Background', 'Ambient aurora or a clean minimal field', segBtns('set-opt', 'background', s.background, [
          { val: 'aurora', label: 'Aurora' }, { val: 'minimal', label: 'Minimal' }]))}
        ${row('Default collection view', 'How bookmarks preview inside collection cards', segBtns('set-default-view', '', s.defaultView, VIEW_MODES.map(m => ({ val: m.id, icon: m.icon }))))}
        ${row('Names under large icons', 'Show titles beneath icons in the Large view', sw('largeIconNames'))}
      </div>

      <div class="settings-card">
        <h2>Calendar</h2>
        ${row('Week starts on', 'First day of the week in the calendar', segBtns('set-opt', 'weekStart', s.weekStart, [
          { val: '1', label: 'Monday' }, { val: '0', label: 'Sunday' }]))}
        ${row('Week numbers', 'Show ISO week numbers in the calendar', sw('showWeekNumbers'))}
      </div>

      <div class="settings-card">
        <h2>Search</h2>
        ${row('Default engine', 'The engine the top search bar uses (DuckDuckGo supports !bangs)',
          `<select class="select" style="width:12rem" data-act="set-setting" data-key="searchEngine">${ENGINES.map(e => `<option value="${e.id}" ${e.id === s.searchEngine ? 'selected' : ''}>${esc(e.label)}</option>`).join('')}</select>`)}
      </div>

      <div class="settings-card">
        <h2>Opening bookmarks</h2>
        ${row('Open in new tabs', 'Bookmarks open in a new browser tab', sw('openInNewTabs'))}
        ${row('Confirm “Open all”', 'Ask before opening every bookmark in a collection', sw('confirmBeforeOpenAll'))}
        ${row('Stagger “Open all”', 'Open tabs one-by-one to dodge popup blockers', sw('staggeredTabOpening'))}
        ${row('Max tabs at once', 'Cap how many “Open all” launches', `<input class="input" style="width:5rem;text-align:center" type="number" min="1" max="50" value="${esc(String(s.maxTabsLimit))}" data-act="set-setting" data-key="maxTabsLimit">`)}
      </div>

      <div class="settings-card">
        <h2>Data</h2>
        ${row('Export', 'Download everything as a JSON backup', `<button class="btn btn-ghost btn-sm" data-act="export">${I.download} Export</button>`)}
        ${row('Import JSON', 'Restore a Bookmark Vault backup (replaces current data)', `<button class="btn btn-ghost btn-sm" data-act="import-json">${I.upload} Import</button>`)}
        ${row('Import browser bookmarks', 'Load a browser’s exported bookmarks HTML; folders become collections', `<button class="btn btn-ghost btn-sm" data-act="import-html">${I.upload} Import HTML</button>`)}
        ${row('Keyboard shortcuts', 'View all shortcuts', `<button class="btn btn-ghost btn-sm" data-act="open-shortcuts">${I.help} Shortcuts</button>`)}
        ${row('Reset', 'Clear all data and restore default collections', `<button class="btn btn-danger-o btn-sm" data-act="confirm-reset">${I.trash} Reset</button>`)}
      </div>`;
  }

  // ══════════════════════════════════════════════════════════════════════
  // Overlays (modals / palette / calendar)
  // ══════════════════════════════════════════════════════════════════════
  function renderOverlay() {
    const o = state.overlay;
    if (!o) { $overlay.innerHTML = ''; requestAnimationFrame(manageFocus); return; }
    let html = '';
    if (o.type === 'bookmark') html = bookmarkModalHTML();
    else if (o.type === 'collection') html = collectionModalHTML();
    else if (o.type === 'confirm') html = confirmModalHTML();
    else if (o.type === 'open-all') html = openAllModalHTML();

  let _palResults = [];
  function actionItems() {

  function collectionItem(c) {
    return { kind: 'collection', icon: 'folder', label: c.name, sub: `${marksIn(c.id).length} bookmarks`, run: () => { closeOverlay(); openCollection(c.id); } };
  }
  function bmItem(b) {
    return { kind: 'bookmark', bm: b, label: b.title, sub: hostOf(b.url) || b.url, run: () => { launch(b.url); if (state.settings.openInNewTabs) closeOverlay(); } };
  }
  function paletteData(query) {
    if (!query) {
      const favs = state.bookmarks.filter(b => b.isFavorite).slice(0, 6).map(bmItem);
      const base = state.bookmarks.slice(0, 6).map(bmItem);
      return actionItems().map(a => ({ ...a, group: 'Actions' }))
        .concat((favs.length ? favs : base).map(x => ({ ...x, group: favs.length ? 'Favorites' : 'Bookmarks' })));
    }
    const scored = [];
    actionItems().forEach(a => { const s = fuzzy(query, a.label); if (s >= 0) scored.push({ ...a, group: 'Commands', score: s }); });
    state.collections.forEach(c => { const s = fuzzy(query, c.name); if (s >= 0) scored.push({ ...collectionItem(c), group: 'Commands', score: s + 1 }); });
    state.bookmarks.forEach(b => {
      const st = fuzzy(query, b.title);
      const sh = Math.max(fuzzy(query, hostOf(b.url)), fuzzy(query, (b.tags || []).join(' ')));
      const s = st >= 0 ? st + 3 : sh;
      if (s >= 0) scored.push({ ...bmItem(b), group: 'Bookmarks', score: s });
    });
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, 40);
  }
  function palIcon(item) {
    if (item.kind === 'bookmark') {
      if (item.bm.customIcon) return `<span class="pal-ico">${esc(item.bm.customIcon)}</span>`;
      return `<img class="pal-ico" src="${esc(faviconUrl(item.bm.url))}" alt="" data-avatar="${esc(avatarDataUrl(item.bm.title, item.bm.url))}" onerror="this.onerror=null;this.src=this.dataset.avatar;">`;

    return `<span class="pal-ico">${I[item.icon] || I.command}</span>`;
  }
  function paletteResultsHTML() {
    _palResults = paletteData(state.palette.query.trim());
    if (_palResults.length === 0) return `<div class="pal-empty">No matches</div>`;

  // ── Calendar ────────────────────────────────────────────────────────────
  function weekdayHeaders() {
    const base = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const start = state.settings.weekStart;
    const days = [];
    for (let i = 0; i < 7; i++) days.push(base[(start + i) % 7]);
    return days;
  }
  function monthTableHTML(year, month) {
    const start = state.settings.weekStart;
    const showWk = state.settings.showWeekNumbers;
    const todayKey = ymd(new Date());
    const holidays = holidayMap(year);
    const first = new Date(year, month, 1);
    const lead = (first.getDay() - start + 7) % 7;
    let cur = new Date(year, month, 1 - lead);
    const heads = weekdayHeaders().map(d => `<th>${d}</th>`).join('');
    let rows = '';
    for (let r = 0; r < 6; r++) {
      let cells = '';
      const wk = isoWeek(cur);
      for (let c = 0; c < 7; c++) {
        const inMonth = cur.getMonth() === month;
        const key = ymd(cur);
        const cls = ['cal-day'];
        if (!inMonth) cls.push('out');
        if (key === todayKey) cls.push('today');
        if (holidays[key]) cls.push('holiday');
        const title = holidays[key] ? ` title="${esc(holidays[key])}"` : '';
        cells += `<td><div class="${cls.join(' ')}"${title}>${cur.getDate()}</div></td>`;
        cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
      }
      rows += `<tr>${showWk ? `<td class="wk">${wk}</td>` : ''}${cells}</tr>`;
      if (cur.getMonth() !== month && r >= 4) break; // stop once month is done past 5 rows
    }
    return `
      <div>
        <div class="cal-month-name">${MONTH_NAMES[month]} ${year}</div>
        <table class="cal-grid"><thead><tr>${showWk ? '<th class="wk">Wk</th>' : ''}${heads}</tr></thead><tbody>${rows}</tbody></table>
      </div>`;
  }
  function calendarHTML() {
    const cal = state.calendar;
    const months = [];
    for (let i = 0; i < cal.months; i++) {
      let m = cal.month + i, y = cal.year;
      while (m > 11) { m -= 12; y++; }
      months.push([y, m]);
    }
    const first = months[0], last = months[months.length - 1];
    const title = cal.months === 1
      ? `${MONTH_NAMES[first[1]]} ${first[0]}`
      : `${MONTH_NAMES[first[1]]} ${first[0]} – ${MONTH_NAMES[last[1]]} ${last[0]}`;
    // upcoming holidays across the visible range
    const visKeys = new Set(months.map(([y, m]) => y + '-' + pad2(m + 1)));
    const hol = [];
    months.forEach(([y]) => usHolidays(y).forEach(h => { if (visKeys.has(h.key.slice(0, 7))) hol.push(h); }));
    hol.sort((a, b) => a.key < b.key ? -1 : 1);
    const inner = `
      <div class="cal-top">
        <div class="cal-title">${esc(title)}</div>
        <div class="cal-nav">
          <button class="iconbtn" data-act="cal-nav" data-dir="-1" aria-label="Previous month">${I.left}</button>
          <button class="btn btn-ghost btn-sm" data-act="cal-today">Today</button>
          <button class="iconbtn" data-act="cal-nav" data-dir="1" aria-label="Next month">${I.right}</button>
          ${segBtns('cal-months', '', cal.months, [{ val: '1', label: '1' }, { val: '3', label: '3' }])}
          <button class="iconbtn" data-act="close-overlay" aria-label="Close">${I.x}</button>
        </div>
      </div>
      <div class="cal-months" data-multi="${cal.months}">${months.map(([y, m]) => monthTableHTML(y, m)).join('')}</div>
      <div class="cal-legend">
        <span><span class="cal-dot" style="background:var(--accent)"></span> Today</span>
        <span><span class="cal-dot" style="background:var(--danger)"></span> Holiday</span>
      </div>
      ${hol.length ? `<div class="cal-holidays"><h4>Holidays</h4><ul>${hol.map(h => `<li><span>${esc(h.name)}</span><span class="hd">${esc(h.key)}</span></li>`).join('')}</ul></div>` : ''}`;
    return overlayShell(inner, { cls: 'cal modal--wide', labelledby: 'ov-title' });
  }

  // ══════════════════════════════════════════════════════════════════════
  // Controllers
  // ══════════════════════════════════════════════════════════════════════
  function paintAll() { render(); renderOverlay(); renderDrawer(); renderToasts(); }

  // Navigation
  function goHome() { state.route = 'home'; state.selectedId = null; render(); }
  function openCollection(id) { state.route = 'collection'; state.selectedId = id; state.editingCollections = false; render(); window.scrollTo({ top: 0 }); }
  function goSettings() { state.route = 'settings'; state.selectedId = null; state.editingCollections = false; render(); window.scrollTo({ top: 0 }); }
  function toggleEdit() {
    if (!state.editingCollections && state.route !== 'home') { state.route = 'home'; state.selectedId = null; }
    state.editingCollections = !state.editingCollections;
    render();
  }

  // Toasts + undo
  function toast(msg, type = 'info', opts = {}) {
    const id = uid();
    state.toasts.push({ id, msg, type, undo: !!opts.undoFn, undoFn: opts.undoFn });
    renderToasts();
    setTimeout(() => removeToast(id), opts.undoFn ? 6500 : 3000);
    return id;
  }
  function removeToast(id) { state.toasts = state.toasts.filter(t => t.id !== id); renderToasts(); }
  function doUndo(id) {
    const t = state.toasts.find(x => x.id === id);
    if (t && t.undoFn) t.undoFn();
    removeToast(id);
  }
  function launch(url) {
    if (!isHttp(url)) return;
    if (state.settings.openInNewTabs) window.open(url, '_blank', 'noopener');
    else window.location.href = url;
  }

  // Bookmarks
  function openBookmarkModal(colId, editId) {
    if (state.collections.length === 0) { toast('Create a collection first', 'info'); return openCollectionModal(); }
    if (editId) {
      const b = bookmarkById(editId);
      state.forms.bookmark = { id: b.id, title: b.title, url: b.url, collectionId: b.collectionId, customIcon: b.customIcon || '', note: b.note || '', tags: [...(b.tags || [])] };
    } else {
      const cid = colId || state.selectedId || state.collections[0].id;
      state.forms.bookmark = { id: null, title: '', url: '', collectionId: cid, customIcon: '', note: '', tags: [] };
    }
    state.overlay = { type: 'bookmark' };
    renderOverlay();
  }
  function normalizeEnteredUrl(v) {
    v = String(v || '').trim();
    if (!v) return '';
    if (!/^https?:\/\//i.test(v) && /\./.test(v) && !/\s/.test(v)) return 'https://' + v;
    return v;
  }
  function updateBookmarkPreview() {
    const box = document.getElementById('bm-preview');
    if (!box) return;
    const url = normalizeEnteredUrl((document.querySelector('[data-bm="url"]') || {}).value || '');
    if (!isHttp(url)) { box.innerHTML = ''; return; }
    const title = (document.querySelector('[data-bm="title"]') || {}).value || deriveTitle(url);
    const dupe = state.bookmarks.find(b => b.id !== state.forms.bookmark.id && normUrl(b.url) === normUrl(url));
    box.innerHTML = `<div class="url-preview">
        <img src="${esc(faviconUrl(url))}" alt="" data-avatar="${esc(avatarDataUrl(title, url))}" onerror="this.onerror=null;this.src=this.dataset.avatar;">

  }
  function saveBookmark() {

    if (!isHttp(url)) { toast('URL must start with http:// or https://', 'err'); return; }
    if (!title) title = hostOf(url) || 'Bookmark';

  }
  function performDeleteBookmark(id) {
    const idx = state.bookmarks.findIndex(b => b.id === id);

    persist(); closeOverlay(); renderMain();
    toast('Bookmark deleted', 'info', { undoFn: () => { state.bookmarks.splice(Math.min(idx, state.bookmarks.length), 0, removed); persist(); renderMain(); toast('Restored', 'ok'); } });
  }
  function toggleFav(id) {
    const b = bookmarkById(id); if (!b) return;
    b.isFavorite = !b.isFavorite;
    persist(); renderMain();
  }

  // Collections
  function openCollectionModal(editId) {

      const c = collectionById(editId);
      state.forms.collection = { id: c.id, name: c.name, description: c.description, icon: c.icon, accentColor: c.accentColor, view: c.view || '' };
    } else {
      const color = COLORS[state.collections.length % COLORS.length].hex;

  function saveCollection() {

  function performDeleteCollection(id) {
    const idx = state.collections.findIndex(c => c.id === id);

      state.collections.splice(Math.min(idx, state.collections.length), 0, removedCol);

  }
  function moveCollection(id, dir) {
    const idx = state.collections.findIndex(c => c.id === id);

  function doOpenAll(id) {

  // Search
  function doWebSearch() {
    const input = document.querySelector('[data-search]');
