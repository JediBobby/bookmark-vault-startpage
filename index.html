<!DOCTYPE html>
<!--
  Bookmark Vault — single-file HTML bookmark start page.
  Open by double-clicking in any modern browser. No build step.

  External resources:
    1. DuckDuckGo favicon API (icons.duckduckgo.com/ip3/<domain>.ico) — per-bookmark,
       on-demand. Returns 404 on miss, so the image's onerror fires reliably and
       we swap to a deterministic colored-letter SVG avatar (built inline).
    2. BVicon.svg (optional sibling file) — design source; runtime branding uses the
       inlined copy in ICONS.bvicon (favicon SVG, web manifest, iOS/Android home-screen PNGs).
  Everything else (CSS, JS, icons, state) is inlined.
  Fonts fall back to system serifs (Iowan/Palatino/Baskerville etc → Georgia).

  Persisted state:
    localStorage keys
      startpage:groups
      startpage:bookmarks
      startpage:settings
      startpage:view
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookmark Vault</title>
  <meta name="theme-color" content="#0d0d0f" />
  <meta name="application-name" content="Bookmark Vault" />
  <meta name="apple-mobile-web-app-title" content="Bookmark Vault" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Favicon + home-screen icons are installed from ICONS.bvicon (BVicon.svg) at init. -->
  <link rel="icon" type="image/svg+xml" href="BVicon.svg" />
  <style>
    /* ─── Reset ─── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Serif fallback stacks. Body stack favors warm, readable system serifs
       (Iowan, Palatino, Baskerville) before Georgia. Display stack reaches
       for more elegant system faces (Hoefler, Didot, Bodoni) when present. */
    :root {
      --font-serif:
        'Crimson Pro',
        'Iowan Old Style',
        'Palatino Linotype',
        Palatino,
        'Book Antiqua',
        Baskerville,
        'Liberation Serif',
        'DejaVu Serif',
        Georgia,
        serif;
      --font-display:
        'Cormorant Garamond',
        Cormorant,
        'Hoefler Text',
        Didot,
        'Bodoni 72',
        'Big Caslon',
        Garamond,
        'EB Garamond',
        'Palatino Linotype',
        Palatino,
        Baskerville,
        Georgia,
        serif;
    }

    body {
      font-family: var(--font-serif);
      background: #0d0d0f;
      color: #e5e2dc;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      --bg: #0d0d0f;
      --bg-card: rgba(20, 20, 24, 0.7);
      --bg-elevated: rgba(28, 28, 34, 0.8);
      --text: #e5e2dc;
      --text-muted: #8a867f;
      --text-dim: #5a5752;
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.12);
      --danger: #c75050;
      --accent: #c9a227;
      min-height: 100vh;
      position: relative;
    }

    /* Noise overlay — disabled on coarse pointers (see mobile perf block) */
    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* Gradient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      opacity: 0.15;
    }
    .orb-1 { width: 600px; height: 600px; background: var(--accent); top: -200px; right: -100px; }
    .orb-2 { width: 400px; height: 400px; background: #4a6670; bottom: -100px; left: -100px; }
    .orb-3 { width: 300px; height: 300px; background: #705070; top: 50%; left: 50%; transform: translate(-50%, -50%); }

    /* ─── Header ─── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 13, 15, 0.94);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0.5rem 1.5rem;
      min-height: 3.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem 1rem;
      min-width: 0;
      flex: 1 1 auto;
      container-type: inline-size;
      container-name: header-brand;
    }
    .header-meta { min-width: 0; flex-shrink: 0; }
    .header-meta-date {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.05rem;
      min-width: 0;
    }
    .header-meta-day {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.15;
    }
    .header-meta-cal {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.02em;
      line-height: 1.1;
    }
    .logo {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      padding: 0;
      flex-shrink: 0;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo--icon-only { padding: 0.15rem; }
    .logo-icon { color: var(--accent); flex-shrink: 0; display: inline-flex; align-items: center; }
    .logo-icon svg { width: 24px; height: 24px; stroke-width: 2; display: block; }
    /* Inline BV icon shown next to the "Bookmark Vault" text.
       Size tracks the logo-text font-size at each responsive breakpoint. */
    .logo-bvicon-inline {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.3s ease, transform 0.3s ease;
    }
    .logo-bvicon-inline svg { width: 100%; height: 100%; display: block; }
    .logo:hover .logo-bvicon-inline { filter: brightness(1.1); transform: scale(1.04); }
    /* The icon-only-mode BV icon needs a touch more room than the Lucide line icons */
    .logo--icon-only .logo-icon svg { width: 26px; height: 26px; }
    .logo-measure {
      position: absolute;
      visibility: hidden;
      pointer-events: none;
      white-space: nowrap;
      height: 0;
      overflow: hidden;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .logo-text {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent), color-mix(in oklch, var(--accent) 70%, transparent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      transition: filter 0.3s ease, transform 0.3s ease;
      white-space: nowrap;
      display: block;
    }
    .logo:hover .logo-text { filter: brightness(1.2); transform: scale(1.02); }
    .logo--icon-only:hover .logo-icon { opacity: 0.85; }

    .nav {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.35rem;
      flex: 0 1 auto;
      min-width: 0;
    }
    /* DOM order is actions-first for mobile grid; restore toggle-before-actions on wide screens */
    .nav .collection-view-toggle--nav { order: 1; }
    .nav .nav-divider { order: 2; }
    .nav .nav-actions { order: 3; }
    .nav-divider {
      width: 1px;
      height: 1.25rem;
      background: var(--border);
      flex-shrink: 0;
      margin: 0 0.15rem;
    }
    .nav-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }
    .nav-action-label, .view-toggle-label { white-space: nowrap; }
    .nav-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 999px;
      padding: 0.38rem 0.72rem;
      min-height: 2.25rem;
      min-width: 2.25rem;
      white-space: nowrap;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }
    .nav-action svg { display: block; }
    .nav-action:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border);
    }
    .nav-action.active {
      border-color: color-mix(in oklch, var(--accent) 55%, transparent);
      color: color-mix(in oklch, var(--accent) 88%, white);
      background: color-mix(in oklch, var(--accent) 10%, transparent);
    }
    .nav-action:focus-visible {
      outline: 2px solid color-mix(in oklch, var(--accent) 70%, white);
      outline-offset: 3px;
    }

    /* ─── Main ─── */
    .main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 1.5rem 2rem 3rem;
    }
    .section {
      margin-bottom: 2rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s ease forwards;
      animation-delay: calc(var(--delay, 0) * 0.1s);
    }
    /* After the initial mount, disable the staggered fade-in everywhere — it
       only exists to make the first paint feel less abrupt. Without this,
       a star-toggle or settings change would replay the cascade. */
    .app.mounted .section,
    .app.mounted .favorite-link,
    .app.mounted .group-card,
    .app.mounted .bookmark-item { animation: none; }
    .app.mounted .section { opacity: 1; transform: translateY(0); }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .section-title {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .page-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 2.25rem;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    /* Favorites Row */
    .favorites-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in oklch, var(--accent) 55%, transparent) transparent;
      padding: 0.125rem 0.125rem 0.5rem;
      -webkit-overflow-scrolling: touch;
    }
    .favorite-link {
      width: 168px;
      min-width: 168px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.3s ease;
      position: relative;
      opacity: 0;
      animation: fadeUp 0.4s ease forwards;
      animation-delay: calc(var(--i) * 0.05s);
      scroll-snap-align: start;
      text-decoration: none;
    }
    .app.mounted .favorite-link { opacity: 1; }
    .favorite-link:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .favorite-link.with-title {
      padding: 0 0.625rem 0 0.5rem;
      gap: 0.5rem;
      justify-content: flex-start;
    }
    .favorite-link .favorite-label {
      font-size: 0.8rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 116px;
    }
    .favorite-icon { width: 22px; height: 22px; flex-shrink: 0; border-radius: 4px; }

    /* Groups Grid */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }
    .group-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      overflow: hidden;
      backdrop-filter: blur(10px);
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
      animation-delay: calc(var(--gi) * 0.08s);
    }
    .app.mounted .group-card { opacity: 1; }
    .group-card:hover {
      border-color: var(--group-accent);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3),
                  0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      transform: translateY(-2px);
    }

    @keyframes editCardBreathing {
      0%, 100% {
        border-color: color-mix(in srgb, var(--group-accent) 55%, var(--border));
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--group-accent) 22%, transparent) inset,
          0 4px 28px color-mix(in srgb, var(--group-accent) 18%, transparent),
          0 0 24px color-mix(in srgb, var(--group-accent) 12%, transparent);
      }
      50% {
        border-color: color-mix(in srgb, var(--group-accent) 85%, var(--border));
        box-shadow:
          0 0 0 2px color-mix(in srgb, var(--group-accent) 35%, transparent) inset,
          0 10px 40px color-mix(in srgb, var(--group-accent) 32%, transparent),
          0 0 40px color-mix(in srgb, var(--group-accent) 22%, transparent);
      }
    }
    .group-card.group-card-edit-selectable {
      border: 2px dashed color-mix(in srgb, var(--group-accent) 65%, var(--border));
      background:
        linear-gradient(
          160deg,
          color-mix(in srgb, var(--group-accent) 14%, rgba(20, 20, 24, 0.92)) 0%,
          color-mix(in srgb, var(--group-accent) 6%, rgba(20, 20, 24, 0.75)) 45%,
          rgba(255, 255, 255, 0.03) 100%
        );
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--group-accent) 20%, transparent) inset,
        0 6px 32px color-mix(in srgb, var(--group-accent) 22%, transparent),
        0 0 28px color-mix(in srgb, var(--group-accent) 14%, transparent);
      cursor: pointer;
      animation: editCardBreathing 2.8s ease-in-out infinite;
      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease,
        background 0.25s ease;
    }
    .group-card.group-card-edit-selectable:hover {
      animation-play-state: paused;
      border-style: dashed;
      border-color: var(--group-accent);
      transform: translateY(-4px) scale(1.02);
      box-shadow:
        0 0 0 2px color-mix(in srgb, var(--group-accent) 45%, transparent) inset,
        0 14px 48px color-mix(in srgb, var(--group-accent) 38%, transparent),
        0 0 52px color-mix(in srgb, var(--group-accent) 28%, transparent);
      background:
        linear-gradient(
          160deg,
          color-mix(in srgb, var(--group-accent) 22%, rgba(20, 20, 24, 0.95)) 0%,
          color-mix(in srgb, var(--group-accent) 10%, rgba(20, 20, 24, 0.82)) 50%,
          rgba(255, 255, 255, 0.05) 100%
        );
    }
    .group-card.group-card-edit-selectable:focus-visible {
      outline: 2px solid var(--group-accent);
      outline-offset: 3px;
    }
    /* In edit mode the whole card is a single click target — disable child
       pointer events so a stray click on an inner link/button still bubbles
       to the card's data-action="edit-collection" handler. */
    .group-card.group-card-edit-selectable * { pointer-events: none; }
    @media (prefers-reduced-motion: reduce) {
      .group-card.group-card-edit-selectable { animation: none; }
      .group-card.group-card-edit-selectable:hover { transform: translateY(-2px); }
    }

    .group-card-top { padding: 0.75rem 0.875rem; flex: 1; }
    .group-card-header {
      display: flex;
      justify-content: stretch;
      align-items: stretch;
      margin-bottom: 0.5rem;
    }
    .group-card-open-all-summary {
      flex: 1;
      min-width: 0;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      padding: 0.125rem 0.35rem;
      margin: -0.125rem -0.35rem;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      color: inherit;
      transition: background 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .group-card-summary {
      flex: 1;
      min-width: 0;
      width: 100%;
      position: relative;
      padding: 0.125rem 0.35rem;
      margin: -0.125rem -0.35rem;
    }
    .group-card-summary .group-meta { padding-top: 0.15rem; }
    .group-card-open-all-summary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.05); }
    .group-card-open-all-summary:focus-visible {
      outline: 2px solid var(--group-accent);
      outline-offset: 2px;
    }
    .group-card-open-all-summary:disabled { opacity: 0.45; cursor: not-allowed; }

    .group-meta {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }
    .group-meta-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
      text-align: left;
    }
    .group-icon { font-size: 1.35rem; color: var(--group-accent); line-height: 1; }
    .group-name {
      display: block;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 0;
      color: var(--text);
      line-height: 1.3;
    }
    .group-desc {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    /* Description is shown in the group-detail header only; the card preview is tight on space. */
    .group-card .group-desc { display: none; }

    /* Collection Preview */
    .collection-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: flex-start;
    }
    .collection-preview.view-icon-name {
      display: block;
      columns: 2;
      column-gap: 0.5rem;
    }
    .collection-preview.view-icon-abbrev { gap: 0.25rem; }

    .preview-item {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text);
      position: relative;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .collection-preview.view-compact-icon .preview-item {
      width: 36px; height: 36px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .collection-preview.view-large-icon .preview-item {
      width: 52px; height: 52px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    /* Large-icon with names enabled — stack the icon over a centered label,
       borrowing the icon-name typography for visual continuity. */
    .collection-preview.view-large-icon.with-names .preview-item {
      width: 4.5rem;
      height: auto;
      min-height: 76px;
      flex-direction: column;
      gap: 0.3rem;
      padding: 0.5rem 0.3rem 0.4rem;
      text-align: center;
    }
    .collection-preview.view-large-icon.with-names .preview-item-name {
      flex: none;
      max-width: 100%;
      text-align: center;
    }
    .collection-preview.view-icon-name .preview-item {
      width: 100%;
      height: 26px;
      justify-content: flex-start;
      gap: 0.4rem;
      padding: 0 0.375rem;
      border-radius: 5px;
      break-inside: avoid;
      margin-bottom: 0.125rem;
    }
    .collection-preview.view-icon-abbrev .preview-item {
      width: 4rem;
      min-height: 46px;
      flex-direction: column;
      gap: 0.15rem;
      padding: 0.3rem 0.2rem 0.2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: center;
    }
    .preview-item-icon { flex-shrink: 0; }
    .collection-preview.view-compact-icon .preview-item-icon { width: 20px; height: 20px; }
    .collection-preview.view-large-icon .preview-item-icon { width: 30px; height: 30px; }
    .collection-preview.view-icon-name .preview-item-icon,
    .collection-preview.view-icon-abbrev .preview-item-icon { width: 16px; height: 16px; }
    /* Light rounding so the avatar-fallback SVG and real favicons share a shape language. */
    .preview-item-icon { border-radius: 3px; }
    .preview-item-name {
      font-size: 0.7rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .preview-item-abbrev {
      font-size: 0.52rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--text-muted);
      line-height: 1.1;
      word-break: break-word;
    }
    .preview-item-star {
      font-size: 0.6rem;
      color: var(--group-accent);
      flex-shrink: 0;
    }
    .collection-preview.view-compact-icon .preview-item-star,
    .collection-preview.view-large-icon .preview-item-star,
    .collection-preview.view-icon-abbrev .preview-item-star {
      position: absolute;
      top: -4px;
      right: -4px;
      background: rgba(13, 13, 15, 0.9);
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      z-index: 2;
    }
    .preview-item:hover { background: rgba(255, 255, 255, 0.06); }
    .collection-preview.view-compact-icon .preview-item:hover,
    .collection-preview.view-large-icon .preview-item:hover {
      border-color: var(--group-accent);
      transform: scale(1.08);
      z-index: 1;
    }
    .collection-preview.view-icon-abbrev .preview-item:hover {
      border-color: var(--group-accent);
    }
    .preview-more {
      font-size: 0.68rem;
      color: var(--text-dim);
      padding: 0.125rem 0.375rem;
      letter-spacing: 0.02em;
    }
    .no-bookmarks {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-style: italic;
    }

    /* ─── Group Detail ─── */
    .back-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--accent); }

    .group-detail-header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--group-accent);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(10px);
    }
    .group-detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .group-detail-info {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .group-detail-icon { font-size: 2.75rem; color: var(--group-accent); }
    .group-detail-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.75rem;
      margin-bottom: 0.125rem;
    }
    .group-detail-desc { color: var(--text-muted); font-size: 0.9rem; }

    /* Inline Edit Panel */
    .group-edit-panel {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .group-edit-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .group-edit-row-footer {
      justify-content: space-between;
      align-items: center;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .group-edit-field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex: 1;
      min-width: 150px;
    }
    .group-edit-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--font-display);
    }
    .group-edit-toggle {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }
    .group-edit-toggle-info { display: flex; align-items: center; }
    .input-sm { padding: 0.4rem 0.6rem; font-size: 0.85rem; }
    .icon-picker-sm { gap: 0.25rem; }
    .icon-option-sm { width: 28px; height: 28px; font-size: 0.95rem; }
    .color-swatch-sm { width: 22px; height: 22px; }

    .bookmark-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .bookmark-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .bookmark-header-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .collection-view-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.125rem;
      padding: 0.2rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(12px);
    }
    .collection-view-toggle button {
      min-height: 40px;
      padding: 0.35rem 0.7rem;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font: inherit;
      font-size: 0.78rem;
      line-height: 1;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .collection-view-toggle button svg { display: block; }
    .collection-view-toggle button:hover {
      border-color: color-mix(in oklch, var(--accent) 42%, transparent);
      background: color-mix(in oklch, var(--accent) 12%, transparent);
      color: color-mix(in oklch, var(--accent) 88%, white);
    }
    .collection-view-toggle button.active {
      border-color: color-mix(in oklch, var(--accent) 70%, transparent);
      background: color-mix(in oklch, var(--accent) 18%, transparent);
      color: color-mix(in oklch, var(--accent) 95%, white);
    }
    .collection-view-toggle button:focus-visible {
      outline: 2px solid color-mix(in oklch, var(--accent) 70%, white);
      outline-offset: 2px;
    }
    .collection-view-toggle--nav { flex-shrink: 1; min-width: 0; gap: 0.2rem; }
    .collection-view-toggle--nav button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      min-height: 2rem;
      min-width: 2rem;
      padding: 0.22rem 0.45rem;
      font-size: 0.62rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-weight: 650;
    }

    .bookmark-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .collection-bookmark-list--edit {
      --vault-edit-bookmark-width: 17rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, var(--vault-edit-bookmark-width));
      gap: 0.5rem;
      align-items: start;
      justify-content: start;
    }
    .collection-bookmark-list--edit .bookmark-item {
      width: var(--vault-edit-bookmark-width);
      max-width: 100%;
      min-height: 44px;
      padding: 0 0.5rem 0 0.45rem;
      gap: 0.45rem;
      justify-content: flex-start;
      flex: 0 0 auto;
    }
    .collection-bookmark-list--edit .bookmark-favicon { width: 20px; height: 20px; }
    .collection-bookmark-list--edit .bookmark-link {
      display: flex;
      flex: 1;
      align-items: center;
      min-width: 0;
      padding: 0.125rem 0;
    }
    .collection-bookmark-list--edit .bookmark-title {
      display: block;
      flex: 1;
      min-width: 0;
      margin-bottom: 0;
      font-size: 0.8rem;
      line-height: 1.25;
      font-family: var(--font-serif);
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .collection-bookmark-list--edit .bookmark-actions {
      display: flex;
      gap: 0.05rem;
      flex-shrink: 0;
    }
    .collection-bookmark-list--edit .action-btn {
      width: 28px; height: 28px; font-size: 0.75rem;
    }

    .bookmark-item {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      min-height: 52px;
      padding: 0.75rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s ease;
      opacity: 0;
      animation: fadeUp 0.4s ease forwards;
      animation-delay: calc(var(--i) * 0.05s);
      position: relative;
    }
    .app.mounted .bookmark-item { opacity: 1; }
    .bookmark-item:hover {
      border-color: var(--border-hover);
      background: var(--bg-elevated);
    }
    .favorite-link:focus-visible,
    .bookmark-item:focus-within {
      outline: 2px solid color-mix(in oklch, var(--accent) 70%, white);
      outline-offset: 3px;
    }

    .bookmark-favicon { width: 22px; height: 22px; flex-shrink: 0; border-radius: 4px; }
    .bookmark-link {
      flex: 1;
      text-decoration: none;
      min-width: 0;
      padding: 0.125rem 0;
    }
    .bookmark-title {
      display: block;
      color: var(--text);
      font-weight: 500;
      margin-bottom: 0.0625rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bookmark-actions { display: flex; gap: 0.125rem; flex-shrink: 0; }
    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
    }
    .empty-icon {
      display: block;
      font-size: 2.5rem;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
    }
    .empty-text { margin-bottom: 1.25rem; }

    /* ─── Settings ─── */
    .settings-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      backdrop-filter: blur(10px);
    }
    .settings-section-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      color: var(--accent);
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      gap: 1rem;
    }
    .setting-row:not(:last-child) {
      border-bottom: 1px solid var(--border);
    }
    .setting-info { flex: 1; }
    .setting-label { display: block; font-size: 0.9rem; margin-bottom: 0.125rem; }
    .setting-hint { display: block; font-size: 0.75rem; color: var(--text-dim); }

    /* Buttons */
    .btn {
      font-family: var(--font-serif);
      font-size: 0.875rem;
      padding: 0.5rem 1rem;
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
    }
    .btn-sm { padding: 0.45rem 0.85rem; font-size: 0.8rem; border-radius: 4px; }
    .btn-accent { background: var(--accent); color: var(--bg); font-weight: 500; }
    .btn-accent:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text-muted);
    }
    .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { filter: brightness(1.15); }
    .btn-danger-outline {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
    }
    .btn-danger-outline:hover { background: var(--danger); color: white; }

    .action-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .action-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }
    .action-btn.favorited { color: var(--accent); }
    .action-btn.danger:hover { color: var(--danger); }

    /* Form elements */
    .input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 22%, transparent);
    }
    .input::placeholder { color: var(--text-dim); }
    .input-compact {
      width: 70px;
      padding: 0.375rem 0.5rem;
      text-align: center;
    }

    .toggle {
      appearance: none;
      width: 40px; height: 22px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 11px;
      cursor: pointer;
      position: relative;
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .toggle::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      background: var(--text-muted);
      border-radius: 50%;
      top: 2px; left: 2px;
      transition: all 0.3s;
    }
    .toggle:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .toggle:checked::after { background: var(--bg); left: 20px; }

    .field { display: block; margin-bottom: 1rem; }
    .field-label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--font-display);
    }
    .field-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 0;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
    }
    .field-toggle-info { flex: 1; }
    .field-toggle .field-label { margin-bottom: 0.125rem; }
    .field-hint { display: block; font-size: 0.7rem; color: var(--text-dim); }

    .icon-picker, .color-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
    }
    .icon-option {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1.25rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-muted);
    }
    .icon-option:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }
    .icon-option.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .color-swatch {
      width: 28px; height: 28px;
      border: 2px solid transparent;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
    }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.active {
      border-color: white;
      box-shadow: 0 0 0 2px var(--bg);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: linear-gradient(135deg, rgba(28, 28, 34, 0.95), rgba(20, 20, 24, 0.98));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      animation: slideUp 0.3s ease-out;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .modal-sm { max-width: 340px; text-align: center; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.35rem;
      margin-bottom: 1.25rem;
    }
    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1.25rem;
    }
    .confirm-icon {
      display: block;
      font-size: 2rem;
      margin-bottom: 0.75rem;
      color: var(--danger);
    }
    .confirm-text {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* Toasts */
    .toast-container {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }
    .toast {
      padding: 0.75rem 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      animation: toastIn 0.3s ease-out;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .toast-success { border-left: 3px solid #7ba27c; }
    .toast-error { border-left: 3px solid var(--danger); }
    .toast-info { border-left: 3px solid var(--accent); }

    /* Responsive */
    @media (max-width: 1200px) {
      .logo-text, .logo-measure { font-size: 1.2rem; }
      .logo-bvicon-inline { width: 32px; height: 32px; }
      .header-meta-cal { font-size: 0.92rem; }
    }
    @media (max-width: 1024px) {
      .header-inner { padding: 0.45rem 1rem; min-height: 3rem; }
      .header-meta-cal { font-size: 0.85rem; }
      .header-meta-day { font-size: 0.65rem; }
      .logo-text, .logo-measure { font-size: 1.1rem; letter-spacing: 0.1em; }
      .logo-bvicon-inline { width: 28px; height: 28px; }
      .view-toggle-label, .nav-action-label { display: none; }
      .collection-view-toggle--nav button, .nav-action {
        padding: 0.35rem;
        min-width: 2.125rem;
      }
      .main { padding-inline: 1.25rem; }
      .groups-grid { grid-template-columns: repeat(3, 1fr); }
      .bookmark-list { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .header-inner { padding: 0.4rem 0.75rem; gap: 0.5rem; }
      .header-brand { gap: 0.5rem; }
      .header-meta { display: none; }
      .logo-text, .logo-measure { font-size: 1rem; }
      .logo-bvicon-inline { width: 26px; height: 26px; }
      .nav { gap: 0.25rem; }
      .collection-view-toggle--nav { padding: 0.12rem; }
      .collection-view-toggle--nav button {
        min-height: 1.875rem;
        min-width: 1.875rem;
        padding: 0.2rem;
      }
      /* Row 1: logo + Add/Edit/Settings; row 2: view toggle with looser button spacing */
      .header-inner {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 0.35rem;
        row-gap: 0.45rem;
      }
      .header-brand { grid-column: 1; grid-row: 1; min-width: 0; }
      .nav { display: contents; }
      .nav-actions {
        grid-column: 2;
        grid-row: 1;
        flex-shrink: 0;
      }
      .nav-divider { display: none; }
      .header--home .collection-view-toggle--nav {
        grid-column: 1 / -1;
        grid-row: 2;
        justify-self: start;
        max-width: 100%;
        gap: 0.3rem;
        padding: 0.18rem 0.28rem;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .header--home .collection-view-toggle--nav::-webkit-scrollbar { display: none; }
      .header--home .collection-view-toggle--nav button {
        padding: 0.22rem 0.5rem;
        min-width: 2.125rem;
      }
      /* Mobile perf: drop expensive paints; keep layout identical */
      .noise, .orb { display: none; }
      .header {
        backdrop-filter: none;
        background: #0d0d0f;
      }
      .group-card,
      .favorite-link,
      .collection-view-toggle,
      .toast {
        backdrop-filter: none;
      }
      .group-card {
        content-visibility: auto;
        contain-intrinsic-size: auto 180px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }
      .favorite-link {
        transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      }
      .nav-action,
      .collection-view-toggle button {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .groups-grid {
        contain: layout style;
      }
      .main { padding: 1rem; }
      .section { margin-bottom: 1.25rem; }
      .favorites-row {
        margin-inline: -1rem;
        padding-inline: 1rem;
      }
      .favorite-link { width: 152px; min-width: 152px; }
      .favorite-link .favorite-label { max-width: 100px; }
      .groups-grid { grid-template-columns: repeat(2, 1fr); }
      .group-card-top, .group-detail-header, .settings-card { padding: 1rem; }
      .group-detail-top {
        flex-direction: column;
        align-items: flex-start;
      }
      .group-detail-top .btn { width: 100%; justify-content: center; }
      .group-edit-row { flex-direction: column; }
      .group-edit-row-footer {
        flex-direction: column;
        gap: 0.75rem;
        align-items: stretch;
      }
      .group-edit-toggle { justify-content: space-between; }
      .bookmark-list-header {
        align-items: stretch;
        flex-direction: column;
      }
      .bookmark-header-controls { justify-content: stretch; }
      .bookmark-header-controls .btn { width: 100%; justify-content: center; }
      .bookmark-list { grid-template-columns: 1fr; }
      .collection-bookmark-list--edit .bookmark-item { max-width: 100%; }
      .collection-bookmark-list--edit .bookmark-actions { margin-left: auto; }
      .collection-bookmark-list--edit { grid-template-columns: 1fr; }
      .collection-bookmark-list--edit .bookmark-item { width: 100%; }
      .action-btn { width: 40px; height: 40px; }
      .modal-actions { flex-direction: column-reverse; }
      .modal-actions .btn { justify-content: center; width: 100%; }
    }
    @media (max-width: 480px) {
      .logo-text, .logo-measure { font-size: 0.88rem; letter-spacing: 0.08em; }
      .logo-bvicon-inline { width: 22px; height: 22px; }
      .collection-view-toggle--nav button, .nav-action {
        min-height: 2rem;
        min-width: 2rem;
      }
      .groups-grid { grid-template-columns: 1fr; }
    }
    @media (hover: none) {
      .logo:hover .logo-bvicon-inline,
      .logo:hover .logo-text,
      .group-card:hover,
      .favorite-link:hover,
      .btn-accent:hover {
        filter: none;
        transform: none;
        box-shadow: none;
      }
    }
    @media (min-width: 1400px) {

    };

    // Same artwork as BVicon.svg — used for favicon, manifest, and iOS home-screen PNGs.
    function bvIconSvgForBranding() {
      return ICONS.bvicon
        .replace(/\s(width|height)="100%"/g, '')
        .replace(/\saria-hidden="true"/, '');
    }

    function svgToDataUrl(svg) {
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.trim());
    }

    function upsertHeadLink(rel, href, { sizes, type } = {}) {
      const selector = sizes
        ? `link[rel="${rel}"][sizes="${sizes}"]`
        : `link[rel="${rel}"]`;
      let link = [...document.head.querySelectorAll(selector)].find(
        (el) => (sizes ? el.sizes?.value === sizes : !el.sizes?.value)
      );
      if (!link) {
        link = document.createElement('link');
        link.rel = rel;
        if (sizes) link.sizes = sizes;
        document.head.appendChild(link);
      }
      link.href = href;
      if (type) link.type = type;
      return link;
    }

    function rasterizeSvgToPng(svg, size) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = size;
          const ctx = canvas.getContext('2d');
          if (!ctx) { reject(new Error('Canvas unsupported')); return; }
          ctx.drawImage(img, 0, 0, size, size);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = () => reject(new Error('SVG rasterize failed'));
        img.src = svgToDataUrl(svg);
      });
    }

    let brandingIconsInstalled = false;
    async function installBrandingIcons() {
      if (brandingIconsInstalled) return;
      brandingIconsInstalled = true;

      const svg = bvIconSvgForBranding();
      const svgDataUrl = svgToDataUrl(svg);
      upsertHeadLink('icon', svgDataUrl, { type: 'image/svg+xml' });

      try {
        const [touch180, icon192, icon512] = await Promise.all([
          rasterizeSvgToPng(svg, 180),
          rasterizeSvgToPng(svg, 192),
          rasterizeSvgToPng(svg, 512),
        ]);
        upsertHeadLink('apple-touch-icon', touch180, { sizes: '180x180' });
        const manifest = {
          name: 'Bookmark Vault',
          short_name: 'Vault',
          description: 'Personal bookmark start page',
          start_url: './',
          scope: './',
          display: 'standalone',
          background_color: '#0d0d0f',
          theme_color: '#0d0d0f',
          icons: [
            { src: svgDataUrl, sizes: 'any', type: 'image/svg+xml', purpose: 'any' },
            { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
          ],
        };
        const prev = document.querySelector('link[rel="manifest"]');
        if (prev?.href?.startsWith('blob:')) URL.revokeObjectURL(prev.href);
        upsertHeadLink(
          'manifest',
          URL.createObjectURL(
            new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' })
          )
        );
      } catch {
        upsertHeadLink('apple-touch-icon', svgDataUrl);
      }
    }

    // ────────────────────────────────────────────────────────────────────

      { id: '2', name: 'Study',              description: 'Courses, study tools & resources',   icon: '❖', accentColor: '#c9a227' },

      { id: '4', name: 'AI',                 description: 'AI assistants & developer tools',    icon: '❋', accentColor: '#7ba2a2' },
      { id: '5', name: 'Reference',          description: 'Reference docs & reading lists',     icon: '◈', accentColor: '#a27b7b' },

    const DEFAULT_SETTINGS = {
      confirmBeforeOpenAll: true,

    // which has emoji presentation on iOS) still render fine — the picker

    const ICON_OPTIONS  = [
      '◆','◇','◈','❖',
      '●','○','◉','◎',
      '■','□','▣','▢',
      '▲','△','▽','◁',

    const COLOR_OPTIONS = ['#c9a227','#7ba27c','#a27b7b','#7b8fa2','#a2977b','#9b7ba2','#7ba2a2','#a28b7b'];
    // Names used in aria-label and tooltip — friendlier than reading a hex.

      '#c9a227': 'Gold',
      '#7ba27c': 'Sage',
      '#a27b7b': 'Rose',
      '#7b8fa2': 'Steel',
      '#a2977b': 'Sand',
      '#9b7ba2': 'Plum',
      '#7ba2a2': 'Teal',
      '#a28b7b': 'Clay',

    function colorName(hex) { return COLOR_NAMES[hex] || hex; }

    // ────────────────────────────────────────────────────────────────────
    // Persistence — localStorage with namespaced keys.
    // ────────────────────────────────────────────────────────────────────
    const STORAGE = {
      groups:   'startpage:groups',
      bookmarks:'startpage:bookmarks',
      settings: 'startpage:settings',
      view:     'startpage:view',
    };

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw == null) return fallback;
        return JSON.parse(raw);
      } catch (_) {
        return fallback;
      }
    }
    let quotaWarningShown = false;
    function saveJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); }
      catch (_) {
        // Quota exceeded or storage disabled. Warn once — changes will appear
        // to "stick" in memory but be lost on refresh.
        if (!quotaWarningShown) {
          quotaWarningShown = true;
          // Defer so we don't trigger showToast during state-init persistAll().
          setTimeout(() => showToast('Could not save — browser storage is full or disabled', 'error'), 0);
        }
      }
    }

    function persistAll() {
      saveJSON(STORAGE.groups,    state.groups);
      saveJSON(STORAGE.bookmarks, state.bookmarks);
      saveJSON(STORAGE.settings,  state.settings);
      saveJSON(STORAGE.view,      state.collectionBookmarkView);
    }

    // ────────────────────────────────────────────────────────────────────
    // Application state.
    // ────────────────────────────────────────────────────────────────────
    let state = {
      mounted: false,
      currentView: 'home',          // 'home' | 'group' | 'settings'
      selectedGroupId: null,
      editingBookmark: null,
      editingGroup: null,

      showBookmarkModal: false,

      toasts: [],
      currentDay: '',
      currentDate: '',
      logoShowsIconOnly: false,
      groups:    loadJSON(STORAGE.groups,    DEFAULT_GROUPS),
      bookmarks: loadJSON(STORAGE.bookmarks, DEFAULT_BOOKMARKS),
      settings:  Object.assign({}, DEFAULT_SETTINGS, loadJSON(STORAGE.settings, {})),
      groupForm:    makeEmptyGroupForm(),
      bookmarkForm: makeEmptyBookmarkForm(),
    };

    // ────────────────────────────────────────────────────────────────────
    function makeEmptyGroupForm() {
      return { name: '', description: '', icon: '◆', accentColor: '#c9a227' };
    }
    function makeEmptyBookmarkForm() {
      return { title: '', url: '' };
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function generateId() {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }
      return Math.random().toString(36).substring(2, 11);
    }

    function isAllowedUrl(url) {
      try { return /^https?:$/i.test(new URL(url).protocol); }
      catch (_) { return false; }
    }

    function sanitizeHref(url) {
      return isAllowedUrl(url) ? url : '#';
    }

    function getFaviconUrl(url) {
      try {
        const domain = new URL(url).hostname;
        // DuckDuckGo returns 404 on miss (unlike Google, which serves a generic
        // globe at 200 OK and would suppress our onerror avatar fallback).
        return `https://icons.duckduckgo.com/ip3/${domain}.ico`;
      } catch (_) {
        return '';
      }
    }

    // ── Letter-avatar fallback ──────────────────────────────────────────
    // Muted jewel tones picked to harmonize with the dark/serif/gold palette.
    // Avoids saturated Material-Design candy colors.
    const AVATAR_PALETTE = [
      '#6b2e3a', // burgundy
      '#345240', // forest
      '#3d4a5c', // slate
      '#5a3a5e', // plum
      '#7a5a2a', // ochre
      '#2e545a', // teal
      '#6b3a2e', // mahogany
      '#3a3a6b', // indigo
      '#4a5230', // olive
      '#6b5230', // bronze
      '#4a2e5a', // aubergine
      '#5a2e3a', // cordovan
    ];

    function hashStringToInt(str) {
      // djb2 — small, deterministic, good enough for palette bucketing.
      let h = 5381;
      for (let i = 0; i < str.length; i++) {
        h = ((h << 5) + h) + str.charCodeAt(i);
        h |= 0;
      }
      return Math.abs(h);
    }

    function getAvatarColor(url) {
      try {
        const host = new URL(url).hostname.replace(/^www\./, '');
        return AVATAR_PALETTE[hashStringToInt(host) % AVATAR_PALETTE.length];
      } catch (_) {
        return AVATAR_PALETTE[0];
      }
    }

    function getAvatarLetter(title) {
      const first = String(title || '').trim().charAt(0).toUpperCase();
      return first || '?';
    }

    function getAvatarDataUrl(title, url) {
      const bg = getAvatarColor(url);
      const letter = getAvatarLetter(title);
      // Inline SVG — matches the 32px favicon footprint so layout doesn't shift
      // between favicon-loaded and avatar-fallback states.
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="${bg}"/><text x="16" y="22" font-family="Cormorant Garamond, Hoefler Text, Georgia, serif" font-size="18" font-weight="600" text-anchor="middle" fill="#f4ede0">${escapeHtml(letter)}</text></svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function getAbbreviatedBookmarkTitle(title) {
      const cleaned = String(title || '').trim().replace(/\s+/g, ' ');
      if (!cleaned) return '';
      const words = cleaned.split(/[\s\-_/]+/).filter(Boolean);
      if (words.length >= 2) {
        return words
          .slice(0, 4)
          .map(w => w.charAt(0).toUpperCase())
          .join('')
          .slice(0, 8);
      }
      const w = words[0] || cleaned;
      if (w.length <= 10) return w;
      return `${w.slice(0, 9)}…`;
    }

    function favoriteBookmarks() {
      return state.bookmarks.filter(b => b.isFavorite);
    }
    function groupById(id) {
      return state.groups.find(g => g.id === id);
    }
    function bookmarksInGroup(id) {
      return state.bookmarks.filter(b => b.groupId === id);
    }

    function showToast(message, type = 'success') {
      const id = generateId();
      state.toasts = [...state.toasts, { id, message, type }];
      renderToasts();
      setTimeout(() => {
        state.toasts = state.toasts.filter(t => t.id !== id);
        renderToasts();
      }, 3000);
    }

    // ── Modal focus management ──────────────────────────────────────────
    // We stash a stable selector for the trigger (rather than a DOM node)
    // because render()'s innerHTML rewrite invalidates the original node
    // before applyModalFocus runs.
    let lastTriggerSelector = null;
    const FOCUSABLE_SEL = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

    function isModalOpen() {
      return !!(state.showGroupModal || state.showBookmarkModal || state.showDeleteConfirm || state.showOpenAllConfirm);
    }

    function selectorForTrigger(el) {
      if (!el || !el.dataset || !el.dataset.action) return null;
      const cssEscape = (s) => (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/"/g, '\\"');
      let s = `[data-action="${cssEscape(el.dataset.action)}"]`;
      ['groupId', 'bookmarkId', 'view', 'icon', 'color', 'modal', 'setting'].forEach(k => {
        const v = el.dataset[k];
        if (v == null) return;
        const attr = 'data-' + k.replace(/[A-Z]/g, m => '-' + m.toLowerCase());
        s += `[${attr}="${cssEscape(v)}"]`;
      });
      return s;
    }

    function applyModalFocus() {
      const overlay = document.querySelector('.modal-overlay');
      // Background siblings of the overlay become inert while a modal is up,
      // hiding them from keyboard tab order and assistive tech.
      document.querySelectorAll('.app > :not(#modal-root):not(.toast-container)').forEach(el => {
        if (overlay) {
          el.setAttribute('inert', '');
          el.setAttribute('aria-hidden', 'true');
        } else {
          el.removeAttribute('inert');
          el.removeAttribute('aria-hidden');
        }
      });
      if (overlay) {
        if (!overlay.contains(document.activeElement)) {
          const first = overlay.querySelector(FOCUSABLE_SEL);
          (first || overlay).focus();
        }
      } else if (lastTriggerSelector) {
        const trigger = document.querySelector(lastTriggerSelector);
        if (trigger) trigger.focus();
        lastTriggerSelector = null;
      }
    }

    // ────────────────────────────────────────────────────────────────────
    // Date display.
    // ────────────────────────────────────────────────────────────────────
    function updateDateTime() {
      const now = new Date();
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      state.currentDay  = days[now.getDay()];
      state.currentDate = `${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
      const dayEl = document.querySelector('.header-meta-day');
      const calEl = document.querySelector('.header-meta-cal');
      if (dayEl)  dayEl.textContent  = state.currentDay;
      if (calEl)  calEl.textContent  = state.currentDate;
    }

    // Schedule the first tick at the next midnight (+ a small jitter) and
    // then daily thereafter. A naive hourly interval would leave the date
    // stale for up to 59 minutes after midnight in a long-open tab.
    function scheduleDailyDateUpdate() {
      const now = new Date();
      const nextMidnight = new Date(now);
      nextMidnight.setHours(24, 0, 5, 0);
      setTimeout(() => {
        updateDateTime();
        setInterval(updateDateTime, 24 * 60 * 60 * 1000);
      }, nextMidnight - now);
    }

    // ────────────────────────────────────────────────────────────────────
    // Render — patches the existing shell when possible so decorative layers,
    // the header emblem, and bookmark favicons are not torn down on every tap.
    // Inputs in inline editor use updateGroupFieldFromInput (no re-render).
    // ────────────────────────────────────────────────────────────────────
    function renderMainInner() {
      if (state.currentView === 'home') return renderHome();
      if (state.currentView === 'group') return renderGroupDetail();
      if (state.currentView === 'settings') return renderSettings();
      return '';
    }

    function patchAccent() {
      const app = document.querySelector('.app');
      if (app) app.style.setProperty('--accent', state.settings.accentColor);
    }

    function patchHeader() {
      const app = document.querySelector('.app');
      if (!app) return;
      const html = renderHeader();
      const existing = app.querySelector('.app-header');
      if (existing) existing.outerHTML = html;
      else app.querySelector('.main')?.insertAdjacentHTML('beforebegin', html);
    }

    function patchModals() {
      const app = document.querySelector('.app');
      if (!app) return;
      let root = app.querySelector('#modal-root');
      if (!root) {
        root = document.createElement('div');
        root.id = 'modal-root';
        app.querySelector('.toast-container')?.insertAdjacentElement('beforebegin', root);
      }
      root.innerHTML = renderModals();
    }

    function patchToasts() {
      const c = document.querySelector('.toast-container');
      if (c) c.innerHTML = renderToastList();
    }

    function afterPatch() {
      requestAnimationFrame(() => {
        syncLogoDisplay();
        applyModalFocus();
      });
    }

    function ensureAppShell() {
      const root = document.getElementById('app-root');
      if (root.querySelector('.app')) return;
      root.innerHTML = `
        <div class="app${state.mounted ? ' mounted' : ''}" style="--accent: ${escapeHtml(state.settings.accentColor)}">
          <div class="noise"></div>
          <div class="orb orb-1"></div>
          <div class="orb orb-2"></div>
          <div class="orb orb-3"></div>
          ${renderHeader()}
          <main class="main">${renderMainInner()}</main>
          <div id="modal-root"></div>
          <div class="toast-container" role="status" aria-live="polite"></div>
        </div>
      `;
    }

    function render() {
      ensureAppShell();
      const app = document.querySelector('.app');
      if (app) app.classList.toggle('mounted', !!state.mounted);
      patchAccent();
      patchHeader();
      rerenderMainOnly();
      patchModals();
      patchToasts();
      afterPatch();
    }

    function syncViewToggleButtons() {
      document.querySelectorAll('[data-action="set-view"]').forEach((btn) => {
        const active = btn.dataset.view === state.collectionBookmarkView;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', String(active));
      });
    }

    function renderHeader() {
      const logoTitle = state.editingCollections ? 'Select to Edit' : 'Bookmark Vault';
      // Icon-only mode: pencil while editing, otherwise the BV emblem.
      // Text mode: BV emblem inline + title text.
      const iconOnlyHtml = state.editingCollections ? ICONS.pencilLogo : ICONS.bvicon;
      const logoInner = state.logoShowsIconOnly
        ? `<span class="logo-icon">${iconOnlyHtml}</span>`
        : `<span class="logo-bvicon-inline">${ICONS.bvicon}</span><span class="logo-text">${escapeHtml(logoTitle)}</span>`;

      const viewToggle = state.currentView === 'home' ? `
        <div class="collection-view-toggle collection-view-toggle--nav" aria-label="Collection bookmark view">
          ${viewToggleButton('icon-abbrev', ICONS.caseLower, 'Short', 'Icon with abbreviated name below')}
          ${viewToggleButton('compact-icon', ICONS.grid2x2,  'Icon',  'Compact icon only')}
          ${viewToggleButton('icon-name',    ICONS.list,      'Name',  'Icon with name to the right')}
          ${viewToggleButton('large-icon',   ICONS.square,    'Large', 'Large icon only')}
        </div>` : '';

      return `
        <header class="header app-header${viewToggle ? ' header--home' : ''}">
          <div class="header-inner">
            <div class="header-brand">
              <div class="header-meta">

                  <span class="header-meta-day">${escapeHtml(state.currentDay)}</span>
                  <span class="header-meta-cal">${escapeHtml(state.currentDate)}</span>
                </span>
              </div>
              <button
                class="logo${state.logoShowsIconOnly ? ' logo--icon-only' : ''}"
                type="button"

            </div>
            <nav class="nav" aria-label="Main navigation">
              <div class="nav-actions">
                <button type="button" class="nav-action" data-action="open-group-modal" aria-label="Add collection">
                  ${ICONS.plus}<span class="nav-action-label">Add</span>
                </button>
                <button
                  type="button"
                  class="nav-action${state.editingCollections ? ' active' : ''}"
                  data-action="toggle-edit-collections"
                  aria-pressed="${state.editingCollections}"

                  ${ICONS.pencil}<span class="nav-action-label">Edit</span>
                </button>
                <button
                  type="button"

    function viewToggleButton(view, iconHtml, label, title) {
      const active = state.collectionBookmarkView === view ? ' active' : '';
      return `
        <button
          type="button"
          class="${active.trim()}"
          data-action="set-view"
          data-view="${view}"
          aria-pressed="${state.collectionBookmarkView === view}"
          aria-label="${escapeHtml(title)}"
          title="${escapeHtml(title)}"

    // ── Home view ───────────────────────────────────────────────────────
    function renderHome() {
      const favs = favoriteBookmarks();
      const favSection = favs.length === 0 ? '' : `
        <section class="section" style="--delay: 0">
          <div class="favorites-row">
            ${favs.map((b, i) => `
              <a href="${escapeHtml(sanitizeHref(b.url))}" target="_blank" rel="noopener"
                 class="favorite-link with-title"
                 style="--i: ${i}"

                <img src="${escapeHtml(getFaviconUrl(b.url))}" alt=""
                     class="favorite-icon"
                     data-avatar="${escapeHtml(getAvatarDataUrl(b.title, b.url))}"
                     onerror="this.onerror=null;this.src=this.dataset.avatar;" />
                <span class="favorite-label">${escapeHtml(b.title)}</span>
              </a>
            `).join('')}
          </div>
        </section>`;

      const grid = `
        <section class="section" style="--delay: 1">
          <div class="groups-grid">
            ${state.groups.map((g, gi) => renderGroupCard(g, gi)).join('')}
          </div>
        </section>`;

      return favSection + grid;
    }

    // ── Home: group card ────────────────────────────────────────────────
    function renderGroupCard(group, gi) {
      const groupBms = bookmarksInGroup(group.id);
      const editable = state.editingCollections;
      const summary = editable
        ? `<div class="group-card-summary">${renderGroupMeta(group)}</div>`
        : `<button type="button" class="group-card-open-all-summary"
              ${groupBms.length === 0 ? 'disabled' : ''}
              data-action="open-all"
              data-group-id="${escapeHtml(group.id)}"
              aria-label="${escapeHtml(groupBms.length === 0
                ? `${group.name}: no bookmarks to open`
                : `Open all ${groupBms.length} bookmark${groupBms.length !== 1 ? 's' : ''} in ${group.name}`)}">
              ${renderGroupMeta(group)}
            </button>`;

      const preview = groupBms.length === 0
        ? `<span class="no-bookmarks">No bookmarks yet</span>`
        : groupBms.map(bm => renderPreviewItem(bm)).join('');

      return `
        <article
          class="group-card${editable ? ' group-card-edit-selectable' : ''}"
          style="--group-accent: ${escapeHtml(group.accentColor)}; --gi: ${gi}"
          ${editable ? `role="button" tabindex="0" aria-label="Edit collection: ${escapeHtml(group.name)}" data-action="edit-collection" data-group-id="${escapeHtml(group.id)}"` : ''}
        >
          <div class="group-card-top">
            <div class="group-card-header">${summary}</div>
            <div class="group-card-content">
              <div class="collection-preview view-${escapeHtml(state.collectionBookmarkView)}${state.collectionBookmarkView === 'large-icon' && state.settings.showNamesUnderLargeIcons ? ' with-names' : ''}">
                ${preview}
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderGroupMeta(group) {
      return `
        <span class="group-meta">
          <span class="group-icon" aria-hidden="true">${escapeHtml(group.icon)}</span>
          <span class="group-meta-text">
            <span class="group-name">${escapeHtml(group.name)}</span>
            <span class="group-desc">${escapeHtml(group.description)}</span>
          </span>
        </span>`;
    }

    function renderPreviewItem(bm) {
      const star = bm.isFavorite ? `<span class="preview-item-star">★</span>` : '';
      const largeWithNames = state.collectionBookmarkView === 'large-icon' && state.settings.showNamesUnderLargeIcons;
      const extra = state.collectionBookmarkView === 'icon-name' || largeWithNames
        ? `<span class="preview-item-name">${escapeHtml(bm.title)}</span>`
        : state.collectionBookmarkView === 'icon-abbrev'
          ? `<span class="preview-item-abbrev">${escapeHtml(getAbbreviatedBookmarkTitle(bm.title))}</span>`
          : '';
      return `
        <a href="${escapeHtml(sanitizeHref(bm.url))}" target="_blank" rel="noopener"
           class="preview-item"
           title="${escapeHtml(bm.title)}"
           data-stop="1">
          <img src="${escapeHtml(getFaviconUrl(bm.url))}" alt=""
               class="preview-item-icon"
               data-avatar="${escapeHtml(getAvatarDataUrl(bm.title, bm.url))}"
               onerror="this.onerror=null;this.src=this.dataset.avatar;" />
          ${extra}
          ${star}
        </a>`;
    }

    // ── Group detail view ───────────────────────────────────────────────

      return `

                         value="${escapeHtml(group.name)}"
                         data-inline-field="name"

                         placeholder="Collection name" />

                <label class="group-edit-field">
