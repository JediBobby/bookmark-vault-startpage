              <pre style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; font-size: 0.72rem; line-height: 1.5; color: var(--text-muted); overflow-x: auto; white-space: pre; font-family: monospace;">{
  "groups": [
    { "id": "1", "name": "My Group", "description": "...",
      "icon": "◆", "accentColor": "#c9a227" }
  ],
  "bookmarks": [
    { "id": "b1", "title": "Example", "url": "https://example.com/",
      "isFavorite": false, "groupId": "1" }
  ]
}</pre>
            </div>
          </div>
        </section>
      `;
    }

    // ── Data export / import ────────────────────────────────────────────
    function exportData() {
      const data = {
        groups: state.groups,
        bookmarks: state.bookmarks,
        settings: state.settings,
        collectionBookmarkView: state.collectionBookmarkView,
        exportedAt: new Date().toISOString(),
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bookmark-vault-export.json';
      a.click();
      // Defer revoke — some browsers (older Firefox especially) haven't started
      // consuming the blob yet when click() returns.
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Data exported', 'success');
    }

    function normalizeImportedGroup(g) {
      if (!g || typeof g !== 'object') return null;
      if (typeof g.id !== 'string' || !g.id) return null;
      if (typeof g.name !== 'string' || !g.name.trim()) return null;
      return {
        id: g.id,
        name: String(g.name),
        description: typeof g.description === 'string' ? g.description : '',
        icon: typeof g.icon === 'string' && g.icon ? g.icon : '◆',
        accentColor: typeof g.accentColor === 'string' && /^#[0-9a-f]{3,8}$/i.test(g.accentColor)
          ? g.accentColor : '#c9a227',
      };
    }
    function normalizeImportedBookmark(b, validGroupIds) {
      if (!b || typeof b !== 'object') return null;
      if (typeof b.id !== 'string' || !b.id) return null;
      if (typeof b.title !== 'string' || !b.title.trim()) return null;
      if (typeof b.url !== 'string' || !b.url.trim()) return null;
      if (typeof b.groupId !== 'string' || !validGroupIds.has(b.groupId)) return null;
      return {
        id: b.id,
        title: String(b.title),
        url: String(b.url),
        isFavorite: !!b.isFavorite,
        groupId: b.groupId,
      };
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (!Array.isArray(data.groups) || !Array.isArray(data.bookmarks)) {
              showToast('Invalid file: missing groups or bookmarks', 'error');
              return;
            }
            const groups = data.groups.map(normalizeImportedGroup).filter(Boolean);
            if (groups.length === 0) {
              showToast('Invalid file: no usable groups (need id and name)', 'error');
              return;
            }
            const validIds = new Set(groups.map(g => g.id));
            const bookmarks = data.bookmarks.map(b => normalizeImportedBookmark(b, validIds)).filter(Boolean);
            const droppedGroups = data.groups.length - groups.length;
            const droppedBookmarks = data.bookmarks.length - bookmarks.length;
            state.groups = groups;
            state.bookmarks = bookmarks;
            if (data.settings && typeof data.settings === 'object') {
              state.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings);
            }
            if (typeof data.collectionBookmarkView === 'string') {
              state.collectionBookmarkView = data.collectionBookmarkView;
            }
            persistAll();
            const dropped = droppedGroups + droppedBookmarks;
            if (dropped > 0) {
              showToast(`Imported (skipped ${dropped} invalid item${dropped !== 1 ? 's' : ''})`, 'info');
            } else {
              showToast('Data imported successfully', 'success');
            }
            render();
          } catch (_) {
            showToast('Failed to read file: invalid JSON', 'error');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function resetData() {
      Object.values(STORAGE).forEach(key => localStorage.removeItem(key));
      state.groups = DEFAULT_GROUPS;
      state.bookmarks = DEFAULT_BOOKMARKS;
      state.settings = Object.assign({}, DEFAULT_SETTINGS);
      state.collectionBookmarkView = 'icon-abbrev';
      state.currentView = 'home';
      state.selectedGroupId = null;
      persistAll();
      showToast('Reset to defaults', 'success');
      render();
    }

    // ── Modals ──────────────────────────────────────────────────────────
    function renderModals() {
      let out = '';
      if (state.showGroupModal)    out += renderGroupModal();
      if (state.showBookmarkModal) out += renderBookmarkModal();
      if (state.showDeleteConfirm) out += renderDeleteConfirmModal();
      if (state.showOpenAllConfirm)out += renderOpenAllConfirmModal();
      return out;
    }

    function renderGroupModal() {
      const f = state.groupForm;
      const isEdit = !!state.editingGroup;
      return `
        <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title-group" tabindex="-1" data-action="close-modal" data-modal="group">
          <div class="modal" role="presentation" data-stop="1">
            <h2 class="modal-title" id="modal-title-group">${isEdit ? 'Edit Collection' : 'New Collection'}</h2>
            <form data-action="save-group">
              <label class="field">
                <span class="field-label">Name</span>
                <input type="text" class="input" value="${escapeHtml(f.name)}"
                       data-form-field="name" data-form="group" placeholder="Collection name" />
              </label>
              <label class="field">
                <span class="field-label">Description</span>
                <input type="text" class="input" value="${escapeHtml(f.description)}"
                       data-form-field="description" data-form="group" placeholder="Brief description" />
              </label>
              <div class="field">
                <span class="field-label">Icon</span>
                <div class="icon-picker">
                  ${ICON_OPTIONS.map(icon => `
                    <button type="button"
                            class="icon-option${f.icon === icon ? ' active' : ''}"
                            data-action="set-form-group-icon" data-icon="${escapeHtml(icon)}">${escapeHtml(icon)}</button>
                  `).join('')}
                </div>
              </div>
              <div class="field">
                <span class="field-label">Color</span>
                <div class="color-picker">
                  ${COLOR_OPTIONS.map(color => `
                    <button type="button"
                            class="color-swatch${f.accentColor === color ? ' active' : ''}"
                            style="background: ${escapeHtml(color)}"
                            data-action="set-form-group-color" data-color="${escapeHtml(color)}"
                            aria-label="Select color ${escapeHtml(colorName(color))}" title="${escapeHtml(colorName(color))}"></button>
                  `).join('')}
                </div>
              </div>
              <div class="modal-actions">
                <button type="button" class="btn btn-ghost" data-action="close-modal" data-modal="group">Cancel</button>
                <button type="submit" class="btn btn-accent">${isEdit ? 'Save Changes' : 'Create Collection'}</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderBookmarkModal() {
      const f = state.bookmarkForm;
      const isEdit = !!state.editingBookmark;
      return `
        <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title-bookmark" tabindex="-1" data-action="close-modal" data-modal="bookmark">
          <div class="modal" role="presentation" data-stop="1">
            <h2 class="modal-title" id="modal-title-bookmark">${isEdit ? 'Edit Bookmark' : 'Add Bookmark'}</h2>
            <form data-action="save-bookmark">
              <label class="field">
                <span class="field-label">Title</span>
                <input type="text" class="input" value="${escapeHtml(f.title)}"
                       data-form-field="title" data-form="bookmark" placeholder="Bookmark title" />
              </label>
              <label class="field">
                <span class="field-label">URL</span>
                <input type="url" class="input" value="${escapeHtml(f.url)}"
                       data-form-field="url" data-form="bookmark" placeholder="https://example.com" />
              </label>
              <div class="modal-actions">
                <button type="button" class="btn btn-ghost" data-action="close-modal" data-modal="bookmark">Cancel</button>
                <button type="submit" class="btn btn-accent">${isEdit ? 'Save Changes' : 'Add Bookmark'}</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderDeleteConfirmModal() {
      const d = state.showDeleteConfirm;
      const titles = { group: 'Delete Collection?', bookmark: 'Delete Bookmark?', reset: 'Reset All Data?' };
      const messages = {
        group: 'All bookmarks in this collection will also be deleted.',
        bookmark: 'This bookmark will be permanently removed.',
        reset: 'All collections, bookmarks, and settings will be replaced with defaults. This cannot be undone.',
      };
      return `
        <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title-delete" tabindex="-1" data-action="close-modal" data-modal="delete">
          <div class="modal modal-sm" role="presentation" data-stop="1">
            <span class="confirm-icon" aria-hidden="true">⚠</span>
            <h2 class="modal-title" id="modal-title-delete">${titles[d.type] || 'Confirm'}</h2>
            <p class="confirm-text">${messages[d.type] || ''}</p>
            <div class="modal-actions">
              <button class="btn btn-ghost" data-action="close-modal" data-modal="delete">Cancel</button>
              <button class="btn btn-danger" data-action="do-delete">${d.type === 'reset' ? 'Reset' : 'Delete'}</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderOpenAllConfirmModal() {
      const groupId = state.showOpenAllConfirm;
      const group = groupById(groupId);
      const count = bookmarksInGroup(groupId).length;
      const willOpen = Math.min(count, state.settings.maxTabsLimit);
      return `
        <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title-open-all" tabindex="-1" data-action="close-modal" data-modal="open-all">
          <div class="modal modal-sm" role="presentation" data-stop="1">
            <!-- Accent color overrides the default danger red — Open All is not destructive. -->
            <span class="confirm-icon" aria-hidden="true" style="color: var(--accent)">❖</span>
            <h2 class="modal-title" id="modal-title-open-all">Open all bookmarks?</h2>
            <p class="confirm-text">
              Opening ${willOpen} bookmark${count !== 1 ? 's' : ''} from "${escapeHtml(group ? group.name : '')}"
            </p>
            <div class="modal-actions">
              <button class="btn btn-ghost" data-action="close-modal" data-modal="open-all">Cancel</button>
              <button class="btn btn-accent" data-action="do-open-all">Open All</button>
            </div>
          </div>
        </div>
      `;
    }

    // ── Toasts ──────────────────────────────────────────────────────────
    function renderToastList() {
      return state.toasts.map(t => `<div class="toast toast-${escapeHtml(t.type)}">${escapeHtml(t.message)}</div>`).join('');
    }
    function renderToasts() {
      const c = document.querySelector('.toast-container');
      if (c) c.innerHTML = renderToastList();
    }

    // ────────────────────────────────────────────────────────────────────
    // Logo width measurement — collapses logo to icon when text wouldn't fit.
    // ────────────────────────────────────────────────────────────────────
    // Width budget for the inline BV emblem + its gap to the title text.
    // Kept in sync with .logo-bvicon-inline (default 36px, shrinks at breakpoints)
    // and .logo gap (0.5rem = 8px). Using the largest default size is a safe
    // over-reservation — collapse fires marginally earlier on small screens
    // but never later than it should.
    const LOGO_INLINE_ICON_WIDTH = 36 + 8;

    function syncLogoDisplay() {
      const brand = document.querySelector('.header-brand');
      const measure = document.querySelector('.logo-measure');
      if (!brand || !measure) return;
      const brandWidth = brand.clientWidth;
      const meta = brand.querySelector('.header-meta');
      const metaWidth = meta ? meta.offsetWidth : 0;
      const cs = getComputedStyle(brand);
      const gap = parseFloat(cs.columnGap || cs.gap) || 16;
      // Reserve space for the inline emblem too — without this the title would
      // overflow before triggering the collapse-to-icon-only fallback.
      const available = brandWidth - metaWidth - gap - LOGO_INLINE_ICON_WIDTH;
      const shouldBeIconOnly = measure.offsetWidth > Math.max(available - 4, 0);
      if (shouldBeIconOnly !== state.logoShowsIconOnly) {
        state.logoShowsIconOnly = shouldBeIconOnly;
        // Re-render only the logo button to avoid wiping the whole header.
        const logoBtn = document.querySelector('.logo');
        const logoTitle = state.editingCollections ? 'Select to Edit' : 'Bookmark Vault';
        const iconOnlyHtml = state.editingCollections ? ICONS.pencilLogo : ICONS.bvicon;
        if (logoBtn) {
          logoBtn.classList.toggle('logo--icon-only', shouldBeIconOnly);
          logoBtn.innerHTML = shouldBeIconOnly
            ? `<span class="logo-icon">${iconOnlyHtml}</span><span class="logo-measure" aria-hidden="true">${escapeHtml(logoTitle)}</span>`
            : `<span class="logo-bvicon-inline">${ICONS.bvicon}</span><span class="logo-text">${escapeHtml(logoTitle)}</span><span class="logo-measure" aria-hidden="true">${escapeHtml(logoTitle)}</span>`;
          logoBtn.setAttribute('aria-label', logoTitle);
        }
      }
    }

    // ────────────────────────────────────────────────────────────────────
    // Action handlers.
    // ────────────────────────────────────────────────────────────────────
    function goHome() {
      state.currentView = 'home';
      state.selectedGroupId = null;
      state.editingGroup = null;
      render();
    }
    function goToGroupDetail(id) {
      state.editingCollections = false;
      state.selectedGroupId = id;
      state.currentView = 'group';
      render();
    }
    function openSettings() {
      state.editingCollections = false;
      if (state.currentView === 'settings') { goHome(); return; }
      state.currentView = 'settings';
      state.selectedGroupId = null;
      render();
    }
    function toggleEditCollections() {
      if (state.editingCollections) {
        state.editingCollections = false;
      } else {
        if (state.currentView !== 'home') {
          state.currentView = 'home';
          state.selectedGroupId = null;
        }
        state.editingCollections = true;
      }
      render();
    }
    function setView(view) {
      state.collectionBookmarkView = view;
      persistAll();
      syncViewToggleButtons();
      rerenderMainOnly();
    }

    // Group modal
    function openGroupModal(groupId) {
      if (groupId) {
        const g = groupById(groupId);
        if (g) {
          state.groupForm = { name: g.name, description: g.description, icon: g.icon, accentColor: g.accentColor };
          state.editingGroup = groupId;
        }
      } else {
        state.groupForm = makeEmptyGroupForm();
        state.editingGroup = null;
      }
      state.showGroupModal = true;
      patchModals();
      afterPatch();
    }
    function saveGroup() {
      const f = state.groupForm;
      if (!f.name.trim()) { showToast('Group name is required', 'error'); return; }
      if (state.editingGroup) {
        state.groups = state.groups.map(g => g.id === state.editingGroup ? Object.assign({}, g, f) : g);
        showToast('Collection updated');
      } else {
        state.groups = [...state.groups, Object.assign({}, f, { id: generateId() })];
        showToast('Collection created');
      }
      state.showGroupModal = false;
      persistAll();
      render();
    }

    // Bookmark modal
    function openBookmarkModal(bookmarkId) {
      if (bookmarkId) {
        const b = state.bookmarks.find(x => x.id === bookmarkId);
        if (b) {
          state.bookmarkForm = { title: b.title, url: b.url };
          state.editingBookmark = bookmarkId;
        }
      } else {
        state.bookmarkForm = makeEmptyBookmarkForm();
        state.editingBookmark = null;
      }
      state.showBookmarkModal = true;
      patchModals();
      afterPatch();
    }
    function saveBookmark() {
      const f = state.bookmarkForm;
      if (!f.title.trim() || !f.url.trim()) { showToast('Title and URL are required', 'error'); return; }
      if (!isAllowedUrl(f.url)) { showToast('URL must start with http:// or https://', 'error'); return; }
      if (state.editingBookmark) {
        state.bookmarks = state.bookmarks.map(b => b.id === state.editingBookmark ? Object.assign({}, b, f) : b);
        showToast('Bookmark updated');
      } else if (state.selectedGroupId) {
        state.bookmarks = [...state.bookmarks, Object.assign({}, f, { id: generateId(), isFavorite: false, groupId: state.selectedGroupId })];
        showToast('Bookmark added');
      }
      state.showBookmarkModal = false;
      persistAll();
      render();
    }

    // Delete confirm
    function confirmDeleteGroup(id)    { state.showDeleteConfirm = { type: 'group', id };    patchModals(); afterPatch(); }
    function confirmDeleteBookmark(id) { state.showDeleteConfirm = { type: 'bookmark', id }; patchModals(); afterPatch(); }
    function doDelete() {
      const d = state.showDeleteConfirm;
      if (!d) return;
      if (d.type === 'reset') {
        state.showDeleteConfirm = null;
        resetData();
        return;
      }
      if (d.type === 'group') {
        state.groups = state.groups.filter(g => g.id !== d.id);
        state.bookmarks = state.bookmarks.filter(b => b.groupId !== d.id);
        state.showDeleteConfirm = null;
        if (state.selectedGroupId === d.id) {
          state.currentView = 'home';
          state.selectedGroupId = null;
        }
        showToast('Collection deleted');
      } else {
        state.bookmarks = state.bookmarks.filter(b => b.id !== d.id);
        state.showDeleteConfirm = null;
        showToast('Bookmark deleted');
      }
      persistAll();
      render();
    }

    function toggleFavorite(id) {
      state.bookmarks = state.bookmarks.map(b => b.id === id ? Object.assign({}, b, { isFavorite: !b.isFavorite }) : b);
      const b = state.bookmarks.find(x => x.id === id);
      showToast(b && b.isFavorite ? 'Added to favorites' : 'Removed from favorites', 'info');
      persistAll();
      // Only the main view depends on isFavorite — skip rebuilding header,
      // orbs, modals, and toasts (and avoid re-issuing every favicon HTTP
      // request from the home grid).
      rerenderMainOnly();
    }

    function rerenderMainOnly() {
      const main = document.querySelector('.main');
      if (!main) { render(); return; }
      main.innerHTML = renderMainInner();
    }

    // Open all
    function handleOpenAll(groupId) {
      if (state.settings.confirmBeforeOpenAll) {
        state.showOpenAllConfirm = groupId;
        patchModals();
        afterPatch();
      } else {
        openAllBookmarks(groupId);
      }
    }
    function openAllBookmarks(groupId) {
      const groupBms = bookmarksInGroup(groupId);
      const toOpen = groupBms.slice(0, state.settings.maxTabsLimit).filter(b => isAllowedUrl(b.url));
      state.showOpenAllConfirm = null;
      if (state.settings.staggeredTabOpening && state.settings.openInNewTabs) {
        toOpen.forEach((b, i) => {
          setTimeout(() => window.open(b.url, '_blank'), i * 400);
        });
      } else {
        toOpen.forEach(b => {
          if (state.settings.openInNewTabs) window.open(b.url, '_blank');
          else window.location.href = b.url;
        });
      }
      showToast(`Opened ${toOpen.length} bookmark${toOpen.length !== 1 ? 's' : ''}`);
      render();
    }
    // Settings
    function updateSetting(key, value) {
      state.settings = Object.assign({}, state.settings, { [key]: value });
      showToast('Settings saved', 'info');
      persistAll();
      patchAccent();
      if (key === 'accentColor') {
        document.querySelectorAll('.color-swatch').forEach((sw) => {
          sw.classList.toggle('active', sw.dataset.color === value);
        });
      }
      if (key === 'showNamesUnderLargeIcons' && state.currentView === 'home') rerenderMainOnly();
    }

    // Group inline editor
    function updateGroupFieldFromInput(groupId, field, value) {
      state.groups = state.groups.map(g => g.id === groupId ? Object.assign({}, g, { [field]: value }) : g);
      persistAll();
      // Light-touch DOM updates so the focused input isn't blown away.
      if (field === 'name') {
        const t = document.querySelector('.group-detail-title');
        if (t) t.textContent = value;
      } else if (field === 'description') {
        const d = document.querySelector('.group-detail-desc');
        if (d) d.textContent = value;
      }
    }
    function updateGroupField(groupId, field, value) {
      state.groups = state.groups.map(g => g.id === groupId ? Object.assign({}, g, { [field]: value }) : g);
      persistAll();
      render();
    }

    // ────────────────────────────────────────────────────────────────────
    // Event delegation.
    // ────────────────────────────────────────────────────────────────────
    function handleClick(e) {
      const target = e.target.closest('[data-action], [data-stop]');
      if (!target) return;

      // data-stop="1" marks elements (like .modal or .preview-item links inside
      // an edit-mode group card) that should swallow the bubble so an outer
      // handler doesn't fire. They never have a data-action of their own.
      if (target.matches('[data-stop="1"]')) { e.stopPropagation(); return; }

      const action = target.dataset.action;
      if (!action) return;

      // Snapshot the trigger's selector so applyModalFocus can find the
      // equivalent button after render() rewrites the DOM.
      if (!isModalOpen()) lastTriggerSelector = selectorForTrigger(target);

      switch (action) {
        case 'go-home': goHome(); break;
        case 'open-settings': openSettings(); break;
        case 'toggle-edit-collections': toggleEditCollections(); break;
        case 'set-view': setView(target.dataset.view); break;
        case 'open-group-modal': openGroupModal(); break;
        case 'edit-collection': goToGroupDetail(target.dataset.groupId); break;
        case 'open-all':
          e.stopPropagation();
          handleOpenAll(target.dataset.groupId);
          break;
        case 'open-bookmark-modal': openBookmarkModal(); break;
        case 'edit-bookmark': openBookmarkModal(target.dataset.bookmarkId); break;
        case 'delete-bookmark': confirmDeleteBookmark(target.dataset.bookmarkId); break;
        case 'confirm-delete-group': confirmDeleteGroup(target.dataset.groupId); break;
        case 'toggle-favorite': toggleFavorite(target.dataset.bookmarkId); break;
        case 'set-group-icon':  updateGroupField(target.dataset.groupId, 'icon',        target.dataset.icon); break;
        case 'set-group-color': updateGroupField(target.dataset.groupId, 'accentColor', target.dataset.color); break;
        case 'set-form-group-icon':  state.groupForm.icon = target.dataset.icon;        patchModals(); afterPatch(); break;
        case 'set-form-group-color': state.groupForm.accentColor = target.dataset.color; patchModals(); afterPatch(); break;
        case 'close-modal':
          if (target.dataset.modal === 'group')    state.showGroupModal = false;
          if (target.dataset.modal === 'bookmark') state.showBookmarkModal = false;
          if (target.dataset.modal === 'delete')   state.showDeleteConfirm = null;
          if (target.dataset.modal === 'open-all') state.showOpenAllConfirm = null;
          patchModals();
          afterPatch();
          break;
        case 'do-delete': doDelete(); break;
        case 'do-open-all': openAllBookmarks(state.showOpenAllConfirm); break;
        case 'set-setting-accent': updateSetting('accentColor', target.dataset.color); break;
        case 'export-data': exportData(); break;
        case 'import-data': importData(); break;
        case 'confirm-reset-data': state.showDeleteConfirm = { type: 'reset' }; patchModals(); afterPatch(); break;
      }
    }

    function handleChange(e) {
      const t = e.target;
      const action = t.dataset.action;
      if (action === 'set-setting') {
        const key = t.dataset.setting;
        if (t.type === 'checkbox') {
          updateSetting(key, t.checked);
        } else if (t.type === 'number') {
          // Ignore empty / NaN input mid-typing — only commit a valid number, clamped to the HTML range.
          const parsed = parseInt(t.value, 10);
          if (!Number.isFinite(parsed)) return;
          updateSetting(key, Math.min(50, Math.max(1, parsed)));
        }
      }
    }

    function handleInput(e) {
      const t = e.target;
      const inlineField = t.dataset.inlineField;
      if (inlineField) {
        updateGroupFieldFromInput(t.dataset.groupId, inlineField, t.value);
        return;
      }
      const formField = t.dataset.formField;
      if (formField) {
        const form = t.dataset.form;
        if (form === 'group') {
          if (t.type === 'checkbox') state.groupForm[formField] = t.checked;
          else state.groupForm[formField] = t.value;
        } else if (form === 'bookmark') {
          state.bookmarkForm[formField] = t.value;
        }
      }
    }

    function handleSubmit(e) {
      const t = e.target;
      const action = t.dataset.action;
      if (action === 'save-group') {
        e.preventDefault();
        saveGroup();
      } else if (action === 'save-bookmark') {
        e.preventDefault();
        saveBookmark();
      }
    }

    function handleKeydown(e) {
      if (e.key === 'Escape') {
        if (state.showGroupModal)     { state.showGroupModal = false; patchModals(); afterPatch(); }
        else if (state.showBookmarkModal) { state.showBookmarkModal = false; patchModals(); afterPatch(); }
        else if (state.showDeleteConfirm) { state.showDeleteConfirm = null; patchModals(); afterPatch(); }
        else if (state.showOpenAllConfirm){ state.showOpenAllConfirm = null; patchModals(); afterPatch(); }
        return;
      }
      if (e.key === 'Tab' && isModalOpen()) {
        const overlay = document.querySelector('.modal-overlay');
        if (!overlay) return;
        const focusables = overlay.querySelectorAll(FOCUSABLE_SEL);
        if (focusables.length === 0) { e.preventDefault(); overlay.focus(); return; }
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault(); last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault(); first.focus();
        }
      }
    }

    // Edit-mode keyboard activation for the group card.
    function handleEditCardKeydown(e) {
      if (!state.editingCollections) return;
      const card = e.target.closest('[data-action="edit-collection"]');
      if (!card) return;
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        goToGroupDetail(card.dataset.groupId);
      }
    }

    // ────────────────────────────────────────────────────────────────────
    // Init.
    // ────────────────────────────────────────────────────────────────────
    function init() {
      const runBranding = () => installBrandingIcons();
      if ('requestIdleCallback' in window) {
        requestIdleCallback(runBranding, { timeout: 2500 });
      } else {
        setTimeout(runBranding, 200);
      }
      updateDateTime();
      render();
      // mount animation
      setTimeout(() => {
        state.mounted = true;
        document.querySelector('.app')?.classList.add('mounted');
      }, 50);

      scheduleDailyDateUpdate();

      let resizeLogoRaf = 0;
      window.addEventListener('resize', () => {
        cancelAnimationFrame(resizeLogoRaf);
        resizeLogoRaf = requestAnimationFrame(syncLogoDisplay);
      }, { passive: true });

      // Global event delegation.
      document.addEventListener('click', handleClick);
      document.addEventListener('change', handleChange);
      document.addEventListener('input', handleInput);
      document.addEventListener('submit', handleSubmit);
      document.addEventListener('keydown', handleKeydown);
      document.addEventListener('keydown', handleEditCardKeydown);
    }

    init();
  </script>
</body>
</html>
