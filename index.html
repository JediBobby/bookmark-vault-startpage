    if (!q) return;
    const bang = /(^|\s)!\S/.test(q);
    const eng = engineById(state.settings.searchEngine);
    const url = bang ? 'https://duckduckgo.com/?q=' + encodeURIComponent(q) : eng.url.replace('%s', encodeURIComponent(q));
    window.location.href = url;
  }
  function cycleEngine() {
    const i = ENGINES.findIndex(e => e.id === state.settings.searchEngine);
    state.settings.searchEngine = ENGINES[(i + 1) % ENGINES.length].id;
    persist();
    const eng = engineById(state.settings.searchEngine);
    const label = document.querySelector('.search-engine .eng-label');
    const input = document.querySelector('[data-search]');
    if (label) label.textContent = eng.short;
    if (input) { input.setAttribute('placeholder', `Search ${eng.label}${eng.bangs ? '  —  try !w, !g, !yt' : ''}…`); input.focus(); }
    const btn = document.querySelector('.search-engine');
    if (btn) { btn.setAttribute('aria-label', `Search engine: ${eng.label}. Click to change.`); }
  }
  function syncSearchClear() {
    const input = document.querySelector('[data-search]');
    const clr = document.querySelector('[data-act="clear-search"]');
    const has = !!(input && input.value.trim());
    if (clr) clr.hidden = !has;
    const form = input && input.closest('.search');
    if (form) form.classList.toggle('has-text', has);
  }
  function clearSearch() {
    const input = document.querySelector('[data-search]');
    if (input) { input.value = ''; input.focus(); }
    syncSearchClear();
  }

  // Theme / settings
  function cycleTheme() {
    const order = ['dark', 'light', 'auto'];
    state.settings.theme = order[(order.indexOf(state.settings.theme) + 1) % order.length];
    persist(); applyChrome(); render(); renderOverlay(); renderDrawer();
    toast('Theme: ' + state.settings.theme, 'info');
  }
  function setOpt(key, val) {
    if (key === 'weekStart') val = parseInt(val, 10);
    state.settings[key] = val;
    persist(); applyChrome(); render(); renderOverlay();
  }
  function setAccent(color) {
    state.settings.accentColor = color;
    persist(); applyChrome(); render();
  }

  // Palette
  function openPalette() {
    if (state.overlay) return;
    state.palette.query = ''; state.palette.index = 0;
    state.overlay = { type: 'palette' };
    renderOverlay();
  }
  function movePalette(delta) {
    if (!_palResults.length) return;
    let i = state.palette.index + delta;
    if (i < 0) i = _palResults.length - 1;
    if (i >= _palResults.length) i = 0;
    state.palette.index = i;
    refreshPalette();
  }
  function runPalette(i) {
    const item = _palResults[i != null ? i : state.palette.index];
    if (item && item.run) item.run();
  }

  // Calendar
  function openCalendar() {
    const now = new Date();
    if (!state.calendar.year) { state.calendar.year = now.getFullYear(); state.calendar.month = now.getMonth(); }
    state.overlay = { type: 'calendar' };
    renderOverlay();
  }
  function calNav(dir) {
    let m = state.calendar.month + dir, y = state.calendar.year;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    state.calendar.month = m; state.calendar.year = y;
    renderOverlay();
  }
  function calToday() { const now = new Date(); state.calendar.year = now.getFullYear(); state.calendar.month = now.getMonth(); renderOverlay(); }

  // Notes
  function openNotes() { state.drawer = 'notes'; renderDrawer(); requestAnimationFrame(() => { const i = document.querySelector('[data-note-input]'); if (i) i.focus(); }); }
  function closeDrawer() { state.drawer = null; renderDrawer(); }
  function addNote(text) {
    text = String(text || '').trim(); if (!text) return;
    state.notes.unshift({ id: uid(), text, done: false, createdAt: Date.now() });
    persist(); renderDrawer();
    requestAnimationFrame(() => { const i = document.querySelector('[data-note-input]'); if (i) i.focus(); });
  }
  function toggleNote(id) { const n = state.notes.find(x => x.id === id); if (n) { n.done = !n.done; persist(); renderDrawer(); } }
  function deleteNote(id) { state.notes = state.notes.filter(x => x.id !== id); persist(); renderDrawer(); }
  function clearDoneNotes() { state.notes = state.notes.filter(n => !n.done); persist(); renderDrawer(); }

  // Overlay close
  function closeOverlay() { state.overlay = null; renderOverlay(); }
  function afterOverlayOpen() { if (state.overlay && state.overlay.type === 'bookmark') updateBookmarkPreview(); }

  // Data: export / import / reset
  function exportData() {
    const data = { version: 2, collections: state.collections, bookmarks: state.bookmarks, notes: state.notes, settings: state.settings, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'bookmark-vault-backup.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Backup exported', 'ok');
  }
  function importJson() {
    pickFile('.json,application/json', (text) => {
      try {
        let data = JSON.parse(text);
        // Accept a 1.x export ({ groups, bookmarks, collectionBookmarkView }) by
        // converting it to the 2.0 shape first.
        let fromV1 = false;
        if (!Array.isArray(data.collections) && Array.isArray(data.groups)) {
          const conv = transformV1({ groups: data.groups, bookmarks: data.bookmarks, settings: data.settings, view: data.collectionBookmarkView });
          if (conv) { data = conv; fromV1 = true; }
        }
        if (!Array.isArray(data.collections)) { toast('Invalid backup: no collections or groups', 'err'); return; }
        const n = normalize(data);
        if (n.collections.length === 0) { toast('Invalid backup: no usable collections', 'err'); return; }
        state.collections = n.collections; state.bookmarks = n.bookmarks; state.notes = n.notes; state.settings = n.settings;
        state.route = 'home'; state.selectedId = null;
        persist(); paintAll();
        toast(`Imported ${n.collections.length} collections, ${n.bookmarks.length} bookmarks${fromV1 ? ' (from 1.x)' : ''}`, 'ok');
      } catch { toast('Could not read file: invalid JSON', 'err'); }
    });
  }
  function importHtml() {
    pickFile('.html,.htm,text/html', (text) => {
      const { folders, orphans } = parseNetscape(text);
      let addedCols = 0, addedBms = 0;
      const pushCollection = (name, links) => {
        if (!links.length) return;
        const color = COLORS[(state.collections.length + addedCols) % COLORS.length].hex;
        const icon = GLYPHS[(state.collections.length + addedCols) % GLYPHS.length];
        const col = { id: uid(), name: name || 'Imported', description: '', icon, accentColor: color, createdAt: Date.now() };
        state.collections.push(col); addedCols++;
        links.forEach(l => { state.bookmarks.push({ id: uid(), title: l.title, url: l.url, isFavorite: false, collectionId: col.id, note: '', tags: [], customIcon: '', createdAt: Date.now() }); addedBms++; });
      };
      folders.forEach(f => pushCollection(f.name, f.links));
      if (orphans.length) pushCollection('Imported', orphans);
      if (addedBms === 0) { toast('No bookmarks found in that file', 'err'); return; }
      persist(); paintAll();
      toast(`Imported ${addedBms} bookmarks into ${addedCols} collections`, 'ok');
    });
  }
  function parseNetscape(text) {
    const doc = new DOMParser().parseFromString(text, 'text/html');
    const folders = [], orphans = [];
    const linkFrom = (a) => { const url = a.getAttribute('href') || ''; return /^https?:/i.test(url) ? { title: (a.textContent || '').trim() || deriveTitle(url), url } : null; };
    function processDL(dl, sink) {
      Array.from(dl.children).forEach(node => {
        if (node.tagName === 'DL') { processDL(node, sink); return; }
        if (node.tagName !== 'DT') return;
        const h3 = node.querySelector(':scope > h3, :scope > H3');
        const a = node.querySelector(':scope > a, :scope > A');
        if (h3) {
          const folder = { name: (h3.textContent || '').trim() || 'Imported', links: [] };
          folders.push(folder);
          let sub = node.querySelector(':scope > dl');
          if (!sub && node.nextElementSibling && node.nextElementSibling.tagName === 'DL') sub = node.nextElementSibling;
          if (sub) processDL(sub, folder.links);
        } else if (a) {
          const l = linkFrom(a); if (l) sink.push(l);
        }
      });
    }
    const top = doc.querySelector('dl');
    if (top) processDL(top, orphans);
    else Array.from(doc.querySelectorAll('a[href]')).forEach(a => { const l = linkFrom(a); if (l) orphans.push(l); });
    return { folders, orphans };
  }
  function resetData() {
    try { localStorage.removeItem(STORE_KEY); } catch {}
    state.collections = seedCollections(); state.bookmarks = []; state.notes = [];
    state.settings = Object.assign({}, DEFAULT_SETTINGS);
    state.route = 'home'; state.selectedId = null; state.editingCollections = false;
    persist(); paintAll(); toast('Reset to defaults', 'ok');
  }
  function pickFile(accept, cb) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = accept;
    input.onchange = () => { const file = input.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => cb(String(r.result || '')); r.readAsText(file); };
    input.click();
  }

  // Focus management
  const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  function manageFocus() {
    const ovEl = $overlay.querySelector('.overlay');
    const drEl = $drawer.querySelector('.drawer');
    const modalOpen = !!ovEl, drawerOpen = !!drEl;
    document.getElementById('app').inert = modalOpen || drawerOpen;
    $drawer.inert = modalOpen;
    const top = ovEl ? $overlay : (drEl ? $drawer : null);
    if (top && !top.contains(document.activeElement)) {
      const f = top.querySelector(FOCUSABLE);
      (f || top).focus({ preventScroll: true });
    }
  }
  function isOverlayOpen() { return !!state.overlay || state.drawer === 'notes'; }

  // ══════════════════════════════════════════════════════════════════════
  // Events
  // ══════════════════════════════════════════════════════════════════════
  function handleClick(e) {
    const el = e.target.closest('[data-act],[data-stop]');
    if (!el) return;
    if (!el.dataset.act) { e.stopPropagation(); return; } // data-stop guard (e.g. modal body)
    const act = el.dataset.act, id = el.dataset.id;
    switch (act) {
      case 'home': goHome(); break;
      case 'open-settings': goSettings(); break;
      case 'toggle-edit': toggleEdit(); break;
      case 'cycle-theme': cycleTheme(); break;
      case 'cycle-engine': cycleEngine(); break;
      case 'clear-search': clearSearch(); break;
      case 'open-palette': openPalette(); break;
      case 'open-calendar': openCalendar(); break;
      case 'add-bookmark': openBookmarkModal(id); break;
      case 'new-collection': openCollectionModal(); break;
      case 'open-collection': openCollection(id); break;
      case 'edit-collection': openCollectionModal(id); break;
      case 'open-all': e.stopPropagation(); openAll(id); break;
      case 'do-open-all': doOpenAll(id); break;
      case 'move-collection': e.stopPropagation(); moveCollection(id, parseInt(el.dataset.dir, 10)); break;
      case 'toggle-fav': toggleFav(id); break;
      case 'edit-bookmark': openBookmarkModal(null, id); break;
      case 'delete-bookmark': state.overlay = { type: 'confirm', kind: 'delete-bookmark', id }; renderOverlay(); break;
      case 'delete-collection': state.overlay = { type: 'confirm', kind: 'delete-collection', id }; renderOverlay(); break;
      case 'confirm-reset': state.overlay = { type: 'confirm', kind: 'reset' }; renderOverlay(); break;
      case 'confirm-yes': handleConfirmYes(); break;
      case 'close-overlay': closeOverlay(); break;
      case 'close-drawer': closeDrawer(); break;
      case 'set-default-view': state.settings.defaultView = el.dataset.view; persist(); render(); break;
      case 'set-accent': setAccent(el.dataset.color); break;
      case 'set-opt': setOpt(el.dataset.key, el.dataset.val); break;
      case 'pick-col-icon': state.forms.collection.icon = el.dataset.icon; renderOverlay(); break;
      case 'pick-col-color': state.forms.collection.accentColor = el.dataset.color; renderOverlay(); break;
      case 'pick-col-view': state.forms.collection.view = el.dataset.view || ''; renderOverlay(); break;
      case 'export': exportData(); break;
      case 'import-json': importJson(); break;
      case 'import-html': importHtml(); break;
      case 'open-shortcuts': state.overlay = { type: 'shortcuts' }; renderOverlay(); break;
      case 'pal-run': runPalette(parseInt(el.dataset.idx, 10)); break;
      case 'cal-nav': calNav(parseInt(el.dataset.dir, 10)); break;
      case 'cal-today': calToday(); break;
      case 'cal-months': state.calendar.months = parseInt(el.dataset.val, 10); renderOverlay(); break;
      case 'toggle-note': toggleNote(id); break;
      case 'delete-note': deleteNote(id); break;
      case 'clear-done-notes': clearDoneNotes(); break;
      case 'undo': doUndo(id); break;
    }
  }
  function handleConfirmYes() {
    const o = state.overlay; if (!o) return;
    if (o.kind === 'delete-bookmark') performDeleteBookmark(o.id);
    else if (o.kind === 'delete-collection') performDeleteCollection(o.id);
    else if (o.kind === 'reset') { state.overlay = null; resetData(); }
  }

  function handleSubmit(e) {
    const act = e.target.dataset.act;
    if (act === 'websearch') { e.preventDefault(); doWebSearch(); }
    else if (act === 'save-bookmark') { e.preventDefault(); saveBookmark(); }
    else if (act === 'save-collection') { e.preventDefault(); saveCollection(); }
    else if (act === 'add-note') { e.preventDefault(); const i = e.target.querySelector('[data-note-input]'); addNote(i ? i.value : ''); }
  }

  function handleInput(e) {
    const t = e.target;
    if (t.matches('[data-search]')) { syncSearchClear(); return; }
    if (t.matches('[data-pal-input]')) { state.palette.query = t.value; state.palette.index = 0; refreshPalette(); return; }
    if (t.dataset.bm) {
      const k = t.dataset.bm, f = state.forms.bookmark;
      if (k === 'tags') f.tags = t.value.split(',').map(s => s.trim()).filter(Boolean);
      else f[k] = t.value;
      if (k === 'url') {
        const ti = document.querySelector('[data-bm="title"]');
        if (ti && !ti.value.trim()) { ti.value = deriveTitle(normalizeEnteredUrl(t.value)); f.title = ti.value; }
      }
      if (k === 'url' || k === 'title') updateBookmarkPreview();
      return;
    }
    if (t.dataset.col) {
      const k = t.dataset.col, f = state.forms.collection;
      if (k === 'iconCustom') { if (t.value.trim()) f.icon = t.value.trim(); }
      else if (k === 'colorCustom') { f.accentColor = t.value; }
      else f[k] = t.value;
      return;
    }
    if (t.dataset.act === 'set-setting' && t.type === 'text') {
      state.settings[t.dataset.key] = t.value; persist();
    }
  }

  function handleChange(e) {
    const t = e.target, act = t.dataset.act;
    if (act === 'set-accent-input') { setAccent(t.value); return; }
    if (act !== 'set-setting') return;
    const key = t.dataset.key;
    if (t.type === 'checkbox') { state.settings[key] = t.checked; persist(); applyChrome(); render(); }
    else if (t.type === 'number') { const n = parseInt(t.value, 10); if (Number.isFinite(n)) { state.settings[key] = Math.min(50, Math.max(1, n)); persist(); } }
    else if (t.tagName === 'SELECT') { state.settings[key] = t.value; persist(); render(); }
  }

  let _chord = 0;
  function handleKeydown(e) {
    const k = e.key, mod = e.ctrlKey || e.metaKey;
    const ae = document.activeElement;
    const inField = ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable);

    if (mod && !e.altKey && (k === 'k' || k === 'K' || k === 'o' || k === 'O')) {
      e.preventDefault();
      if (state.overlay && state.overlay.type === 'palette') closeOverlay(); else openPalette();
      return;
    }
    if (state.overlay && state.overlay.type === 'palette') {
      if (k === 'ArrowDown') { e.preventDefault(); movePalette(1); return; }
      if (k === 'ArrowUp') { e.preventDefault(); movePalette(-1); return; }
      if (k === 'Enter') { e.preventDefault(); runPalette(); return; }
    }
    if ((k === 'Enter' || k === ' ') && ae && ae.matches && ae.matches('.col-card.editing')) {
      e.preventDefault(); openCollectionModal(ae.dataset.id); return;
    }
    if (k === 'Escape') {
      if (state.overlay) { closeOverlay(); e.preventDefault(); }
      else if (state.drawer) { closeDrawer(); e.preventDefault(); }
      else if (ae && ae.matches && ae.matches('[data-search]') && ae.value) { clearSearch(); e.preventDefault(); }
      return;
    }
    if (k === 'Tab' && (state.overlay || state.drawer === 'notes')) { trapTab(e); return; }
    if (inField) return;

    if (k === '/') { e.preventDefault(); const s = document.querySelector('[data-search]'); if (s) s.focus(); return; }
    if (k === '?') { e.preventDefault(); state.overlay = { type: 'shortcuts' }; renderOverlay(); return; }
    if (k === 'g' || k === 'G') { _chord = Date.now(); return; }
    if ((k === 'c' || k === 'C') && Date.now() - _chord < 900) { _chord = 0; openCalendar(); return; }
    if (/^[1-9]$/.test(k) && !state.overlay && !state.drawer && state.route === 'home') {
      const b = favorites()[parseInt(k, 10) - 1];
      if (b) { e.preventDefault(); launch(b.url); }
    }
  }
  function trapTab(e) {
    const scope = state.overlay ? $overlay.querySelector('.overlay') : $drawer.querySelector('.drawer');
    if (!scope) return;
    const f = Array.from(scope.querySelectorAll(FOCUSABLE)).filter(el => el.offsetParent !== null || el === document.activeElement);
    if (!f.length) { e.preventDefault(); scope.focus && scope.focus(); return; }
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  // Drag & drop
  function markDragOver(el) { document.querySelectorAll('.drag-over').forEach(x => { if (x !== el) x.classList.remove('drag-over'); }); el.classList.add('drag-over'); }
  function cleanupDrag() { state.dragId = null; state.dragKind = null; document.querySelectorAll('.drag-ghost,.drag-over').forEach(x => x.classList.remove('drag-ghost', 'drag-over')); }
  function onDragStart(e) {
    const handle = e.target.closest && e.target.closest('[data-drag-handle]');
    const colCard = e.target.closest && e.target.closest('.col-card.editing[data-drag="collection"]');
    let el, kind, id;
    if (handle) { el = handle.closest('.mark'); if (!el) return; kind = 'bookmark'; id = el.dataset.id; }
    else if (colCard) { el = colCard; kind = 'collection'; id = colCard.dataset.id; }
    else return;
    state.dragKind = kind; state.dragId = id;
    el.classList.add('drag-ghost');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', id); } catch {}
  }
  function onDragOver(e) {
    if (!state.dragId) return;
    const sel = state.dragKind === 'collection' ? '.col-card[data-drag="collection"]' : '.mark[data-drag="bookmark"]';
    const el = e.target.closest && e.target.closest(sel);
    if (!el || el.dataset.id === state.dragId) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move'; markDragOver(el);
  }
  function onDrop(e) {
    if (!state.dragId) return;
    const sel = state.dragKind === 'collection' ? '.col-card[data-drag="collection"]' : '.mark[data-drag="bookmark"]';
    const el = e.target.closest && e.target.closest(sel);
    e.preventDefault();
    if (el) { if (state.dragKind === 'collection') reorderCollections(state.dragId, el.dataset.id); else reorderBookmarks(state.dragId, el.dataset.id); }
    cleanupDrag();
  }
  function reorderCollections(dragId, targetId) {
    const from = state.collections.findIndex(c => c.id === dragId), to = state.collections.findIndex(c => c.id === targetId);
    if (from < 0 || to < 0 || from === to) return;
    const [c] = state.collections.splice(from, 1);
    const nt = state.collections.findIndex(x => x.id === targetId);
    state.collections.splice(from < to ? nt + 1 : nt, 0, c);
    persist(); render();
  }
  function reorderBookmarks(dragId, targetId) {
    const from = state.bookmarks.findIndex(b => b.id === dragId), to = state.bookmarks.findIndex(b => b.id === targetId);
    if (from < 0 || to < 0 || from === to) return;
    const [b] = state.bookmarks.splice(from, 1);
    const nt = state.bookmarks.findIndex(x => x.id === targetId);
    state.bookmarks.splice(from < to ? nt + 1 : nt, 0, b);
    persist(); renderMain();
  }

  // ══════════════════════════════════════════════════════════════════════
  // Branding (favicon + PWA manifest from the inline emblem)
  // ══════════════════════════════════════════════════════════════════════
  function svgDataUrl(svg) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.trim()); }
  function rasterize(svg, size) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => { const cv = document.createElement('canvas'); cv.width = cv.height = size; const cx = cv.getContext('2d'); if (!cx) return rej(); cx.drawImage(img, 0, 0, size, size); res(cv.toDataURL('image/png')); };
      img.onerror = rej; img.src = svgDataUrl(svg);
    });
  }
  function headLink(rel, href, attrs) {
    let l = document.head.querySelector(`link[rel="${rel}"]${attrs && attrs.sizes ? `[sizes="${attrs.sizes}"]` : ''}`);
    if (!l) { l = document.createElement('link'); l.rel = rel; if (attrs && attrs.sizes) l.sizes = attrs.sizes; document.head.appendChild(l); }
    l.href = href; if (attrs && attrs.type) l.type = attrs.type; return l;
  }
  let _branded = false;
  async function installBranding() {
    if (_branded) return; _branded = true;
    const svg = I.bvicon.replace(/\s(width|height)="100%"/g, '').replace(/\saria-hidden="true"/, '');
    const url = svgDataUrl(svg);
    headLink('icon', url, { type: 'image/svg+xml' });
    try {
      const [t180, i192, i512] = await Promise.all([rasterize(svg, 180), rasterize(svg, 192), rasterize(svg, 512)]);
      headLink('apple-touch-icon', t180, { sizes: '180x180' });
      const manifest = { name: 'Bookmark Vault', short_name: 'Vault', start_url: './', scope: './', display: 'standalone', background_color: '#0c0d10', theme_color: '#0c0d10',
        icons: [{ src: url, sizes: 'any', type: 'image/svg+xml' }, { src: i192, sizes: '192x192', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
      const prev = document.querySelector('link[rel="manifest"]'); if (prev && prev.href.startsWith('blob:')) URL.revokeObjectURL(prev.href);
      headLink('manifest', URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' })));
    } catch { headLink('apple-touch-icon', url); }
  }

  // ══════════════════════════════════════════════════════════════════════
  // Init
  // ══════════════════════════════════════════════════════════════════════
  function init() {
    applyChrome();
    persist(); // commit migrated/seeded data so bookmarkvault:v2 becomes canonical
    render();
    ('requestIdleCallback' in window) ? requestIdleCallback(installBranding, { timeout: 2500 }) : setTimeout(installBranding, 300);

    // Focus the web search on load (skip touch phones to avoid a keyboard popping up).
    requestAnimationFrame(() => {
      if (state.route !== 'home' || isOverlayOpen()) return;
      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches && window.innerWidth <= 768) return;
      const s = document.querySelector('[data-search]'); if (s) s.focus({ preventScroll: true });
    });

    setTimeout(() => { state.mounted = true; }, 60);

    document.addEventListener('click', handleClick);
    document.addEventListener('submit', handleSubmit);
    document.addEventListener('input', handleInput);
    document.addEventListener('change', handleChange);
    document.addEventListener('keydown', handleKeydown);
    document.addEventListener('dragstart', onDragStart);
    document.addEventListener('dragover', onDragOver);
    document.addEventListener('drop', onDrop);
    document.addEventListener('dragend', cleanupDrag);
  }

  init();
  </script>
</body>
</html>
