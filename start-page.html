<!DOCTYPE html>
<!--
  Bookmark Vault — single-file HTML bookmark start page.
  Open by double-clicking in any modern browser. No build step.

  External resources:
    1. Google favicon API (www.google.com/s2/favicons) — per-bookmark, on-demand.
       Failures fall back to the first letter of the bookmark title.
  Everything else (CSS, JS, icons, state) is inlined.
  Fonts fall back to system Georgia / serif.

  Persisted state:
    localStorage keys
      startpage:groups
      startpage:bookmarks
      startpage:settings
      startpage:view
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookmark Vault</title>
  <style>
    /* ─── Reset ─── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Crimson Pro', Georgia, serif;
      background: #0d0d0f;
      color: #e5e2dc;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      --bg: #0d0d0f;
      --bg-card: rgba(20, 20, 24, 0.7);
      --bg-elevated: rgba(28, 28, 34, 0.8);
      --text: #e5e2dc;
      --text-muted: #8a867f;
      --text-dim: #5a5752;
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.12);
      --danger: #c75050;
      --accent: #c9a227;
      min-height: 100vh;
      position: relative;
    }

    /* Noise overlay */
    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* Gradient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      opacity: 0.15;
    }
    .orb-1 { width: 600px; height: 600px; background: var(--accent); top: -200px; right: -100px; }
    .orb-2 { width: 400px; height: 400px; background: #4a6670; bottom: -100px; left: -100px; }
    .orb-3 { width: 300px; height: 300px; background: #705070; top: 50%; left: 50%; transform: translate(-50%, -50%); }

    /* ─── Header ─── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 13, 15, 0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0.5rem 1.5rem;
      min-height: 3.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem 1rem;
      min-width: 0;
      flex: 1 1 auto;
      container-type: inline-size;
      container-name: header-brand;
    }
    .header-meta { min-width: 0; flex-shrink: 0; }
    .header-meta-date {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.05rem;
      min-width: 0;
    }
    .header-meta-day {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1.15;
    }
    .header-meta-cal {
      font-family: 'Crimson Pro', serif;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.02em;
      line-height: 1.1;
    }
    .logo {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      padding: 0;
      flex-shrink: 0;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo--icon-only { padding: 0.15rem; }
    .logo-icon { color: var(--accent); flex-shrink: 0; display: inline-flex; align-items: center; }
    .logo-icon svg { width: 24px; height: 24px; stroke-width: 2; display: block; }
    /* Inline BV icon shown next to the "Bookmark Vault" text.
       Size tracks the logo-text font-size at each responsive breakpoint. */
    .logo-bvicon-inline {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.3s ease, transform 0.3s ease;
    }
    .logo-bvicon-inline svg { width: 100%; height: 100%; display: block; }
    .logo:hover .logo-bvicon-inline { filter: brightness(1.1); transform: scale(1.04); }
    /* The icon-only-mode BV icon needs a touch more room than the Lucide line icons */
    .logo--icon-only .logo-icon svg { width: 26px; height: 26px; }
    .logo-measure {
      position: absolute;
      visibility: hidden;
      pointer-events: none;
      white-space: nowrap;
      height: 0;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .logo-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent), rgba(201, 162, 39, 0.7));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      transition: filter 0.3s ease, transform 0.3s ease;
      white-space: nowrap;
      display: block;
    }
    .logo:hover .logo-text { filter: brightness(1.2); transform: scale(1.02); }
    .logo--icon-only:hover .logo-icon { opacity: 0.85; }

    .nav {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.35rem;
      flex: 0 1 auto;
      min-width: 0;
    }
    .nav-divider {
      width: 1px;
      height: 1.25rem;
      background: var(--border);
      flex-shrink: 0;
      margin: 0 0.15rem;
    }
    .nav-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }
    .nav-action-label, .view-toggle-label { white-space: nowrap; }
    .nav-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 999px;
      padding: 0.38rem 0.72rem;
      min-height: 2.25rem;
      min-width: 2.25rem;
      white-space: nowrap;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }
    .nav-action svg { display: block; }
    .nav-action:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border);
    }
    .nav-action.active {
      border-color: color-mix(in oklch, var(--accent) 55%, transparent);
      color: color-mix(in oklch, var(--accent) 88%, white);
      background: rgba(201, 162, 39, 0.1);
    }
    .nav-action:focus-visible {
      outline: 2px solid color-mix(in oklch, var(--accent) 70%, white);
      outline-offset: 3px;
    }

    /* ─── Main ─── */
    .main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 1.5rem 2rem 3rem;
    }
    .section {
      margin-bottom: 2rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s ease forwards;
      animation-delay: calc(var(--delay, 0) * 0.1s);
    }
    .app.mounted .section { opacity: 1; transform: translateY(0); }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .section-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .page-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: 2.25rem;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    /* Favorites Row */
    .favorites-row {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(2, 44px);
      grid-auto-columns: 168px;
      gap: 0.5rem;
      margin-top: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in oklch, var(--accent) 55%, transparent) transparent;
      padding: 0.125rem 0.125rem 0.5rem;
      -webkit-overflow-scrolling: touch;
    }
    .favorite-link {
      width: 168px;
      min-width: 168px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.3s ease;
      position: relative;
      opacity: 0;
      animation: fadeUp 0.4s ease forwards;
      animation-delay: calc(var(--i) * 0.05s);
      scroll-snap-align: start;
      text-decoration: none;
    }
    .app.mounted .favorite-link { opacity: 1; }
    .favorite-link:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .favorite-link.with-title {
      padding: 0 0.625rem 0 0.5rem;
      gap: 0.5rem;
      justify-content: flex-start;
    }
    .favorite-link .favorite-label {
      font-size: 0.8rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 116px;
    }
    .favorite-icon { width: 22px; height: 22px; flex-shrink: 0; }
    .favorite-fallback {
      display: none;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--accent);
    }
    .favorite-fallback.show { display: block; }

    /* Groups Grid */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }
    .group-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      overflow: hidden;
      backdrop-filter: blur(10px);
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
      animation-delay: calc(var(--gi) * 0.08s);
    }
    .app.mounted .group-card { opacity: 1; }
    .group-card:hover {
      border-color: var(--group-accent);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3),
                  0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      transform: translateY(-2px);
    }

    @keyframes editCardBreathing {
      0%, 100% {
        border-color: color-mix(in srgb, var(--group-accent) 55%, var(--border));
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--group-accent) 22%, transparent) inset,
          0 4px 28px color-mix(in srgb, var(--group-accent) 18%, transparent),
          0 0 24px color-mix(in srgb, var(--group-accent) 12%, transparent);
      }
      50% {
        border-color: color-mix(in srgb, var(--group-accent) 85%, var(--border));
        box-shadow:
          0 0 0 2px color-mix(in srgb, var(--group-accent) 35%, transparent) inset,
          0 10px 40px color-mix(in srgb, var(--group-accent) 32%, transparent),
          0 0 40px color-mix(in srgb, var(--group-accent) 22%, transparent);
      }
    }
    .group-card.group-card-edit-selectable {
      border: 2px dashed color-mix(in srgb, var(--group-accent) 65%, var(--border));
      background:
        linear-gradient(
          160deg,
          color-mix(in srgb, var(--group-accent) 14%, rgba(20, 20, 24, 0.92)) 0%,
          color-mix(in srgb, var(--group-accent) 6%, rgba(20, 20, 24, 0.75)) 45%,
          rgba(255, 255, 255, 0.03) 100%
        );
      box-shadow:
        0 0 0 1px color-mix(in srgb, var(--group-accent) 20%, transparent) inset,
        0 6px 32px color-mix(in srgb, var(--group-accent) 22%, transparent),
        0 0 28px color-mix(in srgb, var(--group-accent) 14%, transparent);
      cursor: pointer;
      animation: editCardBreathing 2.8s ease-in-out infinite;
      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease,
        background 0.25s ease;
    }
    .group-card.group-card-edit-selectable:hover {
      animation-play-state: paused;
      border-style: dashed;
      border-color: var(--group-accent);
      transform: translateY(-4px) scale(1.02);
      box-shadow:
        0 0 0 2px color-mix(in srgb, var(--group-accent) 45%, transparent) inset,
        0 14px 48px color-mix(in srgb, var(--group-accent) 38%, transparent),
        0 0 52px color-mix(in srgb, var(--group-accent) 28%, transparent);
      background:
        linear-gradient(
          160deg,
          color-mix(in srgb, var(--group-accent) 22%, rgba(20, 20, 24, 0.95)) 0%,
          color-mix(in srgb, var(--group-accent) 10%, rgba(20, 20, 24, 0.82)) 50%,
          rgba(255, 255, 255, 0.05) 100%
        );
    }
    .group-card.group-card-edit-selectable:focus-visible {
      outline: 2px solid var(--group-accent);
      outline-offset: 3px;
    }
    .group-card.group-card-edit-selectable * { pointer-events: none; }
    @media (prefers-reduced-motion: reduce) {
      .group-card.group-card-edit-selectable { animation: none; }
      .group-card.group-card-edit-selectable:hover { transform: translateY(-2px); }
    }

    .group-card-top { padding: 0.75rem 0.875rem; flex: 1; }
    .group-card-header {
      display: flex;
      justify-content: stretch;
      align-items: stretch;
      margin-bottom: 0.5rem;
    }
    .group-card-open-all-summary {
      flex: 1;
      min-width: 0;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      padding: 0.125rem 0.35rem;
      margin: -0.125rem -0.35rem;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      color: inherit;
      transition: background 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .group-card-summary {
      flex: 1;
      min-width: 0;
      width: 100%;
      position: relative;
      padding: 0.125rem 0.35rem;
      margin: -0.125rem -0.35rem;
    }
    .group-card-summary .group-meta { padding-top: 0.15rem; }
    .group-card-open-all-summary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.05); }
    .group-card-open-all-summary:focus-visible {
      outline: 2px solid var(--group-accent);
      outline-offset: 2px;
    }
    .group-card-open-all-summary:disabled { opacity: 0.45; cursor: not-allowed; }

    .group-meta {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }
    .group-meta-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
      text-align: left;
    }
    .group-icon { font-size: 1.35rem; color: var(--group-accent); line-height: 1; }
    .group-name {
      display: block;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 0;
      color: var(--text);
      line-height: 1.3;
    }
    .group-desc {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .group-card .group-desc { display: none; }
    .group-card-content { width: 100%; }

    /* Collection Preview */
    .collection-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: flex-start;
    }
    .collection-preview.view-icon-name {
      display: block;
      columns: 2;
      column-gap: 0.5rem;
    }
    .collection-preview.view-icon-abbrev { gap: 0.25rem; }

    .preview-item {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text);
      position: relative;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .collection-preview.view-compact-icon .preview-item {
      width: 36px; height: 36px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .collection-preview.view-large-icon .preview-item {
      width: 52px; height: 52px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .collection-preview.view-icon-name .preview-item {
      width: 100%;
      height: 26px;
      justify-content: flex-start;
      gap: 0.4rem;
      padding: 0 0.375rem;
      border-radius: 5px;
      break-inside: avoid;
      margin-bottom: 0.125rem;
    }
    .collection-preview.view-icon-abbrev .preview-item {
      width: 4rem;
      min-height: 46px;
      flex-direction: column;
      gap: 0.15rem;
      padding: 0.3rem 0.2rem 0.2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: center;
    }
    .preview-item-icon { flex-shrink: 0; }
    .collection-preview.view-compact-icon .preview-item-icon { width: 20px; height: 20px; }
    .collection-preview.view-large-icon .preview-item-icon { width: 30px; height: 30px; }
    .collection-preview.view-icon-name .preview-item-icon,
    .collection-preview.view-icon-abbrev .preview-item-icon { width: 16px; height: 16px; }
    .preview-item-fallback {
      display: none;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      color: var(--group-accent);
      text-align: center;
      flex-shrink: 0;
    }
    .preview-item-fallback.show { display: block; }
    .collection-preview.view-compact-icon .preview-item-fallback {
      width: 20px; height: 20px; font-size: 0.85rem; line-height: 20px;
    }
    .collection-preview.view-large-icon .preview-item-fallback {
      width: 30px; height: 30px; font-size: 1.1rem; line-height: 30px;
    }
    .collection-preview.view-icon-name .preview-item-fallback,
    .collection-preview.view-icon-abbrev .preview-item-fallback {
      width: 16px; height: 16px; font-size: 0.7rem; line-height: 16px;
    }
    .preview-item-name {
      font-size: 0.7rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .preview-item-abbrev {
      font-size: 0.52rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--text-muted);
      line-height: 1.1;
      word-break: break-word;
    }
    .preview-item-star {
      font-size: 0.6rem;
      color: var(--group-accent);
      flex-shrink: 0;
    }
    .collection-preview.view-compact-icon .preview-item-star,
    .collection-preview.view-large-icon .preview-item-star,
    .collection-preview.view-icon-abbrev .preview-item-star {
      position: absolute;
      top: -4px;
      right: -4px;
      background: rgba(13, 13, 15, 0.9);
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      z-index: 2;
    }
    .preview-item:hover { background: rgba(255, 255, 255, 0.06); }
    .collection-preview.view-compact-icon .preview-item:hover,
    .collection-preview.view-large-icon .preview-item:hover {
      border-color: var(--group-accent);
      transform: scale(1.08);
      z-index: 1;
    }
    .collection-preview.view-icon-abbrev .preview-item:hover {
      border-color: var(--group-accent);
    }
    .preview-more {
      font-size: 0.68rem;
      color: var(--text-dim);
      padding: 0.125rem 0.375rem;
      letter-spacing: 0.02em;
    }
    .no-bookmarks {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-style: italic;
    }

    /* (Legacy list-style classes preserved verbatim from source — not used in current views.) */
    .bookmark-icon-link {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s ease;
      position: relative;
    }
    .bookmark-icon-link:hover {
      border-color: var(--group-accent);
      background: rgba(255, 255, 255, 0.06);
      transform: scale(1.1);
      z-index: 1;
    }
    .bookmark-icon-img { width: 24px; height: 24px; }
    .bookmark-icon-fallback {
      display: none;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1rem;
      color: var(--group-accent);
    }
    .bookmark-icon-fallback.show { display: block; }
    .bookmark-favorite-star {
      position: absolute;
      top: -5px; right: -5px;
      font-size: 0.7rem;
      color: var(--group-accent);
      line-height: 1;
      background: rgba(13, 13, 15, 0.9);
      border-radius: 50%;
      width: 14px; height: 14px;
      display: flex; align-items: center; justify-content: center;
      z-index: 2;
    }

    const DEFAULT_SETTINGS = {
      confirmBeforeOpenAll: true,
      openInNewTabs: true,
      maxTabsLimit: 10,
      accentColor: '#c9a227',
    };

    const ICON_OPTIONS  = ['◆','◇','❖','◈','▣','⬡','✦','❋','✧','◉','△','▽'];
    const COLOR_OPTIONS = ['#c9a227','#7ba27c','#a27b7b','#7b8fa2','#a2977b','#9b7ba2','#7ba2a2','#a28b7b'];

    // ────────────────────────────────────────────────────────────────────
    // Persistence — localStorage with namespaced keys.
    // ────────────────────────────────────────────────────────────────────
    const STORAGE = {
      groups:   'startpage:groups',
      bookmarks:'startpage:bookmarks',
      settings: 'startpage:settings',
      view:     'startpage:view',
    };

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw == null) return fallback;
        return JSON.parse(raw);
      } catch (_) {
        return fallback;
      }
    }
    function saveJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); }
      catch (_) { /* quota / disabled — silently ignore */ }
    }

    function persistAll() {
      saveJSON(STORAGE.groups,    state.groups);
      saveJSON(STORAGE.bookmarks, state.bookmarks);
      saveJSON(STORAGE.settings,  state.settings);
      saveJSON(STORAGE.view,      state.collectionBookmarkView);
    }

    // ────────────────────────────────────────────────────────────────────
    // Application state.
    // ────────────────────────────────────────────────────────────────────
    let state = {
      mounted: false,
      currentView: 'home',          // 'home' | 'group' | 'settings'
      selectedGroupId: null,
      editingBookmark: null,
      editingGroup: null,
      showGroupModal: false,
      showBookmarkModal: false,
      showDeleteConfirm: null,      // { type: 'group'|'bookmark', id: string }
      showOpenAllConfirm: null,     // groupId
      editingCollections: false,
      collectionBookmarkView: 'icon-abbrev', // 'compact-icon' | 'large-icon' | 'icon-name' | 'icon-abbrev'
      toasts: [],
      currentDay: '',
      currentDate: '',
      logoShowsIconOnly: false,
      groups:    loadJSON(STORAGE.groups,    DEFAULT_GROUPS),
      bookmarks: loadJSON(STORAGE.bookmarks, DEFAULT_BOOKMARKS),
      settings:  Object.assign({}, DEFAULT_SETTINGS, loadJSON(STORAGE.settings, {})),
      groupForm:    { name: '', description: '', icon: '◆', accentColor: '#c9a227', displayAsList: false },
      bookmarkForm: { title: '', url: '' },
    };
    state.collectionBookmarkView = loadJSON(STORAGE.view, 'icon-abbrev');

    // ────────────────────────────────────────────────────────────────────
    // Helpers.
    // ────────────────────────────────────────────────────────────────────
    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }
    function escapeAttr(str) { return escapeHtml(str); }

    function generateId() {
      return Math.random().toString(36).substring(2, 9);
    }

    function isAllowedUrl(url) {
      try { return /^https?:$/i.test(new URL(url).protocol); }
      catch (_) { return false; }
    }

    function sanitizeHref(url) {
      return isAllowedUrl(url) ? url : '#';
    }

    function getFaviconUrl(url) {
      try {
        const domain = new URL(url).hostname;
        return `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
      } catch (_) {
        return '';
      }
    }

    function getAbbreviatedBookmarkTitle(title) {
      const cleaned = String(title || '').trim().replace(/\s+/g, ' ');
      if (!cleaned) return '';
      const words = cleaned.split(/[\s\-_/]+/).filter(Boolean);
      if (words.length >= 2) {
        return words
          .slice(0, 4)
          .map(w => w.charAt(0).toUpperCase())
          .join('')
          .slice(0, 8);
      }
      const w = words[0] || cleaned;
      if (w.length <= 10) return w;
      return `${w.slice(0, 9)}…`;
    }

    function favoriteBookmarks() {
      return state.bookmarks.filter(b => b.isFavorite);
    }
    function groupById(id) {
      return state.groups.find(g => g.id === id);
    }
    function bookmarksInGroup(id) {
      return state.bookmarks.filter(b => b.groupId === id);
    }

    function showToast(message, type = 'success') {
      const id = generateId();
      state.toasts = [...state.toasts, { id, message, type }];
      renderToasts();
      setTimeout(() => {
        state.toasts = state.toasts.filter(t => t.id !== id);
        renderToasts();
      }, 3000);
    }

    // ────────────────────────────────────────────────────────────────────
    // Date display.
    // ────────────────────────────────────────────────────────────────────
    function updateDateTime() {
      const now = new Date();
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      state.currentDay  = days[now.getDay()];
      state.currentDate = `${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
      const dayEl = document.querySelector('.header-meta-day');
      const calEl = document.querySelector('.header-meta-cal');
      if (dayEl)  dayEl.textContent  = state.currentDay;
      if (calEl)  calEl.textContent  = state.currentDate;
    }

    // ────────────────────────────────────────────────────────────────────
    // Render — full rebuild on state change. Inputs in inline editor use a
    // light path (updateGroupFieldFromInput) that does NOT re-render the
    // detail view, so focus is preserved while typing.
    // ────────────────────────────────────────────────────────────────────
    function render() {
      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div class="app${state.mounted ? ' mounted' : ''}" style="--accent: ${escapeAttr(state.settings.accentColor)}">
          <div class="noise"></div>
          <div class="orb orb-1"></div>
          <div class="orb orb-2"></div>
          <div class="orb orb-3"></div>
          ${renderHeader()}
          <main class="main">
            ${state.currentView === 'home'     ? renderHome()
            : state.currentView === 'group'    ? renderGroupDetail()
            : state.currentView === 'settings' ? renderSettings()
            : ''}
          </main>
          ${renderModals()}
          <div class="toast-container">${renderToastList()}</div>
        </div>
      `;
      // Run logo measurement after DOM is in place.
      requestAnimationFrame(syncLogoDisplay);
    }

    function renderHeader() {
      const logoTitle = state.editingCollections ? 'Select to Edit' : 'Bookmark Vault';
      // Icon-only mode: pencil while editing, otherwise the BV emblem.
      // Text mode: BV emblem inline + title text.
      const iconOnlyHtml = state.editingCollections ? ICONS.pencilLogo : ICONS.bvicon;
      const logoInner = state.logoShowsIconOnly
        ? `<span class="logo-icon">${iconOnlyHtml}</span>`
        : `<span class="logo-bvicon-inline">${ICONS.bvicon}</span><span class="logo-text">${escapeHtml(logoTitle)}</span>`;

      const viewToggle = state.currentView === 'home' ? `
        <div class="collection-view-toggle collection-view-toggle--nav" aria-label="Collection bookmark view">
          ${viewToggleButton('icon-abbrev', ICONS.caseLower, 'Short', 'Icon with abbreviated name below')}
          ${viewToggleButton('compact-icon', ICONS.grid2x2,  'Icon',  'Compact icon only')}
          ${viewToggleButton('icon-name',    ICONS.list,      'Name',  'Icon with name to the right')}
          ${viewToggleButton('large-icon',   ICONS.square,    'Large', 'Large icon only')}
        </div>` : '';

      return `
        <header class="header">
          <div class="header-inner">
            <div class="header-brand">
              <div class="header-meta">
                <span class="header-meta-date">
                  <span class="header-meta-day">${escapeHtml(state.currentDay)}</span>
                  <span class="header-meta-cal">${escapeHtml(state.currentDate)}</span>
                </span>
              </div>
              <button
                class="logo${state.logoShowsIconOnly ? ' logo--icon-only' : ''}"
                type="button"
                data-action="go-home"
                aria-label="${escapeAttr(logoTitle)}"
              >
                ${logoInner}
                <span class="logo-measure" aria-hidden="true">${escapeHtml(logoTitle)}</span>
              </button>
            </div>
            <nav class="nav" aria-label="Main navigation">
              ${viewToggle}
              <span class="nav-divider" aria-hidden="true"></span>
              <div class="nav-actions">
                <button type="button" class="nav-action" data-action="open-group-modal" aria-label="Add collection">
                  ${ICONS.plus}<span class="nav-action-label">Add</span>
                </button>
                <button
                  type="button"
                  class="nav-action${state.editingCollections ? ' active' : ''}"
                  data-action="toggle-edit-collections"
                  aria-pressed="${state.editingCollections}"
                  aria-label="Edit collections"
                >
                  ${ICONS.pencil}<span class="nav-action-label">Edit</span>
                </button>
                <button
                  type="button"
                  class="nav-action${state.currentView === 'settings' ? ' active' : ''}"
                  data-action="open-settings"
                  aria-label="Settings"
                >
                  ${ICONS.settings}<span class="nav-action-label">Settings</span>
                </button>
              </div>
            </nav>
          </div>
        </header>
      `;
    }

    function viewToggleButton(view, iconHtml, label, title) {
      const active = state.collectionBookmarkView === view ? ' active' : '';
      return `
        <button
          type="button"
          class="${active.trim()}"
          data-action="set-view"
          data-view="${view}"
          aria-pressed="${state.collectionBookmarkView === view}"
          aria-label="${escapeAttr(title)}"
          title="${escapeAttr(title)}"
        >
          ${iconHtml}<span class="view-toggle-label">${escapeHtml(label)}</span>
        </button>
      `;
    }

    // ── Home view ───────────────────────────────────────────────────────
    function renderHome() {
      const favs = favoriteBookmarks();
      const favSection = favs.length === 0 ? '' : `
        <section class="section" style="--delay: 0">
          <div class="favorites-row">
            ${favs.map((b, i) => `
              <a href="${escapeAttr(sanitizeHref(b.url))}" target="_blank" rel="noopener"
                 class="favorite-link with-title"
                 style="--i: ${i}"
                 title="${escapeAttr(b.title)}">
                <img src="${escapeAttr(getFaviconUrl(b.url))}" alt="${escapeAttr(b.title)}"
                     class="favorite-icon"
                     onerror="this.style.display='none';this.nextElementSibling&&this.nextElementSibling.classList.add('show');" />
                <span class="favorite-fallback">${escapeHtml(b.title.charAt(0))}</span>
                <span class="favorite-label">${escapeHtml(b.title)}</span>
              </a>
            `).join('')}
          </div>
        </section>`;

      const grid = `
        <section class="section" style="--delay: 1">
          <div class="groups-grid">
            ${state.groups.map((g, gi) => renderGroupCard(g, gi)).join('')}
          </div>
        </section>`;

      return favSection + grid;
    }

    function renderGroupCard(group, gi) {
      const groupBms = bookmarksInGroup(group.id);
      const editable = state.editingCollections;
      const summary = editable
        ? `<div class="group-card-summary">${renderGroupMeta(group)}</div>`
        : `<button type="button" class="group-card-open-all-summary"
              ${groupBms.length === 0 ? 'disabled' : ''}
              data-action="open-all"
              data-group-id="${escapeAttr(group.id)}"
              aria-label="${escapeAttr(groupBms.length === 0
                ? `${group.name}: no bookmarks to open`
                : `Open all ${groupBms.length} bookmark${groupBms.length !== 1 ? 's' : ''} in ${group.name}`)}">
              ${renderGroupMeta(group)}
            </button>`;

      const preview = groupBms.length === 0
        ? `<span class="no-bookmarks">No bookmarks yet</span>`
        : groupBms.map(bm => renderPreviewItem(bm)).join('');

      return `
        <article
          class="group-card${editable ? ' group-card-edit-selectable' : ''}"
          style="--group-accent: ${escapeAttr(group.accentColor)}; --gi: ${gi}"
          ${editable ? `role="button" tabindex="0" aria-label="Edit collection: ${escapeAttr(group.name)}" data-action="edit-collection" data-group-id="${escapeAttr(group.id)}"` : ''}
        >
          <div class="group-card-top">
            <div class="group-card-header">${summary}</div>
            <div class="group-card-content">
              <div class="collection-preview view-${escapeAttr(state.collectionBookmarkView)}">
                ${preview}
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderGroupMeta(group) {
      return `
        <span class="group-meta">
          <span class="group-icon" aria-hidden="true">${escapeHtml(group.icon)}</span>
          <span class="group-meta-text">
            <span class="group-name">${escapeHtml(group.name)}</span>
            <span class="group-desc">${escapeHtml(group.description)}</span>
          </span>
        </span>`;
    }

    function renderPreviewItem(bm) {
      const star = bm.isFavorite ? `<span class="preview-item-star">★</span>` : '';
      const extra = state.collectionBookmarkView === 'icon-name'
        ? `<span class="preview-item-name">${escapeHtml(bm.title)}</span>`
        : state.collectionBookmarkView === 'icon-abbrev'
          ? `<span class="preview-item-abbrev">${escapeHtml(getAbbreviatedBookmarkTitle(bm.title))}</span>`
          : '';
      return `
        <a href="${escapeAttr(sanitizeHref(bm.url))}" target="_blank" rel="noopener"
           class="preview-item${bm.isFavorite ? ' favorite' : ''}"
           title="${escapeAttr(bm.title)}"
           data-stop="1">
          <img src="${escapeAttr(getFaviconUrl(bm.url))}" alt=""
               class="preview-item-icon"
               onerror="this.style.display='none';this.nextElementSibling&&this.nextElementSibling.classList.add('show');" />
          <span class="preview-item-fallback">${escapeHtml(bm.title.charAt(0))}</span>
          ${extra}
          ${star}
        </a>`;
    }

    // ── Group detail view ───────────────────────────────────────────────
    function renderGroupDetail() {
      const group = groupById(state.selectedGroupId);
      if (!group) return '';
      const groupBms = bookmarksInGroup(group.id);

      const bookmarkList = groupBms.length === 0

             ${groupBms.map((b, i) => `
               <li class="bookmark-item" style="--i: ${i}">
                 <img src="${escapeAttr(getFaviconUrl(b.url))}" alt=""
                      class="bookmark-favicon"
                      onerror="this.style.display='none'" />

                   </button>
                   <button class="action-btn" data-action="edit-bookmark" data-bookmark-id="${escapeAttr(b.id)}" title="Edit">✎</button>
                   <button class="action-btn danger" data-action="delete-bookmark" data-bookmark-id="${escapeAttr(b.id)}" title="Delete">✕</button>
                 </div>
               </li>
             `).join('')}
           </ul>`;

      return `
        <section class="section" style="--delay: 0">
          <button class="back-btn" data-action="go-home"><span>←</span> Back to Collections</button>

          <div class="group-detail-header" style="--group-accent: ${escapeAttr(group.accentColor)}">
            <div class="group-detail-top">
              <div class="group-detail-info">
                <span class="group-detail-icon">${escapeHtml(group.icon)}</span>
                <div>
                  <h1 class="group-detail-title">${escapeHtml(group.name)}</h1>
                  <p class="group-detail-desc">${escapeHtml(group.description)}</p>
                </div>
              </div>
              <button class="btn btn-accent" data-action="open-all" data-group-id="${escapeAttr(group.id)}">
                Open All (${groupBms.length})
              </button>
            </div>

            <div class="group-edit-panel">
              <div class="group-edit-row">
                <label class="group-edit-field">
                  <span class="group-edit-label">Name</span>
                  <input type="text" class="input input-sm"
                         value="${escapeAttr(group.name)}"
                         data-inline-field="name"
                         data-group-id="${escapeAttr(group.id)}"
                         placeholder="Collection name" />
                </label>
                <label class="group-edit-field">
                  <span class="group-edit-label">Description</span>
                  <input type="text" class="input input-sm"
                         value="${escapeAttr(group.description)}"
                         data-inline-field="description"
                         data-group-id="${escapeAttr(group.id)}"
                         placeholder="Brief description" />
                </label>
              </div>

              <div class="group-edit-row">
                <div class="group-edit-field">
                  <span class="group-edit-label">Icon</span>
                  <div class="icon-picker icon-picker-sm">
                    ${ICON_OPTIONS.map(icon => `
                      <button type="button"
                              class="icon-option icon-option-sm${group.icon === icon ? ' active' : ''}"
                              data-action="set-group-icon"
                              data-group-id="${escapeAttr(group.id)}"
                              data-icon="${escapeAttr(icon)}">${escapeHtml(icon)}</button>
                    `).join('')}
                  </div>
                </div>
                <div class="group-edit-field">
                  <span class="group-edit-label">Color</span>
                  <div class="color-picker">
                    ${COLOR_OPTIONS.map(color => `
                      <button type="button"
                              class="color-swatch color-swatch-sm${group.accentColor === color ? ' active' : ''}"
                              style="background: ${escapeAttr(color)}"
                              data-action="set-group-color"
                              data-group-id="${escapeAttr(group.id)}"
                              data-color="${escapeAttr(color)}"
                              aria-label="Select color ${escapeAttr(color)}"></button>
                    `).join('')}
                  </div>
                </div>
              </div>

              <div class="group-edit-row group-edit-row-footer">
                <label class="group-edit-toggle">
                  <div class="group-edit-toggle-info">
                    <span class="group-edit-label">Display as List</span>
                  </div>
                  <input type="checkbox" class="toggle"
                         ${group.displayAsList ? 'checked' : ''}
                         data-action="set-group-display-as-list"
                         data-group-id="${escapeAttr(group.id)}" />
                </label>
                <button class="btn btn-danger-outline btn-sm" data-action="confirm-delete-group" data-group-id="${escapeAttr(group.id)}">
                  Delete Collection
                </button>
              </div>
            </div>
          </div>

          <div class="bookmark-list-header">
            <span class="bookmark-count">${groupBms.length} bookmarks</span>
            <div class="bookmark-header-controls">
              <button class="btn btn-accent btn-sm" data-action="open-bookmark-modal">+ Add Bookmark</button>
            </div>
          </div>

          ${bookmarkList}
        </section>
      `;
    }

    // ── Settings view ───────────────────────────────────────────────────
    function renderSettings() {
      return `
        <section class="section" style="--delay: 0">
          <h1 class="page-title">Settings</h1>

          <div class="settings-card">
            <h2 class="settings-section-title">Behavior</h2>

            <label class="setting-row">
              <div class="setting-info">
                <span class="setting-label">Confirm before opening all</span>
                <span class="setting-hint">Show a confirmation dialog when opening multiple bookmarks</span>
              </div>
              <input type="checkbox" class="toggle"
                     ${state.settings.confirmBeforeOpenAll ? 'checked' : ''}
                     data-action="set-setting"
                     data-setting="confirmBeforeOpenAll" />
            </label>

            <label class="setting-row">
              <div class="setting-info">
                <span class="setting-label">Open in new tabs</span>
                <span class="setting-hint">Open bookmarks in new browser tabs</span>
              </div>
              <input type="checkbox" class="toggle"
                     ${state.settings.openInNewTabs ? 'checked' : ''}
                     data-action="set-setting"
                     data-setting="openInNewTabs" />
            </label>

            <label class="setting-row">
              <div class="setting-info">
                <span class="setting-label">Maximum tabs limit</span>
                <span class="setting-hint">Prevent opening too many tabs at once</span>
              </div>
              <input type="number" class="input input-compact"
                     min="1" max="50"
                     value="${escapeAttr(String(state.settings.maxTabsLimit))}"
                     data-action="set-setting"
                     data-setting="maxTabsLimit" />
            </label>
          </div>

          <div class="settings-card" style="--delay: 1">
            <h2 class="settings-section-title">Appearance</h2>

            <div class="setting-row">
              <div class="setting-info">
                <span class="setting-label">Accent Color</span>
                <span class="setting-hint">Choose a color for highlights and buttons</span>
              </div>
              <div class="color-picker">
                ${COLOR_OPTIONS.map(color => `
                  <button class="color-swatch${state.settings.accentColor === color ? ' active' : ''}"
                          style="background: ${escapeAttr(color)}"
                          data-action="set-setting-accent"
                          data-color="${escapeAttr(color)}"
                          aria-label="Select color ${escapeAttr(color)}"></button>
                `).join('')}
              </div>
            </div>
          </div>
        </section>
      `;
    }

    // ── Modals ──────────────────────────────────────────────────────────
    function renderModals() {
      let out = '';
      if (state.showGroupModal)    out += renderGroupModal();
      if (state.showBookmarkModal) out += renderBookmarkModal();
      if (state.showDeleteConfirm) out += renderDeleteConfirmModal();
      if (state.showOpenAllConfirm)out += renderOpenAllConfirmModal();
      return out;
    }

    function renderGroupModal() {
      const f = state.groupForm;
      const isEdit = !!state.editingGroup;
      return `
        <div class="modal-overlay" role="dialog" aria-modal="true" tabindex="-1" data-action="close-modal" data-modal="group">
          <div class="modal" role="presentation" data-stop="1">
            <h2 class="modal-title">${isEdit ? 'Edit Collection' : 'New Collection'}</h2>
            <form data-action="save-group">
              <label class="field">
                <span class="field-label">Name</span>
                <input type="text" class="input" value="${escapeAttr(f.name)}"
                       data-form-field="name" data-form="group" placeholder="Collection name" />
              </label>
              <label class="field">
                <span class="field-label">Description</span>
                <input type="text" class="input" value="${escapeAttr(f.description)}"
                       data-form-field="description" data-form="group" placeholder="Brief description" />
              </label>
              <div class="field">
                <span class="field-label">Icon</span>
                <div class="icon-picker">
                  ${ICON_OPTIONS.map(icon => `
                    <button type="button"
                            class="icon-option${f.icon === icon ? ' active' : ''}"
                            data-action="set-form-group-icon" data-icon="${escapeAttr(icon)}">${escapeHtml(icon)}</button>
                  `).join('')}
                </div>
              </div>
              <div class="field">
                <span class="field-label">Color</span>
                <div class="color-picker">
                  ${COLOR_OPTIONS.map(color => `
                    <button type="button"
                            class="color-swatch${f.accentColor === color ? ' active' : ''}"
                            style="background: ${escapeAttr(color)}"
                            data-action="set-form-group-color" data-color="${escapeAttr(color)}"
                            aria-label="Select color ${escapeAttr(color)}"></button>
                  `).join('')}
                </div>
              </div>
              <label class="field field-toggle">
                <div class="field-toggle-info">
                  <span class="field-label">Display as List</span>
                  <span class="field-hint">Show bookmark names next to icons</span>
                </div>
                <input type="checkbox" class="toggle"
                       ${f.displayAsList ? 'checked' : ''}
                       data-form-field="displayAsList" data-form="group" />
              </label>
              <div class="modal-actions">
                <button type="button" class="btn btn-ghost" data-action="close-modal" data-modal="group">Cancel</button>
                <button type="submit" class="btn btn-accent">${isEdit ? 'Save Changes' : 'Create Collection'}</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderBookmarkModal() {
      const f = state.bookmarkForm;
      const isEdit = !!state.editingBookmark;
      return `
        <div class="modal-overlay" role="dialog" aria-modal="true" tabindex="-1" data-action="close-modal" data-modal="bookmark">
          <div class="modal" role="presentation" data-stop="1">
            <h2 class="modal-title">${isEdit ? 'Edit Bookmark' : 'Add Bookmark'}</h2>
            <form data-action="save-bookmark">
              <label class="field">
                <span class="field-label">Title</span>
                <input type="text" class="input" value="${escapeAttr(f.title)}"
                       data-form-field="title" data-form="bookmark" placeholder="Bookmark title" />
              </label>
              <label class="field">
                <span class="field-label">URL</span>
                <input type="url" class="input" value="${escapeAttr(f.url)}"
                       data-form-field="url" data-form="bookmark" placeholder="https://example.com" />
              </label>
              <div class="modal-actions">
                <button type="button" class="btn btn-ghost" data-action="close-modal" data-modal="bookmark">Cancel</button>
                <button type="submit" class="btn btn-accent">${isEdit ? 'Save Changes' : 'Add Bookmark'}</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderDeleteConfirmModal() {
      const d = state.showDeleteConfirm;
      return `
        <div class="modal-overlay" role="dialog" aria-modal="true" tabindex="-1" data-action="close-modal" data-modal="delete">
          <div class="modal modal-sm" role="presentation" data-stop="1">
            <span class="confirm-icon">⚠</span>
            <h2 class="modal-title">Delete ${d.type === 'group' ? 'Collection' : 'Bookmark'}?</h2>
            <p class="confirm-text">
              ${d.type === 'group'
                ? 'All bookmarks in this collection will also be deleted.'
                : 'This bookmark will be permanently removed.'}
            </p>
            <div class="modal-actions">
              <button class="btn btn-ghost" data-action="close-modal" data-modal="delete">Cancel</button>
              <button class="btn btn-danger" data-action="do-delete">Delete</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderOpenAllConfirmModal() {
      const groupId = state.showOpenAllConfirm;
      const group = groupById(groupId);
      const count = bookmarksInGroup(groupId).length;
      const willOpen = Math.min(count, state.settings.maxTabsLimit);
      return `
        <div class="modal-overlay" role="dialog" aria-modal="true" tabindex="-1" data-action="close-modal" data-modal="open-all">
          <div class="modal modal-sm" role="presentation" data-stop="1">
            <span class="confirm-icon" style="color: var(--accent)">❖</span>
            <h2 class="modal-title">Open all bookmarks?</h2>
            <p class="confirm-text">
              Opening ${willOpen} bookmark${count !== 1 ? 's' : ''} from "${escapeHtml(group ? group.name : '')}"
            </p>
            <div class="modal-actions">
              <button class="btn btn-ghost" data-action="close-modal" data-modal="open-all">Cancel</button>
              <button class="btn btn-accent" data-action="do-open-all">Open All</button>
            </div>
          </div>
        </div>
      `;
    }

    // ── Toasts ──────────────────────────────────────────────────────────
    function renderToastList() {
      return state.toasts.map(t => `<div class="toast toast-${escapeAttr(t.type)}">${escapeHtml(t.message)}</div>`).join('');
    }
    function renderToasts() {
      const c = document.querySelector('.toast-container');
      if (c) c.innerHTML = renderToastList();
    }

    // ────────────────────────────────────────────────────────────────────
    // Logo width measurement — collapses logo to icon when text wouldn't fit.
    // ────────────────────────────────────────────────────────────────────
    // Width budget for the inline BV emblem + its gap to the title text.
    // Kept in sync with .logo-bvicon-inline (default 36px, shrinks at breakpoints)
    // and .logo gap (0.5rem = 8px). Using the largest default size is a safe
    // over-reservation — collapse fires marginally earlier on small screens
    // but never later than it should.
    const LOGO_INLINE_ICON_WIDTH = 36 + 8;

    function syncLogoDisplay() {
      const brand = document.querySelector('.header-brand');
      const measure = document.querySelector('.logo-measure');
      if (!brand || !measure) return;
      const brandWidth = brand.clientWidth;
      const meta = brand.querySelector('.header-meta');
      const metaWidth = meta ? meta.offsetWidth : 0;
      const cs = getComputedStyle(brand);
      const gap = parseFloat(cs.columnGap || cs.gap) || 16;
      // Reserve space for the inline emblem too — without this the title would
      // overflow before triggering the collapse-to-icon-only fallback.
      const available = brandWidth - metaWidth - gap - LOGO_INLINE_ICON_WIDTH;
      const shouldBeIconOnly = measure.offsetWidth > Math.max(available - 4, 0);
      if (shouldBeIconOnly !== state.logoShowsIconOnly) {
        state.logoShowsIconOnly = shouldBeIconOnly;
        // Re-render only the logo button to avoid wiping the whole header.
        const logoBtn = document.querySelector('.logo');
        const logoTitle = state.editingCollections ? 'Select to Edit' : 'Bookmark Vault';
        const iconOnlyHtml = state.editingCollections ? ICONS.pencilLogo : ICONS.bvicon;
        if (logoBtn) {
          logoBtn.classList.toggle('logo--icon-only', shouldBeIconOnly);
          logoBtn.innerHTML = shouldBeIconOnly
            ? `<span class="logo-icon">${iconOnlyHtml}</span><span class="logo-measure" aria-hidden="true">${escapeHtml(logoTitle)}</span>`
            : `<span class="logo-bvicon-inline">${ICONS.bvicon}</span><span class="logo-text">${escapeHtml(logoTitle)}</span><span class="logo-measure" aria-hidden="true">${escapeHtml(logoTitle)}</span>`;
          logoBtn.setAttribute('aria-label', logoTitle);
        }
      }
    }

    // ────────────────────────────────────────────────────────────────────
    // Action handlers.
    // ────────────────────────────────────────────────────────────────────
    function goHome() {
      state.currentView = 'home';
      state.selectedGroupId = null;
      state.editingGroup = null;
      render();
    }
    function openGroup(id) {
      state.editingCollections = false;
      state.selectedGroupId = id;
      state.currentView = 'group';
      render();
    }
    function openSettings() {
      state.editingCollections = false;
      if (state.currentView === 'settings') { goHome(); return; }
      state.currentView = 'settings';
      state.selectedGroupId = null;
      render();
    }
    function toggleEditCollections() {
      if (state.editingCollections) {
        state.editingCollections = false;
      } else {
        if (state.currentView !== 'home') {
          state.currentView = 'home';
          state.selectedGroupId = null;
        }
        state.editingCollections = true;
      }
      render();
    }
    function setView(view) {
      state.collectionBookmarkView = view;
      persistAll();
      render();
    }

    // Group modal
    function openGroupModal(groupId) {
      if (groupId) {
        const g = groupById(groupId);
        if (g) {
          state.groupForm = { name: g.name, description: g.description, icon: g.icon, accentColor: g.accentColor, displayAsList: g.displayAsList };
          state.editingGroup = groupId;
        }
      } else {
        state.groupForm = { name: '', description: '', icon: '◆', accentColor: '#c9a227', displayAsList: false };
        state.editingGroup = null;
      }
      state.showGroupModal = true;
      render();
    }
    function saveGroup() {
      const f = state.groupForm;
      if (!f.name.trim()) { showToast('Group name is required', 'error'); return; }
      if (state.editingGroup) {
        state.groups = state.groups.map(g => g.id === state.editingGroup ? Object.assign({}, g, f) : g);
        showToast('Collection updated');
      } else {
        state.groups = [...state.groups, Object.assign({}, f, { id: generateId() })];
        showToast('Collection created');
      }
      state.showGroupModal = false;
      persistAll();
      render();
    }

    // Bookmark modal
    function openBookmarkModal(bookmarkId) {
      if (bookmarkId) {
        const b = state.bookmarks.find(x => x.id === bookmarkId);
        if (b) {
          state.bookmarkForm = { title: b.title, url: b.url };
          state.editingBookmark = bookmarkId;
        }
      } else {
        state.bookmarkForm = { title: '', url: '' };
        state.editingBookmark = null;
      }
      state.showBookmarkModal = true;
      render();
    }
    function saveBookmark() {
      const f = state.bookmarkForm;
      if (!f.title.trim() || !f.url.trim()) { showToast('Title and URL are required', 'error'); return; }
      if (!isAllowedUrl(f.url)) { showToast('URL must start with http:// or https://', 'error'); return; }
      if (state.editingBookmark) {
        state.bookmarks = state.bookmarks.map(b => b.id === state.editingBookmark ? Object.assign({}, b, f) : b);
        showToast('Bookmark updated');
      } else if (state.selectedGroupId) {
        state.bookmarks = [...state.bookmarks, Object.assign({}, f, { id: generateId(), isFavorite: false, groupId: state.selectedGroupId })];
        showToast('Bookmark added');
      }
      state.showBookmarkModal = false;
      persistAll();
      render();
    }

    // Delete confirm
    function confirmDeleteGroup(id)    { state.showDeleteConfirm = { type: 'group', id };    render(); }
    function confirmDeleteBookmark(id) { state.showDeleteConfirm = { type: 'bookmark', id }; render(); }
    function doDelete() {
      const d = state.showDeleteConfirm;
      if (!d) return;
      if (d.type === 'group') {
        state.groups = state.groups.filter(g => g.id !== d.id);
        state.bookmarks = state.bookmarks.filter(b => b.groupId !== d.id);
        state.showDeleteConfirm = null;
        if (state.selectedGroupId === d.id) {
          state.currentView = 'home';
          state.selectedGroupId = null;
        }
        showToast('Collection deleted');
      } else {
        state.bookmarks = state.bookmarks.filter(b => b.id !== d.id);
        state.showDeleteConfirm = null;
        showToast('Bookmark deleted');
      }
      persistAll();
      render();
    }

    // Favorite toggle
    function toggleFavorite(id) {
      state.bookmarks = state.bookmarks.map(b => b.id === id ? Object.assign({}, b, { isFavorite: !b.isFavorite }) : b);
      const b = state.bookmarks.find(x => x.id === id);
      showToast(b && b.isFavorite ? 'Added to favorites' : 'Removed from favorites', 'info');
      persistAll();
      render();
    }

    // Open all
    function handleOpenAll(groupId) {
      if (state.settings.confirmBeforeOpenAll) {
        state.showOpenAllConfirm = groupId;
        render();
      } else {
        openAllBookmarks(groupId);
      }
    }
    function openAllBookmarks(groupId) {
      const groupBms = bookmarksInGroup(groupId);
      const toOpen = groupBms.slice(0, state.settings.maxTabsLimit);
      toOpen.forEach(b => {
        if (!isAllowedUrl(b.url)) return;
        if (state.settings.openInNewTabs) window.open(b.url, '_blank');
        else window.location.href = b.url;
      });
      state.showOpenAllConfirm = null;
      showToast(`Opened ${toOpen.length} bookmark${toOpen.length !== 1 ? 's' : ''}`);
      render();
    }
    // Settings
    function updateSetting(key, value) {
      state.settings = Object.assign({}, state.settings, { [key]: value });
      showToast('Settings saved', 'info');
      persistAll();
      render();
    }

    // Group inline editor
    function updateGroupFieldFromInput(groupId, field, value) {
      state.groups = state.groups.map(g => g.id === groupId ? Object.assign({}, g, { [field]: value }) : g);
      persistAll();
      // Light-touch DOM updates so the focused input isn't blown away.
      if (field === 'name') {
        const t = document.querySelector('.group-detail-title');
        if (t) t.textContent = value;
      } else if (field === 'description') {
        const d = document.querySelector('.group-detail-desc');
        if (d) d.textContent = value;
      }
    }
    function updateGroupField(groupId, field, value) {
      state.groups = state.groups.map(g => g.id === groupId ? Object.assign({}, g, { [field]: value }) : g);
      persistAll();
      render();
    }

    // ────────────────────────────────────────────────────────────────────
    // Event delegation.
    // ────────────────────────────────────────────────────────────────────
    function handleClick(e) {
      const target = e.target.closest('[data-action], [data-stop]');
      if (!target) return;

      // Prevent group-card click from triggering when clicking a bookmark inside.
      if (target.matches('[data-stop="1"]')) { e.stopPropagation(); return; }

      const action = target.dataset.action;
      if (!action) return;

      switch (action) {
        case 'go-home': goHome(); break;
        case 'open-settings': openSettings(); break;
        case 'toggle-edit-collections': toggleEditCollections(); break;
        case 'set-view': setView(target.dataset.view); break;
        case 'open-group-modal': openGroupModal(); break;
        case 'edit-collection': openGroup(target.dataset.groupId); break;
        case 'open-all':
          e.stopPropagation();
          handleOpenAll(target.dataset.groupId);
          break;
        case 'open-bookmark-modal': openBookmarkModal(); break;
        case 'edit-bookmark': openBookmarkModal(target.dataset.bookmarkId); break;
        case 'delete-bookmark': confirmDeleteBookmark(target.dataset.bookmarkId); break;
        case 'confirm-delete-group': confirmDeleteGroup(target.dataset.groupId); break;
        case 'toggle-favorite': toggleFavorite(target.dataset.bookmarkId); break;
        case 'set-group-icon':  updateGroupField(target.dataset.groupId, 'icon',        target.dataset.icon); break;
        case 'set-group-color': updateGroupField(target.dataset.groupId, 'accentColor', target.dataset.color); break;
        case 'set-form-group-icon':  state.groupForm.icon = target.dataset.icon;        render(); break;
        case 'set-form-group-color': state.groupForm.accentColor = target.dataset.color; render(); break;
        case 'close-modal':
          if (target.dataset.modal === 'group')    state.showGroupModal = false;
          if (target.dataset.modal === 'bookmark') state.showBookmarkModal = false;
          if (target.dataset.modal === 'delete')   state.showDeleteConfirm = null;
          if (target.dataset.modal === 'open-all') state.showOpenAllConfirm = null;
          render();
          break;
        case 'do-delete': doDelete(); break;
        case 'do-open-all': openAllBookmarks(state.showOpenAllConfirm); break;
        case 'set-setting-accent': updateSetting('accentColor', target.dataset.color); break;
      }
    }

    function handleChange(e) {
      const t = e.target;
      const action = t.dataset.action;
      if (action === 'set-setting') {
        const key = t.dataset.setting;
        if (t.type === 'checkbox') updateSetting(key, t.checked);
        else if (t.type === 'number') updateSetting(key, parseInt(t.value, 10) || 10);
      } else if (action === 'set-group-display-as-list') {
        updateGroupField(t.dataset.groupId, 'displayAsList', t.checked);
      }
    }

    function handleInput(e) {
      const t = e.target;
      const inlineField = t.dataset.inlineField;
      if (inlineField) {
        updateGroupFieldFromInput(t.dataset.groupId, inlineField, t.value);
        return;
      }
      const formField = t.dataset.formField;
      if (formField) {
        const form = t.dataset.form;
        if (form === 'group') {
          if (t.type === 'checkbox') state.groupForm[formField] = t.checked;
          else state.groupForm[formField] = t.value;
        } else if (form === 'bookmark') {
          state.bookmarkForm[formField] = t.value;
        }
      }
    }

    function handleSubmit(e) {
      const t = e.target;
      const action = t.dataset.action;
      if (action === 'save-group') {
        e.preventDefault();
        saveGroup();
      } else if (action === 'save-bookmark') {
        e.preventDefault();
        saveBookmark();
      }
    }

    function handleKeydown(e) {
      if (e.key !== 'Escape') return;
      if (state.showGroupModal)     { state.showGroupModal = false; render(); }
      else if (state.showBookmarkModal) { state.showBookmarkModal = false; render(); }
      else if (state.showDeleteConfirm) { state.showDeleteConfirm = null; render(); }
      else if (state.showOpenAllConfirm){ state.showOpenAllConfirm = null; render(); }
    }

    // Edit-mode keyboard activation for the group card.
    function handleEditCardKeydown(e) {
      if (!state.editingCollections) return;
      const card = e.target.closest('[data-action="edit-collection"]');
      if (!card) return;
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openGroup(card.dataset.groupId);
      }
    }

    // ────────────────────────────────────────────────────────────────────
    // Init.
    // ────────────────────────────────────────────────────────────────────
    function init() {
      updateDateTime();
      render();
      // mount animation
      setTimeout(() => {
        state.mounted = true;
        document.querySelector('.app')?.classList.add('mounted');
      }, 50);

      setInterval(updateDateTime, 3_600_000);

      // Recompute logo width when window resizes.
      window.addEventListener('resize', () => requestAnimationFrame(syncLogoDisplay));

      // Global event delegation.
      document.addEventListener('click', handleClick);
      document.addEventListener('change', handleChange);
      document.addEventListener('input', handleInput);
      document.addEventListener('submit', handleSubmit);
      document.addEventListener('keydown', handleKeydown);
      document.addEventListener('keydown', handleEditCardKeydown);
    }

    init();
  </script>
</body>
</html>
