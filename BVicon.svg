<!--
  Bookmark Vault emblem — design source. Also linked from index.html for SVG-capable
  favicons. index.html ships a single-line copy with bv_-prefixed defs ids
  (ICONS.bvicon). Update both when changing the artwork.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a301a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="metalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="50%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <!-- Gold Gradients for Premium Metallic Look -->
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7a35"/>
      <stop offset="25%" stop-color="#eac775"/>
      <stop offset="50%" stop-color="#be9648"/>
      <stop offset="75%" stop-color="#fdf1a9"/>
      <stop offset="100%" stop-color="#a1813bc0"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a451b"/>
      <stop offset="50%" stop-color="#a8853b"/>
      <stop offset="100%" stop-color="#4e3b16"/>
    </linearGradient>
    
    <radialGradient id="goldRad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fae19c"/>
      <stop offset="40%" stop-color="#c99e49"/>
      <stop offset="85%" stop-color="#8a6627"/>
      <stop offset="100%" stop-color="#574117"/>
    </radialGradient>

    <!-- Dark Metal Gradients for Vault Door -->
    <radialGradient id="vaultDoor" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#383838"/>
      <stop offset="60%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>

    <linearGradient id="vaultRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f4f4f"/>
      <stop offset="50%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>

    <linearGradient id="hingeGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#151515"/>
      <stop offset="30%" stop-color="#404040"/>
      <stop offset="70%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="outerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="realShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Golden Glow behind squircle -->
  <rect x="30" y="30" width="452" height="452" rx="96" fill="url(#bgGlow)" />

  <!-- Outer Squircle Border (Subtle Gold) -->
  <rect x="42" y="42" width="428" height="428" rx="88" fill="none" stroke="url(#goldDark)" stroke-width="1.5" opacity="0.8"/>

  <!-- Main Squircle Body -->
  <rect x="44" y="44" width="424" height="424" rx="86" fill="url(#metalBg)" filter="url(#outerShadow)" />
  
  <!-- Subtle inner edge highlight for Squircle -->
  <rect x="45" y="45" width="422" height="422" rx="85" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>

  <!-- GOLDEN RIBBON (Behind Vault) -->
  <g filter="url(#realShadow)">
    <path d="M 172 260 L 340 260 L 340 422 L 256 384 L 172 422 Z" fill="url(#goldDark)" />
    <!-- Ribbon Inner Highlight -->
    <path d="M 175 260 L 337 260 L 337 416 L 256 379 L 175 416 Z" fill="url(#goldLight)" opacity="0.9" />
  </g>

  <!-- VAULT SYSTEM GROUP -->
  <g transform="translate(0, -10)">
    
    <!-- Outer Ring Shadow -->
    <circle cx="256" cy="236" r="132" fill="none" stroke="#000000" stroke-width="15" opacity="0.5" filter="url(#realShadow)"/>

    <!-- Vault Outer Frame Ring -->
    <circle cx="256" cy="234" r="130" fill="url(#vaultRing)" stroke="url(#goldDark)" stroke-width="3" />
    <circle cx="256" cy="234" r="116" fill="url(#vaultDoor)" stroke="#111111" stroke-width="2" />

    <!-- Gold Rivets on Outer Ring -->
    <!-- Rivet Helper values: cx = 256 + R*cos(a), cy = 234 + R*sin(a). R = 123 -->
    <g fill="url(#goldRad)" stroke="#322207" stroke-width="0.75">
      <circle cx="256" cy="111" r="5" /> <!-- 270 deg -->
      <circle cx="343" cy="147" r="5" /> <!-- 315 deg -->
      <circle cx="379" cy="234" r="5" /> <!-- 0 deg -->
      <circle cx="343" cy="321" r="5" /> <!-- 45 deg -->
      <circle cx="256" cy="357" r="5" /> <!-- 90 deg -->
      <circle cx="169" cy="321" r="5" /> <!-- 135 deg -->
      <!-- Left side rivets partially covered or adapted, keeping them for symmetry -->
      <circle cx="133" cy="234" r="5" /> <!-- 180 deg -->
      <circle cx="169" cy="147" r="5" /> <!-- 225 deg -->
    </g>

    <!-- Inner Golden Vault Ridge Accent -->
    <circle cx="256" cy="234" r="92" fill="none" stroke="url(#goldDark)" stroke-width="2" opacity="0.5"/>

    <!-- HINGE ASSEMBLY (Left side) -->
    <g filter="url(#realShadow)">
      <!-- Connector to wall -->
      <rect x="120" y="212" width="40" height="44" fill="url(#vaultRing)" rx="2" stroke="#111" stroke-width="1"/>
      <rect x="125" y="222" width="30" height="24" fill="url(#goldDark)" rx="1"/>
      <!-- Main vertical hinge bar -->
      <rect x="114" y="174" width="22" height="120" fill="url(#hingeGrad)" rx="3" stroke="#111" stroke-width="1.5"/>
      <!-- Gold hinge caps & rings -->
      <rect x="114" y="170" width="22" height="7" fill="url(#goldLight)" rx="1" />
      <rect x="114" y="291" width="22" height="7" fill="url(#goldLight)" rx="1" />
      <rect x="112" y="210" width="26" height="6" fill="url(#goldLight)" rx="1" />
      <rect x="112" y="252" width="26" height="6" fill="url(#goldLight)" rx="1" />
    </g>

    <!-- THE GOLDEN WHEEL -->
    <g filter="url(#realShadow)">
      <!-- Spokes (6 Spokes) -->
      <!-- Center of wheel is at (256, 234) -->
      <g stroke="url(#goldLight)" stroke-width="12" stroke-linecap="round">
        <line x1="256" y1="234" x2="256" y2="154" />
        <line x1="256" y1="234" x2="325" y2="274" />
        <line x1="256" y1="234" x2="187" y2="274" />
        <line x1="256" y1="234" x2="256" y2="314" />
        <line x1="256" y1="234" x2="325" y2="194" />
        <line x1="256" y1="234" x2="187" y2="194" />
      </g>
      <!-- Dual Inner Spoke Highlights for 3D metallic feel -->
      <g stroke="url(#goldDark)" stroke-width="4" stroke-linecap="round" opacity="0.7">
        <line x1="256" y1="234" x2="256" y2="158" />
        <line x1="256" y1="234" x2="321" y2="271" />
        <line x1="256" y1="234" x2="191" y2="271" />
        <line x1="256" y1="234" x2="256" y2="310" />
        <line x1="256" y1="234" x2="321" y2="197" />
        <line x1="256" y1="234" x2="191" y2="197" />
      </g>

      <!-- Wheel Outer Ring -->
      <circle cx="256" cy="234" r="76" fill="none" stroke="url(#goldDark)" stroke-width="10" />
      <circle cx="256" cy="234" r="76" fill="none" stroke="url(#goldLight)" stroke-width="6" />
      <circle cx="256" cy="234" r="71" fill="none" stroke="#3d2c0a" stroke-width="1.5" />

      <!-- Center Wheel Hub (Stacked Cap) -->
      <circle cx="256" cy="234" r="30" fill="url(#goldDark)" stroke="#2d2105" stroke-width="1" />
      <circle cx="256" cy="234" r="24" fill="url(#goldRad)" />
      <circle cx="256" cy="234" r="20" fill="url(#goldLight)" />
      <circle cx="256" cy="234" r="14" fill="url(#goldDark)" />
      <circle cx="254" cy="232" r="8" fill="#fff" opacity="0.3" filter="blur(1px)"/> <!-- Highlight spot -->
    </g>

  </g>
</svg>